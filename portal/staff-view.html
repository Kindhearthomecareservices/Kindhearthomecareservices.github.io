<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f5faf6}*{box-sizing:border-box}body{font-family:Inter,system-ui;background:var(--bg);margin:0}.nav{background:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;box-shadow:0 4px 16px #0001;position:sticky;top:0;z-index:9}.nav img{width:44px}.nav b{color:var(--blue);font-size:18px}.nav b span{color:var(--green)}.wrap{max-width:480px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 26px #14495f12;border:1px solid #e6efe7}.input{width:100%;padding:14px;border-radius:14px;border:1.8px solid #ddeadd;font-size:15px;margin:8px 0}.btn{padding:12px 22px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.green{background:var(--blue);color:#fff}.lime{background:var(--green);color:#fff}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.badge-nurse{background:#e0f2e9;color:#1a6d3a}.badge-care{background:#fff3cd;color:#8a6d00}.task{display:flex;gap:10px;padding:12px;border-bottom:1px solid #eef4ef;align-items:center}.done{opacity:.5;text-decoration:line-through}.photo{width:100%;border-radius:14px;margin-top:8px}</style></head><body>
<div class="nav"><img src="logo.png"><div><b>Kind<span>Heart</span> - Staff</b><div style="font-size:10px;letter-spacing:2px;color:var(--blue);font-weight:700" id="roleHeader">HOMECARE SERVICES</div></div><div style="margin-left:auto"><a href="https://kindhearthomecareservices.co.ke" style="font-size:12px;font-weight:800;color:var(--blue);text-decoration:none">Website</a></div></div>
<div class="wrap">
<div id="login" class="card"><h3 style="color:var(--blue);margin:0 0 12px" id="loginTitle">Staff Login</h3><select id="nurseSel" class="input"></select><input id="pin" class="input" type="password" placeholder="Enter Your PIN - Admin gave you"><button class="btn green" style="width:100%" onclick="login()">Login</button></div>
<div id="app" style="display:none"><div class="card"><h3 id="nName" style="color:var(--blue);margin:0"></h3><div style="margin-top:6px"><span id="roleBadge" class="badge badge-nurse">NURSE</span></div><div style="margin-top:12px"><button class="btn green" onclick="loadMyPatients()">Refresh My Patients</button><button class="btn" style="background:#fee4e4;color:#c00;margin-left:6px" onclick="logout()">Logout</button></div></div><div id="myList"></div>
<div class="card"><h4 style="color:var(--blue);margin:0 0 8px">Document Care - Nursing Notes / Caregiver Notes</h4><select id="patSel" class="input"></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="bp" class="input" placeholder="BP e.g. 120/80"><input id="temp" class="input" placeholder="Temperature"></div><textarea id="note" class="input" placeholder="Write Nursing Notes / Caregiver Notes - Family and Admin will see this"></textarea><input type="file" id="photo" accept="image/*" capture="environment" style="margin:8px 0"><button class="btn lime" onclick="saveDoc()" style="width:100%">Save with Photo + Notes - Visible to Admin and Family</button><div id="msg" style="color:var(--green);font-weight:700;margin-top:10px"></div></div>
<div class="card"><h4 style="margin:0 0 8px">Today Progress - Live to Family and Admin</h4><div id="progress"></div></div></div>
</div>
<script>
const SUPA_URL="https://enlveleqbqbmhamyqtxzj.supabase.co"; const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curNurse=null;
async function init(){let {data}=await supa.from('nurses').select('*').order('full_name'); nurseSel.innerHTML=(data||[]).map(n=>{let role=n.staff_type||n.role||'Nurse'; return `<option value="${n.id}">${role}: ${n.full_name}</option>`}).join('')||'<option>No staff - Add in Admin</option>';}
function logout(){sessionStorage.removeItem('kh_staff'); location.reload();}
async function login(){let id=nurseSel.value; let pinVal=pin.value; if(!pinVal)return alert('Enter PIN'); let {data,error}=await supa.from('nurses').select('*').eq('id',id).single(); if(error||!data)return alert('Staff not found'); if(data.pin!==pinVal)return alert('Wrong PIN'); curNurse=data; sessionStorage.setItem('kh_staff',JSON.stringify(data)); showLoggedIn();}
function showLoggedIn(){let role=curNurse.staff_type||curNurse.role||'Nurse'; login.style.display='none'; app.style.display='block'; nName.innerText='Hello '+curNurse.full_name; roleBadge.innerText=role.toUpperCase(); roleBadge.className='badge '+(role==='Caregiver'?'badge-care':'badge-nurse'); roleHeader.innerText=role.toUpperCase()+' PORTAL'; loginTitle.innerText=role+' Login'; loadMyPatients();}
if(sessionStorage.getItem('kh_staff')){curNurse=JSON.parse(sessionStorage.getItem('kh_staff')); showLoggedIn();}
async function loadMyPatients(){let today=new Date().toISOString().split('T')[0]; let {data:assigns}=await supa.from('patient_assignments').select('*, patients(*)').eq('nurse_id',curNurse.id).eq('is_active',true); let {data:recs}=await supa.from('care_records').select('*').eq('nurse_id',curNurse.id).eq('record_date',today); patSel.innerHTML=(assigns||[]).map(a=>`<option value="${a.patients.id}">${a.patients.full_name}</option>`).join('')||'<option>No patients assigned</option>'; let html=''; for(let a of assigns||[]){let pat=a.patients; let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pat.id); let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pat.id); html+=`<div class="card" style="border-left:5px solid var(--green)"><b style="color:var(--blue)">${pat.full_name}</b><div style="margin-top:10px"><b>Daily Tasks - Tick + Add Notes</b>${(tasks||[]).map(t=>{let done=recs?.some(r=>r.details?.task===t.task_name); return `<div class="task ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doTask('${pat.id}','${t.task_name.replace(/'/g,'')}')"><span>${t.time_to_do||''} ${t.task_name}</span></div>`}).join('')||'<br><small>No tasks assigned by Admin</small>'}</div><div style="margin-top:10px"><b>Medications - Tick when taken + Notes</b>${(meds||[]).map(m=>{let done=recs?.some(r=>r.details?.med===m.medication_name); return `<div class="task ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doMed('${pat.id}','${m.medication_name.replace(/'/g,'')}','${(m.dosage||'').replace(/'/g,'')}')"><span>${m.time_to_give||''} ${m.medication_name} ${m.dosage||''} ${m.frequency||''} - ${m.duration||''}</span></div>`}).join('')||'<br><small>No meds assigned</small>'}</div></div>`;} myList.innerHTML=html||'<div class="card">No patients assigned - Ask Admin to assign you</div>'; progress.innerHTML=(recs||[]).map(r=>`<div style="padding:8px 0;border-bottom:1px solid #f0f5f1"><small><b>${r.record_type}</b>: ${r.details.task||r.details.med||''} ${r.details?.note?`<br>Notes: ${r.details.note}`:''} ${r.photo_url?`<a href="${r.photo_url}" target="_blank">View Photo</a>`:''} • ${new Date(r.created_at).toLocaleTimeString()}</small></div>`).join('')||'<small>No records today</small>';}
async function doTask(pid,t){let notes=prompt('Add Nursing Notes / Caregiver Notes for: '+t,''); await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'task',details:{task:t,note:notes||''}}); loadMyPatients();}
async function doMed(pid,m,dose){let notes=prompt('Add Notes for medication '+m+': e.g. Patient took well',''); await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'medication',details:{med:m,dosage:dose,note:notes||''}}); loadMyPatients();}
async function saveDoc(){let pid=patSel.value; if(!pid)return alert('Select patient'); let file=document.getElementById('photo').files[0]; let url=null; if(file){let name=Date.now()+'_'+file.name.replace(/\s/g,'_'); let up=await supa.storage.from('patient-photos').upload(name,file); if(up.error){alert(up.error.message); return;} url=supa.storage.from('patient-photos').getPublicUrl(name).data.publicUrl;} let {error}=await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:file?'photo':'note',details:{vitals:{bp:bp.value,temp:temp.value},note:note.value},photo_url:url}); if(error){alert(error.message); return;} msg.innerText='Saved - Admin and Family can see it live now'; bp.value=''; temp.value=''; note.value=''; photo.value=''; loadMyPatients();}
init();
</script></body></html>
