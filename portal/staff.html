<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff - KindHeart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--green:#0f7a4d;--bg:#f6faf8}body{margin:0;font-family:system-ui;background:var(--bg)}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.logo{font-weight:800;color:var(--green)} a{color:var(--green);text-decoration:none;font-weight:600;margin-left:12px;font-size:13px}
.tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;overflow:auto;border-bottom:1px solid #eee}
.tab{padding:8px 14px;border-radius:20px;background:#eef4f0;border:0;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--green);color:#fff}
.container{max-width:1100px;margin:14px auto;padding:0 12px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;box-sizing:border-box}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
button.out{background:#eee;color:#222}
.patientHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.allergy{background:#fde8e8;color:#c00;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:800}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;background:#e7f5ee;color:var(--green)}.badge.crit{background:#fde8e8;color:#c00}
.row{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;display:flex;justify-content:space-between}
</style>
</head><body>
<div class="header"><div class="logo">KH Staff — <span id="staffName"></span></div><div><a href="tel:0707546365">0707546365</a><a href="https://kindhearthomecareservices.co.ke" target="_blank">Website</a><a href="./index.html">Logout</a></div></div>

<div class="container">
<div class="card">
<label>Select My Patient (Assigned to you)</label>
<select id="patientSelect" onchange="loadPatient()"></select>
<div id="patientInfo" class="patientHead" style="margin-top:10px"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="openTab('vitals')">Vitals</button>
<button class="tab" onclick="openTab('notes')">Nursing Notes</button>
<button class="tab" onclick="openTab('treatment')">Treatment Sheet</button>
<button class="tab" onclick="openTab('meds')">Meds Given</button>
<button class="tab" onclick="openTab('consum')">Consumables</button>
<button class="tab" onclick="openTab('missing')">Report Missing</button>
</div>

<div class="card" id="formArea"></div>
<div class="card"><h4 style="margin:0 0 8px" id="listTitle">Records</h4><div id="list"></div></div>
</div>

<script>
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
if(localStorage.getItem('kh_role')!=='staff'){location.href='./index.html'}
const nurseId = localStorage.getItem('kh_nurse_id');
document.getElementById('staffName').textContent = localStorage.getItem('kh_nurse_name')||'Staff';
let currentPatient=null, currentTab='vitals', patients=[];

async function init(){
  const {data} = await supa.from('patient_staff').select('patient_id,shift_type,patients(*)').eq('nurse_id',nurseId).eq('is_active',true);
  patients = (data||[]).map(d=>({...d.patients, shift_type:d.shift_type}));
  const sel=document.getElementById('patientSelect'); sel.innerHTML = patients.map(p=>`<option value="${p.id}">${p.full_name} - ${p.shift_type} - ${p.location||''}</option>`).join('');
  if(patients[0]){ sel.value=patients[0].id; loadPatient(); }
}
init();

async function loadPatient(){
  const id=document.getElementById('patientSelect').value; if(!id)return;
  currentPatient = patients.find(p=>p.id===id);
  document.getElementById('patientInfo').innerHTML=`<div><b>${currentPatient.full_name}</b> Age:${currentPatient.age||'-'} | ${currentPatient.diagnosis||''} | ${currentPatient.location||''} | Shift:${currentPatient.shift_type}</div><div>${currentPatient.allergies?`<span class="allergy">⚠️ Allergy: ${currentPatient.allergies}</span>`:''}</div>`;
  render();
}
function openTab(t){ currentTab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); render(); }

async function render(){
  if(!currentPatient)return; const form=document.getElementById('formArea'); const list=document.getElementById('list'); const title=document.getElementById('listTitle');
  if(currentTab==='vitals'){
    title.textContent='Vitals History - O2 90-100 Normal, Sugar mmol/L';
    form.innerHTML=`<h4>Record Vital Signs</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <input id="v_sys" type="number" placeholder="BP Systolic"><input id="v_dia" type="number" placeholder="BP Diastolic">
    <input id="v_temp" type="number" step="0.1" placeholder="Temp °C"><input id="v_pulse" type="number" placeholder="Pulse bpm">
    <input id="v_oxy" type="number" placeholder="Oxygen % (90-100 Normal)"><input id="v_sugar" type="number" step="0.1" placeholder="Blood Sugar mmol/L">
    <input id="v_weight" type="number" step="0.1" placeholder="Weight kg">
    </div><textarea id="v_notes" placeholder="Notes"></textarea><button onclick="saveVitals()">Save Vitals - Auto flags Abnormal</button>`;
    const {data}=await supa.from('vitals').select('*').eq('patient_id',currentPatient.id).order('created_at',{ascending:false}).limit(20);
    list.innerHTML=(data||[]).map(v=>`<div class="row"><div>BP ${v.bp_systolic||'-'}/${v.bp_diastolic||'-'} | T ${v.temperature||'-'} | P ${v.pulse||'-'} | O2 ${v.oxygen||'-'}% | Sugar ${v.blood_sugar||'-'} mmol/L | <span class="badge ${v.is_abnormal?'crit':''}">${v.severity} ${v.abnormal_flags||''}</span><br><small>${new Date(v.created_at).toLocaleString()}</small></div></div>`).join('');
  }
  if(currentTab==='notes'){
    title.textContent='Nursing / Caregiver Notes'; form.innerHTML=`<h4>Document Care</h4><textarea id="n_note" placeholder="What was done..."></textarea><button onclick="saveNote()">Save Note</button>`;
    const {data}=await supa.from('care_notes').select('*').eq('patient_id',currentPatient.id).order('created_at',{ascending:false}).limit(30);
    list.innerHTML=(data||[]).map(n=>`<div class="row"><div>${n.note}<br><small>${new Date(n.created_at).toLocaleString()}</small></div></div>`).join('');
  }
  if(currentTab==='treatment'){
    title.textContent='Treatment Sheet - Mark Administered';
    const {data}=await supa.from('treatment_sheet').select('*').eq('patient_id',currentPatient.id).eq('status','Active').order('created_at',{ascending:false});
    form.innerHTML=`<div class="small" style="margin-bottom:8px">Tap "Give" to mark administered - reduces Remaining count</div>`;
    list.innerHTML=(data||[]).map(t=>`<div class="row"><div><b>${t.drug_name} ${t.dose||''}</b> ${t.frequency} | Duration:${t.duration||'-'}<br><small>Given:${t.quantity_given} Remaining:${t.quantity_remaining}</small></div><div><button onclick="giveMed('${t.id}')">Give</button></div></div>`).join('')||'No active treatment';
  }
  if(currentTab==='meds'){
    title.textContent='Medication Administered Log';
    form.innerHTML=`<div class="small">Log auto-created when you Give from Treatment tab</div>`;
    const {data}=await supa.from('medication_given').select('*,treatment_sheet(drug_name)').eq('patient_id',currentPatient.id).order('created_at',{ascending:false}).limit(30);
    list.innerHTML=(data||[]).map(m=>`<div class="row"><div>${m.treatment_sheet?.drug_name||'Med'} given<br><small>${new Date(m.time_given).toLocaleString()}</small></div></div>`).join('');
  }
  if(currentTab==='consum'){
    title.textContent='Consumables Used'; form.innerHTML=`<h4>Log Consumable</h4><input id="c_item" placeholder="Item e.g Gloves, Gauze"><input id="c_qty" type="number" placeholder="Qty"><button onclick="saveConsum()">Save</button>`;
    const {data}=await supa.from('consumables').select('*').eq('patient_id',currentPatient.id).order('created_at',{ascending:false}).limit(30);
    list.innerHTML=(data||[]).map(c=>`<div class="row"><div>${c.item_name} x${c.quantity}<br><small>${new Date(c.created_at).toLocaleString()}</small></div></div>`).join('');
  }
  if(currentTab==='missing'){
    title.textContent='Report Missing Supplies / Drugs';
    form.innerHTML=`<h4>Report</h4><input id="m_item" placeholder="Item missing"><select id="m_urg"><option>Normal</option><option>Urgent</option></select><textarea id="m_notes" placeholder="Notes"></textarea><button onclick="saveMissing()">Report Missing</button>`;
    const {data}=await supa.from('missing_reports').select('*').eq('patient_id',currentPatient.id).order('created_at',{ascending:false}).limit(30);
    list.innerHTML=(data||[]).map(r=>`<div class="row"><div>⚠️ ${r.item_name} - ${r.urgency}<br><small>${r.notes||''} - ${new Date(r.created_at).toLocaleString()}</small></div></div>`).join('');
  }
}

async function saveVitals(){
  const payload={ patient_id:currentPatient.id, nurse_id:nurseId,
    bp_systolic:parseInt(document.getElementById('v_sys').value)||null, bp_diastolic:parseInt(document.getElementById('v_dia').value)||null,
    temperature:parseFloat(document.getElementById('v_temp').value)||null, pulse:parseInt(document.getElementById('v_pulse').value)||null,
    oxygen:parseInt(document.getElementById('v_oxy').value)||null, blood_sugar:parseFloat(document.getElementById('v_sugar').value)||null,
    weight:parseFloat(document.getElementById('v_weight').value)||null, notes:document.getElementById('v_notes').value };
  const {error}=await supa.from('vitals').insert(payload); if(error) alert(error.message); else{alert('Vitals saved - abnormal flagged if any'); render();}
}
async function saveNote(){ const note=document.getElementById('n_note').value.trim(); if(!note)return; await supa.from('care_notes').insert({patient_id:currentPatient.id,nurse_id:nurseId,note}); render(); }
async function giveMed(tid){
  const {data:t} = await supa.from('treatment_sheet').select('*').eq('id',tid).single(); if(t.quantity_remaining<=0) return alert('No remaining!');
  await supa.from('medication_given').insert({patient_id:currentPatient.id,nurse_id:nurseId,treatment_id:tid});
  await supa.from('treatment_sheet').update({quantity_remaining:t.quantity_remaining-1}).eq('id',tid);
  alert('Marked administered - Remaining now '+(t.quantity_remaining-1)); render();
}
async function saveConsum(){ const item_name=document.getElementById('c_item').value.trim(); const quantity=parseInt(document.getElementById('c_qty').value)||1; if(!item_name)return; await supa.from('consumables').insert({patient_id:currentPatient.id,nurse_id:nurseId,item_name,quantity}); render(); }
async function saveMissing(){ const item_name=document.getElementById('m_item').value.trim(); const urgency=document.getElementById('m_urg').value; const notes=document.getElementById('m_notes').value; if(!item_name)return; await supa.from('missing_reports').insert({patient_id:currentPatient.id,nurse_id:nurseId,item_name,urgency,notes}); alert('Reported'); render(); }
</script>
</body></html>
