<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family - KindHeart Premium</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>.card{border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}.badge-diab{background:#dcfce7;color:#166534}.badge-when{background:#fef9c3;color:#854d0e}</style></head><body class="bg-[#f6f7f8]">
<header class="bg-white sticky top-0 z-50 border-b"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><img src="logo.png" class="h-9 w-9 rounded-full"><div><p class="font-bold" id="pName">Family Portal</p><p class="text-xs text-gray-500" id="pDiabBadge">Premium Live Feed</p></div></div><div class="flex gap-2"><span id="attending" class="bg-teal-50 text-teal-700 rounded-full px-3 py-1.5 text-xs">Attending: -</span><button onclick="localStorage.clear();location.href='index.html'" class="bg-gray-100 rounded-full px-3 py-1.5 text-sm">Logout</button></div></div></header>
<main class="max-w-6xl mx-auto p-4 space-y-4">
<div class="grid md:grid-cols-3 gap-4"><div class="card bg-white p-5 md:col-span-2"><h3 class="font-bold">Vitals Trends - O2 Normal 90-100, Sugar mmol/L</h3><canvas id="o2Chart" height="120"></canvas><canvas id="sugarChart" height="120" class="mt-4"></canvas></div><div class="space-y-4"><div class="card bg-white p-5"><h3 class="font-bold text-sm">Medication Status</h3><div id="medStatus" class="mt-3 space-y-2 text-sm"></div></div><div class="card bg-white p-5"><h3 class="font-bold text-sm">Missing Supplies - Urgent</h3><div id="missingList" class="mt-3 space-y-2 text-sm"></div></div></div></div>
<div class="card bg-white p-5"><div class="flex justify-between items-center"><h3 class="font-bold">Premium Live Feed - See everything staff does</h3><button onclick="loadAll()" class="bg-gray-100 rounded-full px-3 py-1 text-xs">Refresh</button></div><p class="text-xs text-gray-500">Care Notes + Vitals + Meds Given (AM/PM green logic) + Consumables</p><div id="liveFeed" class="mt-4 space-y-2"></div></div>
</main>
<script>
const SB_URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const SB_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const sb=supabase.createClient(SB_URL, SB_KEY);
const patientId=localStorage.getItem('patient_id'); let isDiabetic=false; let o2Chart, sugarChart;
async function init(){
 if(!patientId){alert('Login via family code first'); location.href='index.html'; return;}
 const {data:pat}=await sb.from('patients').select('*').eq('id',patientId).single();
 if(!pat)return; isDiabetic=pat.is_diabetic||false;
 document.getElementById('pName').innerText=pat.full_name;
 document.getElementById('pDiabBadge').innerHTML= isDiabetic? '<span class="badge-diab px-2 py-0.5 rounded-full text-xs">Diabetic - Staff sees BD/TDS twice daily</span>' : '<span class="badge-when px-2 py-0.5 rounded-full text-xs">When necessary - No routine twice daily</span>';
 const {data:assign}=await sb.from('patient_staff').select('*,nurses(full_name,staff_type)').eq('patient_id',patientId).order('id',{ascending:false}).limit(1).maybeSingle();
 if(assign) document.getElementById('attending').innerText='Attending: '+(assign.nurses?.full_name||'')+' ('+(assign.nurses?.staff_type||'')+') - '+assign.shift_type;
 loadAll();
}
async function loadAll(){ loadVitalsTrend(); loadMeds(); loadMissing(); loadFeed(); }
async function loadVitalsTrend(){
 const {data}=await sb.from('vitals').select('*').eq('patient_id',patientId).order('created_at',{ascending:true}).limit(20);
 const labels=(data||[]).map(v=> new Date(v.created_at).toLocaleDateString());
 const o2=(data||[]).map(v=> v.oxygen); const sugar=(data||[]).map(v=> v.blood_sugar);
 if(o2Chart) o2Chart.destroy(); if(sugarChart) sugarChart.destroy();
 o2Chart=new Chart(document.getElementById('o2Chart'),{type:'line',data:{labels,datasets:[{label:'O2 % (90-100 Normal)',data:o2,borderColor:'#0f766e',tension:0.3}]}});
 sugarChart=new Chart(document.getElementById('sugarChart'),{type:'line',data:{labels,datasets:[{label:'Sugar mmol/L',data:sugar,borderColor:'#2563eb',tension:0.3}]}});
}
async function loadMeds(){
 const {data:meds}=await sb.from('treatment_sheet').select('*').eq('patient_id',patientId).eq('status','Active');
 const today=new Date().toISOString().split('T')[0];
 const {data:givenToday}=await sb.from('medication_given').select('*').eq('patient_id',patientId).gte('created_at',today+'T00:00:00');
 document.getElementById('medStatus').innerHTML=(meds||[]).map(m=>{
  const freq=(m.frequency||'').toLowerCase(); const isBD=freq.includes('bd')||freq.includes('twice')||freq.includes('tds')||isDiabetic;
  const givenAM=(givenToday||[]).some(g=> g.treatment_id===m.id && (g.shift==='AM'||g.shift==='Morning'||g.shift==='BD-AM'));
  const givenPM=(givenToday||[]).some(g=> g.treatment_id===m.id && (g.shift==='PM'||g.shift==='Evening'||g.shift==='BD-PM'));
  const badge=isDiabetic||isBD? (givenAM&&givenPM?'✅ DONE TODAY (BD)': givenAM?'AM Done - Waiting PM':'⏳ Pending') : (givenAM||givenPM?'✅ Given when necessary':'⏳ PRN');
  const colorClass=isDiabetic||isBD? (givenAM&&givenPM?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-800') : 'bg-yellow-50 text-yellow-800';
  return `<div class="flex justify-between items-center border-b py-2"><div><p class="font-bold">${m.medication_name||m.drug_name} <span class="text-xs">${m.dose}</span></p><p class="text-xs text-gray-500">${m.frequency} • ${m.duration||m.duration_text} • Rem:${m.quantity_remaining}</p></div><span class="text-xs px-2 py-0.5 rounded-full ${colorClass}">${badge}</span></div>`
 }).join('')||'<p class="text-xs text-gray-500">No active meds</p>';
}
async function loadMissing(){const {data}=await sb.from('missing_reports').select('*').eq('patient_id',patientId).order('created_at',{ascending:false}).limit(10); document.getElementById('missingList').innerHTML=(data||[]).map(m=>`<div class="flex justify-between"><span>${m.item_name}</span><span class="text-xs px-2 py-0.5 rounded-full ${m.urgency==='Critical'?'bg-red-100 text-red-700':m.urgency==='Urgent'?'bg-orange-100 text-orange-700':'bg-gray-100'}">${m.urgency}</span></div>`).join('')||'<p class="text-xs text-gray-400">No missing items</p>'}
async function loadFeed(){
 let care=[], vit=[], meds=[], cons=[];
 try{ care=(await sb.from('care_notes').select('*,nurses(full_name,staff_type)').eq('patient_id',patientId).order('created_at',{ascending:false}).limit(15)).data||[] }catch(e){}
 try{ vit=(await sb.from('vitals').select('*,nurses(full_name)').eq('patient_id',patientId).order('created_at',{ascending:false}).limit(15)).data||[] }catch(e){}
 try{ meds=(await sb.from('medication_given').select('*,nurses(full_name)').eq('patient_id',patientId).order('created_at',{ascending:false}).limit(15)).data||[] }catch(e){}
 try{ cons=(await sb.from('consumables').select('*,nurses(full_name)').eq('patient_id',patientId).order('created_at',{ascending:false}).limit(15)).data||[] }catch(e){}
 const all=[
 ...care.map(c=>({t:c.created_at, html:`<div class="card bg-white p-4 border-l-4 border-teal-600"><span class="text-xs bg-teal-50 text-teal-700 px-2 py-0.5 rounded-full">CARE NOTE • ${c.nurses?.staff_type||''}</span><p class="text-sm mt-1">${c.note||c.notes}</p><p class="text-xs text-gray-500 mt-1">${c.nurses?.full_name} | ${new Date(c.created_at).toLocaleString()}</p></div>`})),
 ...vit.map(v=>({t:v.created_at, html:`<div class="card bg-white p-4 border-l-4 border-blue-500"><span class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">VITALS</span><p class="text-sm mt-1">BP ${v.bp_systolic||'-'}/${v.bp_diastolic||'-'} | O2 ${v.oxygen||'-'}% | Sugar ${v.blood_sugar||'-'} mmol/L | Pulse ${v.pulse||'-'}</p><p class="text-xs text-gray-500">${v.nurses?.full_name} | ${new Date(v.created_at).toLocaleString()} ${v.notes||''}</p></div>`})),
 ...meds.map(m=>({t:m.created_at||m.given_at, html:`<div class="card bg-white p-4 border-l-4 border-green-500"><span class="text-xs bg-green-50 text-green-700 px-2 py-0.5 rounded-full">MED GIVEN ${m.shift||''}</span><p class="text-sm mt-1">${m.medication_name} ${m.dose_given||''} - ${m.shift}</p><p class="text-xs text-gray-500">${m.nurses?.full_name} | ${new Date(m.created_at||m.given_at).toLocaleString()}</p></div>`})),
 ...cons.map(c=>({t:c.created_at, html:`<div class="card bg-white p-4 border-l-4 border-yellow-500"><span class="text-xs bg-yellow-50 px-2 py-0.5 rounded-full">CONSUMABLE</span><p class="text-sm mt-1">${c.item_name} Used:${c.quantity_used} Rem:${c.quantity_remaining}</p><p class="text-xs text-gray-500">${c.nurses?.full_name}</p></div>`}))
 ].sort((a,b)=> new Date(b.t)-new Date(a.t));
 document.getElementById('liveFeed').innerHTML=all.map(a=>a.html).join('')||'<p class="text-sm text-gray-500">No activity yet - Staff will post here live</p>';
}
init();
</script></body></html>
