<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindHeart Family Premium</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#0f3440;--gold:#c7a46b;--bg:#f7f5f0}*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg)}.top{background:linear-gradient(135deg,var(--blue),#1c5466);color:#fff;padding:14px 16px;display:flex;justify-content:space-between}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid #f0eade}.cardHead{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--blue)}.vAlert{background:#fff1f1;border-left:4px solid #b91c1c;padding:10px;border-radius:10px;font-size:12px;margin:6px 0}.vNormal{background:#f3faf3;border-left:4px solid #0a7a22;padding:10px;border-radius:10px;font-size:12px;margin:6px 0}.treat{border:1px solid #f0eade;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:12px}.noteRow{padding:8px 0;border-bottom:1px solid #f5f0e6;font-size:12px;display:flex;gap:8px}.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.login{height:100vh;display:flex;align-items:center;justify-content:center}.loginCard{background:#fff;width:92%;max-width:380px;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.12)}</style></head><body>
<div id="login" class="login"><div class="loginCard"><div style="width:56px;height:56px;background:linear-gradient(135deg,#0f3440,#1c5466);border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px">♥</div><h2>KindHeart <span style="color:#c7a46b">Family</span></h2><p style="font-size:12px;color:#666">Premium Live Care<br>0707546365</p><input id="code" style="width:100%;padding:14px;border-radius:12px;border:1.5px solid #e6ddd0;margin:8px 0;text-align:center" placeholder="Family Code KHA5577"><button onclick="doLogin()" style="width:100%;padding:14px;border-radius:100px;border:none;background:#0f3440;color:#fff;font-weight:800">View My Loved One 🔒</button><p id="err" style="color:red;font-size:12px;display:none"></p></div></div>
<div id="app" style="display:none"><div class="top"><div><b>KindHeart <span style="color:#c7a46b">Family</span></b><div style="font-size:10px" id="topSub">0707546365 | kindhearthomecareservices.co.ke</div></div><button onclick="logout()" style="background:#fff;color:#0f3440;border:none;padding:8px 14px;border-radius:20px;font-weight:700">Exit</button></div><div id="patBar" style="background:#fff;margin:12px;border-radius:12px;padding:10px 14px;font-size:12px;display:flex;justify-content:space-between"></div><div class="card"><div class="cardHead"><span>Latest Vitals — Actual Numbers with Alerts</span><span style="background:#f8f3e8;padding:4px 8px;border-radius:20px">LIVE</span></div><div id="vitals"></div></div><div class="card"><div class="cardHead"><span>Treatment Sheet — Time Given</span><span id="tDay"></span></div><div id="treats"></div></div><div class="card"><div class="cardHead"><span>Care Done — Nursing Notes / Caregiving Notes</span><span id="nCount"></span></div><div id="notes"></div></div><div class="card"><div class="cardHead"><span>Consumables Used — Consumed Status</span></div><div id="cons"></div></div><div class="card"><div class="cardHead"><span>📅 Doctor Appointments</span></div><div id="appts"></div></div></div>
<script>
const SUPA_URL="https://enlvelqeqbmhamyqtxzj.supabase.co";const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";const supa=supabase.createClient(SUPA_URL,SUPA_KEY);let cur=null;
async function doLogin(){let c=code.value.trim().toUpperCase();let {data,error}=await supa.from('patients').select('*').or(`family_code.eq.${c},family_pin.eq.${c}`).maybeSingle();if(error||!data){err.style.display='block';err.innerText='Code not found - Ask Admin';return;}cur=data;sessionStorage.setItem('fam',JSON.stringify(data));showApp();}
function showApp(){let p=JSON.parse(sessionStorage.getItem('fam'));if(!p)return;cur=p;login.style.display='none';app.style.display='block';let diff=Math.ceil((new Date()-new Date(p.created_at))/86400000);patBar.innerHTML=`<div><b>${p.full_name} - ${p.family_code} - ${p.location||'Eldoret'}</b><div>Care Started: ${new Date(p.created_at).toISOString().split('T')[0]} — Day ${diff} of care</div></div><div style="background:#0f3440;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">Day ${diff}</div>`;loadAll();}
function logout(){sessionStorage.removeItem('fam');location.reload();}
if(sessionStorage.getItem('fam'))showApp();
async function loadAll(){loadVitals();loadTreats();loadNotes();loadCons();loadAppts();}
async function loadVitals(){let {data}=await supa.from('vitals').select('*, nurses:staff_id(full_name)').eq('patient_id',cur.id).order('created_at',{ascending:false}).limit(5);vitals.innerHTML=(data||[]).map(v=>{let ab=v.is_abnormal||(v.spo2&&(v.spo2<89||v.spo2>100));let cls=ab?'vAlert':'vNormal';return `<div class="${cls}">${new Date(v.created_at).toLocaleString()} - ${v.bp||''}, Temp ${v.temp||''}°C, SpO2 ${v.spo2||''}% (Normal 89-100%), HR ${v.hr||''} — ${v.nurses?.full_name||'Nurse'} ${ab?'🔴 ABNORMAL ALERT':''}</div>`;}).join('')||'No vitals yet';}
async function loadTreats(){let {data:sheet}=await supa.from('treatment_sheet').select('*').eq('patient_id',cur.id).order('created_at');let today=new Date().toISOString().split('T')[0];let {data:given}=await supa.from('medication_given').select('*').eq('patient_id',cur.id).eq('given_date',today);tDay.innerText=sheet?.[0]?`Day 1 of ${sheet[0].duration}`:'';treats.innerHTML=(sheet||[]).map(s=>{let g=(given||[]).filter(x=>x.treatment_id===s.id);let times=g.map(x=>x.given_time).join(', ')||'Pending today';return `<div class="treat"><div><b>${s.medication_name} ${s.frequency}</b> - ${times}<br><small>Total ${s.dosage}, ${s.dosage?parseInt(s.dosage)-g.length+' left':''}</small></div><div style="background:#0f3440;color:#fff;padding:4px 8px;border-radius:20px;font-size:10px">${g.length?`Given at ${times}`:'Not yet'}</div></div>`;}).join('')||'No treatment sheet';}
async function loadNotes(){let {data}=await supa.from('care_notes').select('*, nurses:staff_id(full_name,staff_type)').eq('patient_id',cur.id).order('created_at',{ascending:false}).limit(20);nCount.innerText=`${data?.length||0} today`;notes.innerHTML=(data||[]).map(n=>{let isN=(n.nurses?.staff_type||'').toLowerCase().includes('nurse');return `<div class="noteRow"><div class="avatar">${(n.nurses?.full_name||'J').charAt(0)}</div><div><div><b>${n.nurses?.full_name||'Jackie'}</b> <span style="background:${isN?'#e6f0f3':'#fdf3d6'};padding:2px 6px;border-radius:6px;font-size:10px">${isN?'Nursing Notes':'Caregiving Notes'}</span> <small>${new Date(n.created_at).toLocaleString()}</small></div><div>${n.note}</div></div></div>`;}).join('')||'No notes yet';}
async function loadCons(){let {data}=await supa.from('consumables').select('*').eq('patient_id',cur.id).order('created_at',{ascending:false}).limit(10);cons.innerHTML=(data||[]).map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee;font-size:11px"><span>${new Date(c.created_at).toLocaleString()} - ${c.item_name} ${c.qty_used}x</span><span style="${c.status.includes('Depleted')?'color:red;font-weight:700':c.status.includes('About')?'color:#b36b00':''}">${c.status}</span></div>`).join('')||'No consumables';}
async function loadAppts(){let {data}=await supa.from('appointments').select('*, nurses:staff_id(full_name)').eq('patient_id',cur.id).order('created_at',{ascending:false});appts.innerHTML=(data||[]).map(a=>`<div class="treat">📅 ${a.appointment_date||''} ${a.appointment_time||''} - ${a.hospital||''} - Dr ${a.doctor_name||''} - ${a.purpose||''}</div>`).join('')||'No appointments';}
setInterval(()=>{if(cur)loadAll();},5000);
</script></body></html>
