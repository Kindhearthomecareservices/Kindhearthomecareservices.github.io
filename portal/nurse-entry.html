<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><style>:root{--b:#14495f;--g:#5ca94a}body{margin:0;font-family:Inter,sans-serif;background:#f8faf6}.i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0;background:#fff;outline:none}.cd{background:#fff;border-radius:16px;padding:14px;margin:10px;box-shadow:0 6px 18px rgba(0,0,0,.05)}.bt{padding:12px;border-radius:100px;border:0;font-weight:800;width:100%;cursor:pointer}</style></head><body>
<div id="lk" style="position:fixed;inset:0;background:var(--b);display:flex;align-items:center;justify-content:center;padding:20px"><div class="cd" style="max-width:360px;width:100%;text-align:center"><img src="../logo.png" style="width:60px"><h3>Staff Login</h3><input id="pin" class="i" placeholder="Enter Staff PIN"><button class="bt" style="background:var(--g);color:#fff" onclick="login()">Login</button><p id="er" style="color:red;display:none"></p></div></div>
<div id="ap" style="display:none"><div class="cd" style="display:flex;align-items:center;gap:8px"><img src="../logo.png" style="width:36px"><b id="snm"></b><button style="margin-left:auto;background:#fee4e4;color:#c00;border:0;padding:6px 10px;border-radius:20px" onclick="logout()">Logout</button></div><div class="cd"><select id="psel" class="i" onchange="lt()"><option value="">Select Patient</option></select></div><div id="tw"></div><div class="cd"><h4>End of Shift</h4><textarea id="sum" class="i" placeholder="Summary notes"></textarea><button class="bt" style="background:var(--g);color:#fff" onclick="sub()">Submit Shift Report</button></div></div>
<script>
const U="https://enlvelqeqbmhamyqtxzj.supabase.co";const K="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";let supa=supabase.createClient(U,K);let nur=null;
async function login(){try{let {data,error}=await supa.from('nurses').select('*').eq('pin',pin.value.trim()).single();if(error)throw error;nur=data;localStorage.setItem('n',data.id);lk.style.display='none';ap.style.display='block';snm.innerText=data.full_name;lmp();}catch(e){er.style.display='block';er.innerText=e.message;}}
function logout(){localStorage.clear();location.reload();}
async function lmp(){let {data}=await supa.from('patient_assignments').select('patient_id, patients(id,full_name)').eq('nurse_id',nur.id);psel.innerHTML='<option value="">Select Patient</option>'+(data||[]).map(d=>`<option value="${d.patients.id}">${d.patients.full_name}</option>`).join('');}
async function lt(){let pid=psel.value;if(!pid)return;let {data:t}=await supa.from('treatment_tasks').select('*').eq('patient_id',pid);let {data:m}=await supa.from('medications').select('*').eq('patient_id',pid);let {data:d}=await supa.from('care_records').select('*').eq('patient_id',pid).eq('shift_date',new Date().toISOString().split('T')[0]);let h='';h+=(t||[]).map(x=>{let rec=d?.find(v=>v.task_id===x.id);if(rec)return `<div class="cd" style="border-left:4px solid var(--g)">✅ ${x.task_name} - ${rec.status}</div>`;return `<div class="cd"><b>${x.task_name}</b><br><small>${x.time_to_do||''}</small><input id="n_${x.id}" class="i" placeholder="Notes"><button class="bt" style="background:var(--g);color:#fff" onclick="rep('Task','${x.id}','Done')">Mark Done</button></div>`;}).join('');h+=(m||[]).map(x=>{let rec=d?.find(v=>v.medication_id===x.id);if(rec)return `<div class="cd" style="border-left:4px solid var(--b)">💊 ${x.medication_name} - ${rec.status}</div>`;return `<div class="cd"><b>💊 ${x.medication_name}</b><br><small>${x.dosage||''} ${x.time_to_give||''}</small><input id="mn_${x.id}" class="i" placeholder="Notes"><button class="bt" style="background:var(--b);color:#fff" onclick="rep('Medication','${x.id}','Given')">Mark Given</button></div>`;}).join('');tw.innerHTML=h||'<div class="cd">No tasks assigned yet</div>';}
async function rep(type,id,st){let pid=psel.value;let note=(document.getElementById(type==='Task'?'n_'+id:'mn_'+id)||{}).value||'';let pl={patient_id:pid,nurse_id:nur.id,record_type:type,status:st,details:{note:note},shift_date:new Date().toISOString().split('T')[0]};if(type==='Task')pl.task_id=id;else pl.medication_id=id;let {error}=await supa.from('care_records').insert([pl]);if(error)alert(error.message);else lt();}
async function sub(){let {error}=await supa.from('shift_reports').insert({patient_id:psel.value,nurse_id:nur.id,summary:sum.value});if(error)alert(error.message);else{alert('Shift saved');sum.value='';}}
let s=localStorage.getItem('n');if(s){supa.from('nurses').select('*').eq('id',s).single().then(({data})=>{if(data){nur=data;lk.style.display='none';ap.style.display='block';snm.innerText=data.full_name;lmp();}});}
</script></body></html>
