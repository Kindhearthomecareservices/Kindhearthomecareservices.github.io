<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--teal:#0f4a5a;--green:#6bb64a;--bg:#f7f9f6;--border:#eef2e7}*{font-family:Inter;box-sizing:border-box}body{background:var(--bg);max-width:480px;margin:0 auto;padding-bottom:100px}
.top{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.05);border:1px solid var(--border)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #d0d5dd;border-radius:12px;margin:6px 0}.btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-weight:800}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px 0;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.08)}
.tabItem{display:flex;flex-direction:column;align-items:center;color:#667085;font-size:11px;font-weight:600;cursor:pointer;padding:4px 16px;border-radius:12px}.tabItem.active{color:var(--teal);background:#e8f5e3}.page{display:none}.page.active{display:block}
.treat{border-left:4px solid var(--green);padding:10px;background:#f8faf6;border-radius:10px;margin:8px 0}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="top"><img src="logo.png" style="width:36px;height:36px;border-radius:8px"><div><b style="color:var(--teal)">KindHeart Nurse</b><br><small id="nurseInfo" style="color:#667085">Search client by name</small></div></div>

<div id="homeP" class="page active">
<div class="card"><input id="cname" placeholder="Client Name e.g Steve Torotich" list="clist" onchange="loadPatient()"><datalist id="clist"></datalist><div id="pinfo" style="margin-top:8px"></div></div>
<div class="card"><b>Treatment Sheet - Tick when given</b><div id="treats">Enter name above</div></div>
<div class="card"><b>Vital Signs</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="avpu"><option>Alert</option><option>Voice</option><option>Pain</option><option>Unresponsive</option></select><input id="bp" placeholder="BP 120/80"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="hr" placeholder="HR"><input id="temp" placeholder="Temp"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="input" placeholder="Input ml"><input id="output" placeholder="Output ml"></div><input id="pills" type="number" placeholder="Pills left"></div>
<div class="card"><textarea id="care" placeholder="Nursing Care done - Bed bath..."></textarea><textarea id="report" placeholder="Day Report - Patient stable..."></textarea><button class="btn" onclick="saveAll()">✓ Save & Submit</button><p id="msg" style="font-weight:700;margin-top:8px"></p></div>
</div>

<div id="patP" class="page"><div class="card"><b>My Clients - Tap to open</b><div id="myClients"></div></div></div>

<div class="bottomNav">
<div class="tabItem active" onclick="switchTab('homeP',this)">🏠<br>Home</div>
<div class="tabItem" onclick="switchTab('patP',this)">👥<br>Patients</div>
</div>

<script>
const URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const S=window.supabase.createClient(URL,KEY); let current=null, treatments=[];
function switchTab(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tabItem').forEach(t=>t.classList.remove('active')); el.classList.add('active');}
async function loadPatient(){let name=cname.value.trim(); if(!name)return; let {data:pt}=await S.from('patients').select('*').ilike('full_name','%'+name+'%').limit(1).single(); if(!pt){pinfo.innerHTML='Not found';return} current=pt; pinfo.innerHTML=`👤 <b>${pt.full_name}</b><br><small>${pt.diagnosis} | 👩‍⚕️ ${pt.assigned_nurse_name||'Not assigned'}</small>`; nurseInfo.innerText='Caring for '+pt.full_name; let {data:tr}=await S.from('treatment_sheets').select('*').eq('patient_id',pt.patient_id).eq('is_active',true); treatments=tr||[]; treats.innerHTML=treatments.map(t=>`<div class=treat><b>${t.drug_name} ${t.dosage}</b> <small>${t.times}</small><br>${['Morning','Afternoon','Evening','Night'].map(s=>`<label style="margin-right:8px"><input type=checkbox class=tick data-id=${t.id} value=${s}> ${s}</label>`).join(' ')}</div>`).join('')||'No sheet assigned yet - ask admin';}
async function saveAll(){if(!current)return alert('Search client first'); let sheet={patient_id:current.patient_id,avpu:avpu.value,bp_morning:bp.value,hr_morning:hr.value,temp_morning:temp.value,pills_remaining:parseInt(pills.value)||0,days_left:Math.floor((parseInt(pills.value)||0)/2),nursing_cares:care.value,day_report:report.value,input_ml:input.value,output_ml:output.value}; let {error}=await S.from('daily_sheets').insert(sheet); if(error){msg.innerText=error.message;return} let ticks=[...document.querySelectorAll('.tick:checked')]; for(let c of ticks){await S.from('treatment_logs').insert({patient_id:current.patient_id,treatment_id:c.dataset.id,given_time_slot:c.value});} msg.innerText='✅ Saved '+ticks.length+' ticks for '+current.full_name; care.value='';report.value='';}
async function loadList(){let {data:p}=await S.from('patients').select('*').order('created_at',{ascending:false}).limit(40); clist.innerHTML=(p||[]).map(c=>`<option value="${c.full_name}">`).join(''); myClients.innerHTML=(p||[]).map(c=>`<div style="padding:12px 0;border-bottom:1px solid #eee" onclick="cname.value='${c.full_name}';switchTab('homeP',document.querySelectorAll('.tabItem')[0]);loadPatient()"><b>${c.full_name}</b><br><small>${c.diagnosis||''} • 👩‍⚕️ ${c.assigned_nurse_name||'Not assigned'}</small></div>`).join('');}loadList();
(function(){let n=new URLSearchParams(location.search).get('name'); if(n){cname.value=n; loadPatient();}})();
</script></body></html>
