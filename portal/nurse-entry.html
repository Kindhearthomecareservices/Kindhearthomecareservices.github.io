<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindHeart Staff App</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f8faf6}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--blue)}#lock{position:fixed;inset:0;z-index:99;background:linear-gradient(180deg,#14495f,#0d2f3d);display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px;box-shadow:0 12px 32px rgba(20,73,95,.08);border:1px solid #eef3f0}.inp{width:100%;padding:16px;border:2px solid #e6efe7;border-radius:16px;margin:8px 0}.btn{padding:14px;border-radius:100px;border:0;font-weight:800;cursor:pointer;width:100%}.btn-green{background:var(--green);color:#fff}.prog{height:12px;background:#eef3f0;border-radius:20px;overflow:hidden}.prog>div{height:100%;background:var(--green);transition:width.5s}.task{border-left:5px solid #e8efe9;padding:12px;background:#fff;border-radius:16px;margin:8px 0}.task.done{border-left-color:var(--green);background:#f0faf3}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}.req{border-color:#c00!important}</style></head><body>
<div id="lock"><div class="card" style="max-width:380px;width:100%;text-align:center"><h2>🩺 KindHeart Staff</h2><p>Enter Staff PIN to see your patients</p><input id="pin" class="inp" placeholder="Staff PIN - e.g. 7429"><button class="btn btn-green" onclick="login()">Login to Shifts 🔓</button><p id="err" style="color:#c00;display:none"></p></div></div>
<div id="app" style="display:none">
<div style="background:#fff;padding:12px 16px;position:sticky;top:0;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.06)"><img src="../logo.png" style="width:40px"><b>Staff: <span id="sName"></span></b><button style="margin-left:auto;background:#fee4e4;color:#c00;border:0;padding:8px 12px;border-radius:20px" onclick="logout()">Logout</button></div>
<div class="card"><label>Select My Patient Today</label><select id="patSel" onchange="loadToday()" style="width:100%;padding:12px;border-radius:12px"></select><div style="margin-top:10px"><div class="prog"><div id="progFill" style="width:0%"></div></div><small id="progText">0/0 completed today</small></div></div>
<div id="todayWrap"></div>
<div class="card" style="background:linear-gradient(135deg,#f0faf3,#fff);border:2px solid var(--green)"><h4>📝 End of Shift - REQUIRED</h4><textarea id="summ" placeholder="How was patient today? *Required" style="width:100%;padding:12px;border-radius:12px;min-height:70px"></textarea><textarea id="chall" placeholder="Challenges?" style="width:100%;padding:12px;border-radius:12px;margin-top:8px"></textarea><textarea id="next" placeholder="Instructions for next shift" style="width:100%;padding:12px;border-radius:12px;margin-top:8px"></textarea><button class="btn btn-green" style="margin-top:10px" onclick="submitShift()">Submit Shift Report & Close Shift ✅</button></div>
</div>
<script src="config.js"></script>
<script>
let nurse=null;
async function login(){let {data,error}=await supa.from('nurses').select('*').eq('pin',pin.value.trim()).single();if(error||!data){err.style.display='block';err.innerText='Wrong PIN';return;}nurse=data;localStorage.setItem('kh_nurse_id',data.id);localStorage.setItem('kh_nurse_name',data.full_name);lock.style.display='none';app.style.display='block';sName.innerText=data.full_name;loadMyPats();}
function logout(){localStorage.clear();location.reload();}
async function loadMyPats(){let {data}=await supa.from('patient_assignments').select('patient_id, patients(id, full_name, family_code, location)').eq('nurse_id',nurse.id);let opts=(data||[]).map(d=>`<option value="${d.patients.id}">${d.patients.full_name} - ${d.patients.location||''}</option>`).join('');patSel.innerHTML=opts||'<option>No patients assigned - Contact admin</option>';if(data&&data[0])loadToday();}
async function loadToday(){let pid=patSel.value;if(!pid)return;localStorage.setItem('kh_patient_id',pid);let today=new Date().toISOString().split('T')[0];let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pid);let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pid);let {data:done}=await supa.from('care_records').select('*').eq('patient_id',pid).eq('shift_date',today);let doneTaskIds=(done||[]).map(d=>d.task_id||d.medication_id);let total=(tasks?.length||0)+(meds?.length||0);let doneCount=done?.length||0;progFill.style.width=(total?Math.round(doneCount/total*100):0)+'%';progText.innerText=`${doneCount}/${total} completed today - ${today}`;let html='';html+=`<div class="card"><h3>📋 Tasks Today (${tasks?.length||0}) - Tap to Report</h3>`;html+=(tasks||[]).map(t=>{let rec=done?.find(d=>d.task_id===t.id);if(rec)return `<div class="task done"><b>✅ ${t.task_name}</b> - ${rec.status} at ${rec.time_done}<br><small>Note: ${rec.details?.note||''}</small>${rec.photo_url?`<br><img src="${rec.photo_url}" style="width:100%;border-radius:12px;margin-top:6px;max-height:260px;object-fit:cover">`:''}</div>`;return `<div class="task"><div style="display:flex;justify-content:space-between"><b>${t.task_name}</b><small>${t.time_to_do||''}</small></div><small>${t.description||''}</small><input id="note_${t.id}" placeholder="What did you observe? *Required" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:2px solid #ddeadd"><input type="file" id="photo_${t.id}" accept="image/*" style="margin-top:6px" onchange="preview('${t.id}',this)"><img id="prev_${t.id}" style="display:none;width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:cover"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn" style="background:#e0f2e9;color:#1a6d3a" onclick="report('Task','${t.id}','Done')">✅ Done</button><button class="btn" style="background:#fff3cd" onclick="report('Task','${t.id}','Skipped')">⏭️ Skip</button><button class="btn" style="background:#fee4e4;color:#c00" onclick="report('Task','${t.id}','Not Needed')">❌ N/A</button></div></div>`;}).join('')||'No tasks';html+=`</div>`;html+=`<div class="card"><h3>💊 Medications Today (${meds?.length||0})</h3>`;html+=(meds||[]).map(m=>{let rec=done?.find(d=>d.medication_id===m.id);if(rec)return `<div class="task done" style="border-left-color:#14495f"><b>💊 ${m.medication_name} ${m.dosage}</b> - ${rec.status} at ${rec.time_done}<br><small>${rec.details?.note||''}</small></div>`;return `<div class="task"><b>${m.medication_name}</b> <span class="badge" style="background:#e9f3ea">${m.dosage||''}</span><br><small>${m.frequency||''} | ${m.time_to_give||''} | ${m.duration||''}</small><input id="mnote_${m.id}" placeholder="Dosage given + reaction *Required" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:2px solid #ddeadd"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn" style="background:#14495f;color:#fff" onclick="report('Medication','${m.id}','Given')">💊 Given</button><button class="btn" style="background:#fff3cd" onclick="report('Medication','${m.id}','Refused')">🙅 Refused</button><button class="btn" style="background:#fee4e4;color:#c00" onclick="report('Medication','${m.id}','Missed')">⚠️ Missed</button></div></div>`;}).join('')||'No meds';html+=`</div>`;document.getElementById('todayWrap').innerHTML=html;}
function preview(id,input){if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{let img=document.getElementById('prev_'+id);img.src=e.target.result;img.style.display='block';};r.readAsDataURL(input.files[0]);}}
async function report(type,id,status){let pid=patSel.value;let noteEl=document.getElementById(type==='Task'?'note_'+id:'mnote_'+id);let note=noteEl?noteEl.value.trim():'';if(status==='Done'||status==='Given'){if(!note){noteEl.classList.add('req');alert('Add note - Required to build trust with family');return;}}let photoUrl=null;let photoInput=document.getElementById('photo_'+id);if(photoInput&&photoInput.files[0]){let file=photoInput.files[0];try{let compressed=await imageCompression(file,{maxSizeMB:0.3,maxWidthOrHeight:1024});let path=`care/${pid}/${Date.now()}_${file.name}`;let {error:upErr}=await supa.storage.from('patient-photos').upload(path,compressed);if(upErr)throw upErr;photoUrl=supa.storage.from('patient-photos').getPublicUrl(path).data.publicUrl;}catch(e){alert('Photo upload failed, but report will save without photo. Error:'+e.message);}}let payload={patient_id:pid,nurse_id:nurse.id,record_type:type,status:status,details:{note:note,task:type==='Task'?document.getElementById('note_'+id)?.parentElement?.querySelector('b')?.innerText:'',med:type==='Medication'?id:''},photo_url:photoUrl,shift_date:new Date().toISOString().split('T')[0],time_done:new Date().toLocaleTimeString()};if(type==='Task')payload.task_id=id;else payload.medication_id=id;let {error}=await supa.from('care_records').insert([payload]);if(error)alert(error.message);else loadToday();}
async function submitShift(){if(!summ.value.trim())return alert('Summary required before closing shift');let {error}=await supa.from('shift_reports').insert({patient_id:patSel.value,nurse_id:nurse.id,shift_date:new Date().toISOString().split('T')[0],summary:summ.value,challenges:chall.value,next_notes:next.value});if(error)alert(error.message);else{alert('Shift closed - Family notified live ✅');summ.value='';chall.value='';next.value='';}}
let saved=localStorage.getItem('kh_nurse_id');if(saved){supa.from('nurses').select('*').eq('id',saved).single().then(({data})=>{if(data){nurse=data;lock.style.display='none';app.style.display='block';sName.innerText=data.full_name;loadMyPats();}});}
</script></body></html>
