<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Inter;background:#eef7ec;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 12px rgba(0,0,0,.05)}.i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0;box-sizing:border-box}.btn{padding:12px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.bad{background:#ffe8e8;border:2px solid #c00}</style></head><body>
<div id="login" style="max-width:380px;margin:40px auto;background:#fff;padding:24px;border-radius:22px;text-align:center"><img src="logo.png" style="width:70px"><h3>Staff Login</h3><input id="email" class="i" placeholder="Staff Email"><input id="pin" type="password" class="i" placeholder="PIN"><button class="btn" style="background:#14495f;color:#fff;width:100%" onclick="login()">Login</button><p id="err" style="color:red;display:none">Invalid login</p></div>
<div id="app" style="display:none;max-width:600px;margin:0 auto"><div style="display:flex;align-items:center;gap:10px;padding:10px"><img src="logo.png" style="width:40px"><b>KindHeart Staff</b><button onclick="logout()" style="margin-left:auto;background:#fee;color:#c00;border:0;padding:6px 12px;border-radius:20px;font-weight:700">Logout</button></div><div id="patients"></div><div id="detail"></div></div>
<script>
let patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),assigns=JSON.parse(localStorage.getItem('kh_a')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]'),curStaff=null,curPat=null
function login(){ let s=staff.find(x=>x.email===email.value.trim()&&x.pin===pin.value.trim()); if(!s){err.style.display='block';return} curStaff=s; sessionStorage.setItem('staff',JSON.stringify(s)); renderList() }
function logout(){sessionStorage.clear();location.reload()}
let ss=sessionStorage.getItem('staff'); if(ss){curStaff=JSON.parse(ss); renderList()}
function checkBP(bp){ if(!bp.includes('/')) return {ok:true}; let s=parseInt(bp.split('/')[0]),d=parseInt(bp.split('/')[1]); if(s>=180||d>=120) return {ok:false,msg:'CRISIS BP '+bp+' - Immediate Review'}; if(s>=140||d>=90) return {ok:false,msg:'HIGH BP '+bp}; if(s>=130||d>=85) return {ok:true,warn:'Elevated '+bp}; return {ok:true} }
function renderList(){ login.style.display='none'; app.style.display='block'; let myAssigns=assigns.filter(a=>a.staff_id===curStaff.id); let myPatients=patients.filter(p=>myAssigns.find(a=>a.patient_id===p.id)); document.getElementById('patients').innerHTML=`<div class="card"><h3>Good Morning, ${curStaff.full_name}</h3><p>${myPatients.length} Patients Assigned Today</p></div>`+myPatients.map(p=>`<div class="card"><b>${p.full_name}</b> - ${p.location||'Eldoret'}<br><small>Family PIN: ${p.family_code}</small><br><button class="btn" style="background:#0A7A42;color:#fff;margin-top:8px" onclick="openPat('${p.id}')">OPEN PATIENT →</button></div>`).join('') }
function openPat(id){ curPat=patients.find(p=>p.id===id); let r=reports.filter(x=>x.patient_id===id); document.getElementById('detail').innerHTML=`<div class="card"><h3>${curPat.full_name} - Care</h3><p style="font-size:12px">Allergies: ${curPat.allergies||'None'} | Diagnosis: ${curPat.diagnosis||'-'}</p></div>
<div class="card"><h4>🩺 Record Vitals (8 fields) - 200/100 will be flagged</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="bp" class="i" placeholder="BP 120/80"><input id="temp" class="i" placeholder="Temp 36.7"><input id="pulse" class="i" placeholder="Pulse 78"><input id="spo2" class="i" placeholder="SpO2 98"><input id="resp" class="i" placeholder="Resp 18"><input id="weight" class="i" placeholder="Weight kg"><input id="sugar" class="i" placeholder="Blood Sugar"><input id="pain" class="i" placeholder="Pain 0-10"></div><button class="btn" style="background:#0A7A42;color:#fff;width:100%;margin-top:8px" onclick="saveVitals()">Save Vitals → Family sees it</button><div id="vmsg" style="margin-top:8px;font-weight:700"></div></div>
<div class="card"><h4>✅ Tasks</h4>${['Morning care','Bathing','Feeding','Physio','Evening meds'].map(t=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${t}</span><button class="btn" style="background:#eef7ec;padding:6px 12px;font-size:12px" onclick="saveTask('${t}')">Done</button></div>`).join('')}<div style="margin-top:10px"><b>Custom Task:</b> <input id="customTask" class="i" placeholder="Wound dressing"><button class="btn" style="background:#14495f;color:#fff" onclick="saveTask(document.getElementById('customTask').value)">Save Custom Task</button></div></div>
<div class="card"><h4>💊 Medications</h4><input id="medName" class="i" placeholder="Med name e.g. Amlodipine 5mg"><button class="btn" style="background:#FF6A00;color:#fff" onclick="saveMed()">Mark Given</button></div>
<div class="card"><h4>📝 Care Note</h4><textarea id="note" class="i" style="height:80px" placeholder="Patient was comfortable..."></textarea><button class="btn" style="background:#14495f;color:#fff;width:100%" onclick="saveNote()">Save Note</button></div>
<div class="card"><h4>Timeline Today</h4>${r.slice(-5).reverse().map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee;font-size:13px">${new Date(x.time).toLocaleTimeString()} - ${x.note||x.type} ${x.vitals?JSON.stringify(x.vitals):''}</div>`).join('')||'No records yet'}</div>` }
function saveVitals(){ let bpVal=document.getElementById('bp').value.trim(); let tempVal=document.getElementById('temp').value; let pulseVal=document.getElementById('pulse').value; let spo2Val=document.getElementById('spo2').value; let check=checkBP(bpVal); let flagReason=''; if(!check.ok) flagReason=check.msg; if(parseFloat(tempVal)>=38) flagReason+=(flagReason?'; ':'')+'Fever '+tempVal+'°C'; if(parseInt(spo2Val)<94&&spo2Val) flagReason+=(flagReason?'; ':'')+'Low SpO2 '+spo2Val+'%'; let vit={bp:bpVal,temp:tempVal,pulse:pulseVal,spo2:spo2Val,resp:document.getElementById('resp').value,weight:document.getElementById('weight').value,sugar:document.getElementById('sugar').value,pain:document.getElementById('pain').value, flag_reason:flagReason, flag_alert:flagReason!==''}; reports.push({id:Date.now().toString(),patient_id:curPat.id,staff_id:curStaff.id,type:'Vitals',vitals:vit,note:`Vitals BP ${bpVal} ${flagReason?'⚠️ '+flagReason:'Normal'}`,time:new Date().toISOString(),status:flagReason?'HIGH ALERT':'Normal'}); localStorage.setItem('kh_r',JSON.stringify(reports)); document.getElementById('vmsg').innerHTML=flagReason?`<span style="color:#c00">🚨 ALERT SAVED: ${flagReason} - Family will see RED</span>`:`<span style="color:#0A7A42">✅ Vitals saved as Normal - ${bpVal}</span>`; }
function saveTask(t){ if(!t) return; reports.push({id:Date.now().toString(),patient_id:curPat.id,staff_id:curStaff.id,type:'Task',note:'✅ '+t,time:new Date().toISOString(),status:'Completed'}); localStorage.setItem('kh_r',JSON.stringify(reports)); alert('Task saved'); openPat(curPat.id) }
function saveMed(){ let n=document.getElementById('medName').value; if(!n) return; reports.push({id:Date.now().toString(),patient_id:curPat.id,staff_id:curStaff.id,type:'Med',note:'💊 '+n,status:'Given',time:new Date().toISOString()}); localStorage.setItem('kh_r',JSON.stringify(reports)); alert('Medication marked as Given'); openPat(curPat.id) }
function saveNote(){ let n=document.getElementById('note').value; if(!n) return; reports.push({id:Date.now().toString(),patient_id:curPat.id,staff_id:curStaff.id,type:'Note',note:'📝 '+n,time:new Date().toISOString()}); localStorage.setItem('kh_r',JSON.stringify(reports)); alert('Note saved'); openPat(curPat.id) }
</script></body></html>
