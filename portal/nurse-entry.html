<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f5faf6}body{font-family:Inter,system-ui;background:var(--bg);margin:0;padding:10px}.nav{background:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:0 0 18px 18px;box-shadow:0 4px 16px #0001}.nav img{width:38px}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 20px #0001;border:1px solid #e6efe7}.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800}.green{background:var(--blue);color:#fff}.lime{background:var(--green);color:#fff}.task{display:flex;gap:10px;padding:10px;border-bottom:1px solid #eef4ef}.done{opacity:.5;text-decoration:line-through}</style></head><body>
<div class="nav"><img src="logo.png"><b style="color:var(--blue)">Kind<span style="color:var(--green)">Heart</span> - Nurse</b></div>
<div id="login" class="card"><h3>👩‍⚕️ Nurse Login</h3><select id="nurseSel" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid #ddeadd"></select><input id="pin" placeholder="PIN 2024" type="password" style="width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid #ddeadd"><button class="btn green" onclick="login()">Login</button></div>
<div id="app" style="display:none"><div class="card"><h3 id="nName"></h3><button class="btn green" onclick="loadMyPatients()">🔄 My Patients</button></div><div id="myList"></div><div class="card"><h4>📸 Document with True Photo</h4><select id="patSel" style="width:100%;padding:12px;border-radius:12px"></select><input id="bp" placeholder="BP 120/80" style="width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddeadd"><input id="temp" placeholder="Temp"><input id="note" placeholder="Note"><input type="file" id="photo" accept="image/*" capture="environment"><button class="btn lime" onclick="saveDoc()" style="width:100%;margin-top:8px">💾 Save with Photo</button><div id="msg" style="color:var(--green);font-weight:700;margin-top:8px"></div></div><div class="card"><h4>Today Progress</h4><div id="progress"></div></div></div>
<script>
const SUPA_URL="https://enlveleqbqbmhamyqtxzj.supabase.co"; const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curNurse=null;
async function init(){let {data}=await supa.from('nurses').select('*').eq('is_active',true); document.getElementById('nurseSel').innerHTML=(data||[]).map(n=>`<option value="${n.id}">${n.full_name}</option>`).join('')||'<option>Add nurse in Admin first</option>';}
async function login(){let id=nurseSel.value; let pin=document.getElementById('pin').value; let {data}=await supa.from('nurses').select('*').eq('id',id).single(); if(!data)return alert('Add nurse in Admin'); if(data.pin!==pin)return alert('Wrong PIN'); curNurse=data; login.style.display='none'; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; nName.innerText='Hello '+data.full_name; loadMyPatients();}
async function loadMyPatients(){let today=new Date().toISOString().split('T')[0]; let {data:assigns}=await supa.from('patient_assignments').select('*, patients(*)').eq('nurse_id',curNurse.id).eq('is_active',true); let {data:recs}=await supa.from('care_records').select('*').eq('nurse_id',curNurse.id).eq('record_date',today); patSel.innerHTML=(assigns||[]).map(a=>`<option value="${a.patients.id}">${a.patients.full_name}</option>`).join(''); let html=''; for(let a of assigns||[]){let pat=a.patients; let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pat.id); let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pat.id); html+=`<div class="card" style="border-left:5px solid var(--green)"><b>${pat.full_name}</b> ${pat.location||''}<br><b>Tasks</b>${(tasks||[]).map(t=>{let done=recs?.some(r=>r.details?.task===t.task_name); return `<div class="task ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doTask('${pat.id}','${t.task_name.replace(/'/g,'')}')"><span>${t.task_name}</span></div>`}).join('')||'No tasks'}<br><b>Meds</b>${(meds||[]).map(m=>{let done=recs?.some(r=>r.details?.med===m.medication_name); return `<div class="task ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doMed('${pat.id}','${m.medication_name.replace(/'/g,'')}')"><span>${m.time_to_give} ${m.medication_name}</span></div>`}).join('')||'No meds'}</div>`;} myList.innerHTML=html||'No patients assigned'; progress.innerHTML=(recs||[]).map(r=>`<small>${r.record_type}: ${r.details.task||r.details.med||''} ${r.photo_url?'<a href='+r.photo_url+' target=_blank>📸</a>':''}</small><br>`).join('');}
async function doTask(pid,t){await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'task',details:{task:t}}); loadMyPatients();}
async function doMed(pid,m){await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'medication',details:{med:m}}); loadMyPatients();}
async function saveDoc(){let pid=patSel.value; if(!pid)return alert('No patient'); let file=document.getElementById('photo').files[0]; let url=null; if(file){let name=Date.now()+'_'+file.name; let up=await supa.storage.from('patient-photos').upload(name,file); if(up.error)return alert(up.error.message); url=supa.storage.from('patient-photos').getPublicUrl(name).data.publicUrl;} await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:file?'photo':'note',details:{vitals:{bp:bp.value,temp:temp.value},note:note.value},photo_url:url}); msg.innerText='✅ Saved! Admin & Family can see photo'; loadMyPatients();}
init();
</script></body></html>
