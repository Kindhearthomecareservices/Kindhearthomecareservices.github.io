<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurse - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f7f8f5;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}.btn{padding:10px 14px;border-radius:10px;border:0;font-weight:700;margin:4px}.green{background:#22c55e;color:#fff}.blue{background:#0f4a5a;color:#fff}.taskRow{display:flex;gap:10px;padding:10px;border-bottom:1px solid #eee}.done{opacity:.5;text-decoration:line-through}</style></head><body>
<div id="login" class="card"><h3>👩‍⚕️ Nurse Login</h3><select id="nurseSel"></select><input id="pin" placeholder="PIN 2024" type="password"><button class="btn blue" onclick="login()">Login</button></div>
<div id="app" style="display:none"><div class="card"><h3 id="nName"></h3><button class="btn blue" onclick="loadMyPatients()">🔄 My Patients</button></div><div id="myList"></div><div class="card"><h4>📸 Document with True Photo</h4><select id="patSel"></select><input id="bp" placeholder="BP 120/80"><input id="temp" placeholder="Temp"><input id="note" placeholder="Note"><input type="file" id="photo" accept="image/*" capture="environment"><button class="btn green" onclick="saveDoc()">💾 Save with Photo</button><div id="msg"></div></div><div class="card"><h4>Today</h4><div id="progress"></div></div></div>
<script>
const SUPA_URL="https://xdyoqxhqbeuiuvpsqlbb.supabase.co"; const SUPA_KEY="YOUR_ANON_KEY_HERE"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curNurse=null;
async function init(){let {data}=await supa.from('nurses').select('*').eq('is_active',true); document.getElementById('nurseSel').innerHTML=data.map(n=>`<option value="${n.id}">${n.full_name}</option>`).join('');}
async function login(){let id=document.getElementById('nurseSel').value; let pin=document.getElementById('pin').value; let {data}=await supa.from('nurses').select('*').eq('id',id).single(); if(data.pin!==pin){alert('Wrong PIN');return;} curNurse=data; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('nName').innerText='Hello '+data.full_name; loadMyPatients();}
async function loadMyPatients(){let today=new Date().toISOString().split('T')[0]; let {data:assigns}=await supa.from('patient_assignments').select('*, patients(*)').eq('nurse_id',curNurse.id).eq('is_active',true); let {data:recs}=await supa.from('care_records').select('*').eq('nurse_id',curNurse.id).eq('record_date',today); document.getElementById('patSel').innerHTML=assigns.map(a=>`<option value="${a.patients.id}">${a.patients.full_name}</option>`).join(''); let html=''; for(let a of assigns){let pat=a.patients; let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pat.id); let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pat.id); html+=`<div class="card" style="border-left:5px solid #22c55e"><b>${pat.full_name}</b> ${pat.location||''}<br><b>Tasks</b>${(tasks||[]).map(t=>{let done=recs?.some(r=>r.details?.task===t.task_name); return `<div class="taskRow ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doTask('${pat.id}','${t.task_name.replace(/'/g,'')}')"><span>${t.task_name}</span></div>`}).join('')||'No tasks'}<br><b>Meds</b>${(meds||[]).map(m=>{let done=recs?.some(r=>r.details?.med===m.medication_name); return `<div class="taskRow ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="doMed('${pat.id}','${m.medication_name.replace(/'/g,'')}')"><span>${m.time_to_give} ${m.medication_name}</span></div>`}).join('')||'No meds'}</div>`;} document.getElementById('myList').innerHTML=html; document.getElementById('progress').innerHTML=recs.map(r=>`<small>${r.record_type}: ${JSON.stringify(r.details)} ${r.photo_url?'<a href='+r.photo_url+' target=_blank>📸</a>':''}</small><br>`).join('');}
async function doTask(pid,tname){await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'task',details:{task:tname}}); loadMyPatients();}
async function doMed(pid,mname){await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:'medication',details:{med:mname}}); loadMyPatients();}
async function saveDoc(){let pid=document.getElementById('patSel').value; let file=document.getElementById('photo').files[0]; let url=null; if(file){let name=Date.now()+'_'+file.name; let up=await supa.storage.from('patient-photos').upload(name,file); if(up.error){alert(up.error.message);return;} url=supa.storage.from('patient-photos').getPublicUrl(name).data.publicUrl;} await supa.from('care_records').insert({patient_id:pid,nurse_id:curNurse.id,record_type:file?'photo':'note',details:{vitals:{bp:document.getElementById('bp').value,temp:document.getElementById('temp').value},note:document.getElementById('note').value},photo_url:url}); document.getElementById('msg').innerText='✅ Saved! Family & Admin can see photo'; loadMyPatients();}
init();
</script></body></html>
