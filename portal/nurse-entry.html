<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Inter;background:#f5f8f5} .i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:10px;margin:6px 0} .cd{background:#fff;border-radius:14px;padding:14px;margin:10px;box-shadow:0 4px 10px rgba(0,0,0,.05)} .bt{padding:12px;border-radius:100px;border:0;font-weight:800;width:100%;cursor:pointer}</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#14495f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99"><div class="cd" style="max-width:340px;width:100%;text-align:center"><h3>Staff Login</h3><input id="pin" class="i" placeholder="Enter Staff PIN"><button class="bt" style="background:#5ca94a;color:#fff" onclick="login()">Login</button><p id="err" style="color:red;display:none"></p></div></div>
<div id="app" style="display:none"><div class="cd" style="display:flex;align-items:center;gap:8px"><b id="name"></b><button style="margin-left:auto;background:#fee4e4;color:#c00;border:0;padding:6px 10px;border-radius:20px" onclick="logout()">Logout</button></div><div class="cd"><select id="psel" class="i" onchange="load()"><option value="">Select Patient</option></select></div><div id="list"></div></div>
<script>
let staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),assigns=JSON.parse(localStorage.getItem('kh_a')||'[]'),tasks=JSON.parse(localStorage.getItem('kh_t')||'[]'),meds=JSON.parse(localStorage.getItem('kh_m')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]');let me=null;
function save(){localStorage.setItem('kh_r',JSON.stringify(reports));}
function login(){let s=staff.find(x=>x.pin===pin.value.trim());if(!s){err.style.display='block';err.innerText='Wrong PIN';return}me=s;localStorage.setItem('kh_cur_staff',s.id);lock.style.display='none';app.style.display='block';name.innerText=s.full_name+' - '+s.role;initSel()}
function logout(){localStorage.removeItem('kh_cur_staff');location.reload()}
function initSel(){let myPatients=assigns.filter(a=>a.staff_id===me.id).map(a=>patients.find(p=>p.id===a.patient_id)).filter(Boolean);psel.innerHTML='<option value="">Select Patient</option>'+myPatients.map(p=>`<option value="${p.id}">${p.full_name} - ${p.family_code}</option>`).join('')}
function load(){let pid=psel.value;if(!pid)return;let t=tasks.filter(x=>x.patient_id===pid);let m=meds.filter(x=>x.patient_id===pid);let html='';html+=t.map(x=>`<div class="cd"><b>${x.name}</b><br><small>${x.time}</small><input id="n_${x.id}" class="i" placeholder="Note"><button class="bt" style="background:#5ca94a;color:#fff" onclick="done('Task','${x.id}')">Mark Done</button></div>`).join('');html+=m.map(x=>`<div class="cd"><b>💊 ${x.name}</b><br><small>${x.dosage} ${x.time}</small><input id="m_${x.id}" class="i" placeholder="Note"><button class="bt" style="background:#14495f;color:#fff" onclick="done('Med','${x.id}')">Mark Given</button></div>`).join('');list.innerHTML=html||'<div class="cd">No tasks assigned by Admin yet</div>'}
function done(type,id){let note=(document.getElementById(type==='Task'?'n_'+id:'m_'+id)||{}).value||'';reports.push({id:Date.now().toString(),patient_id:psel.value,staff_id:me.id,type:type,status:type==='Task'?'Done':'Given',note:note,time:new Date().toISOString()});save();alert('✅ Reported: '+type+' - Family & Admin will see it live');load()}
let cur=localStorage.getItem('kh_cur_staff');if(cur){let s=staff.find(x=>x.id===cur);if(s){me=s;lock.style.display='none';app.style.display='block';name.innerText=s.full_name+' - '+s.role;initSel()}}
</script></body></html>
