<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff V3 - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--b:#14495f;--g:#5ca94a}*{box-sizing:border-box}body{margin:0;font-family:Inter;background:#f6faf7;color:var(--b)}.cd{background:#fff;border-radius:16px;padding:14px;margin:10px;box-shadow:0 4px 12px rgba(0,0,0,.05);border:1px solid #eef3ee}.i{width:100%;padding:11px;border:2px solid #ddeadd;border-radius:10px;margin:5px 0}.bt{padding:12px;border-radius:100px;border:0;font-weight:800;cursor:pointer;width:100%}.hdr{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;border-bottom:3px solid var(--g)}.sec{border-left:4px solid var(--g);padding-left:10px;margin:14px 0 6px 0;font-weight:800}.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.rw{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#14495f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99"><div class="cd" style="max-width:360px;width:100%;text-align:center"><img src="logo.png" style="width:60px"><h3>Staff Login</h3><input id="pin" class="i" placeholder="Enter Staff PIN"><button class="bt" style="background:#5ca94a;color:#fff" onclick="login()">Login</button><p id="err" style="color:red;display:none"></p><p style="font-size:11px"><a href="https://kindhearthomecareservices.co.ke" style="color:var(--g)">kindhearthomecareservices.co.ke</a></p></div></div>
<div id="app" style="display:none"><div class="hdr"><img src="logo.png" style="width:36px"><div><b id="name"></b><br><small><a href="https://kindhearthomecareservices.co.ke" style="color:var(--g);text-decoration:none">kindhearthomecareservices.co.ke</a></small></div><button style="margin-left:auto;background:#fee4e4;color:#c00;border:0;padding:6px 12px;border-radius:20px;font-weight:700" onclick="logout()">Logout</button></div>
<div class="cd"><select id="psel" class="i" onchange="load()"><option value="">Select Patient (Assigned)</option></select></div>

<div id="content" style="display:none">
<div class="cd"><div class="sec">🩺 Vital Signs - All 8</div><div class="rw"><input id="v_bp" class="i" placeholder="BP e.g. 120/80"><input id="v_temp" class="i" placeholder="Temp °C e.g. 36.7"></div><div class="rw"><input id="v_pulse" class="i" placeholder="Pulse bpm"><input id="v_resp" class="i" placeholder="Resp /min"></div><div class="rw"><input id="v_spo2" class="i" placeholder="SpO2 %"><input id="v_weight" class="i" placeholder="Weight kg"></div><div class="rw"><input id="v_sugar" class="i" placeholder="Sugar mmol/L"><input id="v_pain" class="i" placeholder="Pain 0-10"></div><button class="bt" style="background:#14495f;color:#fff" onclick="saveVitals()">Save Vitals → Family sees trend</button></div>

<div id="taskSec"></div>
<div id="medSec"></div>

<div class="cd"><div class="sec">📝 Nursing Notes - SOAP</div><input id="soap_s" class="i" placeholder="S - Subjective: Patient says..."><input id="soap_o" class="i" placeholder="O - Objective: Observed..."><input id="soap_a" class="i" placeholder="A - Assessment: Skin intact, etc"><textarea id="soap_p" class="i" placeholder="P - Plan: Continue, refer, etc" style="height:70px"></textarea><button class="bt" style="background:#ff9f1c;color:#fff" onclick="saveSOAP()">Save SOAP Note</button></div>
</div>
</div>
<script>
let staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),assigns=JSON.parse(localStorage.getItem('kh_a')||'[]'),tasks=JSON.parse(localStorage.getItem('kh_t')||'[]'),meds=JSON.parse(localStorage.getItem('kh_m')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]');let me=null;
function save(){localStorage.setItem('kh_r',JSON.stringify(reports));}
function login(){let s=staff.find(x=>x.pin===pin.value.trim());if(!s){err.style.display='block';err.innerText='Wrong PIN';return}me=s;localStorage.setItem('kh_cur_staff',s.id);lock.style.display='none';app.style.display='block';name.innerText=s.full_name+' - '+s.role;initSel()}
function logout(){localStorage.removeItem('kh_cur_staff');location.reload()}
function initSel(){let myPatients=assigns.filter(a=>a.staff_id===me.id).map(a=>patients.find(p=>p.id===a.patient_id)).filter(Boolean);psel.innerHTML='<option value="">Select Patient (Assigned)</option>'+myPatients.map(p=>`<option value="${p.id}">${p.full_name} - ${p.family_code}</option>`).join('')}
function load(){let pid=psel.value;if(!pid){content.style.display='none';return;}content.style.display='block';let t=tasks.filter(x=>x.patient_id===pid);let m=meds.filter(x=>x.patient_id===pid);taskSec.innerHTML='<div class="cd"><div class="sec">✅ Daily Tasks</div>'+(t.map(x=>`<div style="border-bottom:1px solid #f0f0f0;padding:10px 0"><b>${x.name}</b> <small>${x.time}</small><input id="n_${x.id}" class="i" placeholder="Note for this task"><button class="bt" style="background:#5ca94a;color:#fff" onclick="done('Task','${x.id}')">Mark Done</button></div>`).join('')||'No tasks by Admin')+'</div>';medSec.innerHTML='<div class="cd"><div class="sec">💊 Medications</div>'+(m.map(x=>`<div style="border-bottom:1px solid #f0f0f0;padding:10px 0"><b>${x.name}</b> <small>${x.dosage} ${x.time}</small><input id="m_${x.id}" class="i" placeholder="Note"><div style="display:flex;gap:6px"><button class="bt" style="background:#14495f;color:#fff" onclick="doneMed('${x.id}','Given')">Given</button><button class="bt" style="background:#fee4e4;color:#c00" onclick="doneMed('${x.id}','Refused')">Refused</button></div></div>`).join('')||'No meds')+'</div>';}
function saveVitals(){let v={bp:v_bp.value,temp:v_temp.value,pulse:v_pulse.value,resp:v_resp.value,spo2:v_spo2.value,weight:v_weight.value,sugar:v_sugar.value,pain:v_pain.value};if(!v.bp&&!v.temp&&!v.pulse)return alert('Enter at least BP/Temp/Pulse');reports.push({id:Date.now().toString(),patient_id:psel.value,staff_id:me.id,type:'Vitals',status:'Recorded',vitals:v,time:new Date().toISOString(),note:`Vitals recorded`});save();['v_bp','v_temp','v_pulse','v_resp','v_spo2','v_weight','v_sugar','v_pain'].forEach(id=>document.getElementById(id).value='');alert('✅ Vitals saved - Family sees trend graph');}
function done(type,id){let note=document.getElementById('n_'+id).value;reports.push({id:Date.now().toString(),patient_id:psel.value,staff_id:me.id,type:type,status:'Done',note:note,time:new Date().toISOString()});save();alert('✅ Task Done reported');load();}
function doneMed(id,status){let note=document.getElementById('m_'+id).value;reports.push({id:Date.now().toString(),patient_id:psel.value,staff_id:me.id,type:'Med',status:status,note:note,time:new Date().toISOString()});save();alert('✅ Med '+status);load();}
function saveSOAP(){let soap={s:soap_s.value,o:soap_o.value,a:soap_a.value,p:soap_p.value};if(!soap.s&&!soap.o&&!soap.a&&!soap.p)return alert('Write at least one SOAP field');reports.push({id:Date.now().toString(),patient_id:psel.value,staff_id:me.id,type:'Note',status:'SOAP',soap:soap,time:new Date().toISOString(),note:`SOAP Note`});save();['soap_s','soap_o','soap_a','soap_p'].forEach(id=>document.getElementById(id).value='');alert('✅ SOAP Note saved - Visible to Admin & Family');}
let cur=localStorage.getItem('kh_cur_staff');if(cur){let s=staff.find(x=>x.id===cur);if(s){me=s;lock.style.display='none';app.style.display='block';name.innerText=s.full_name+' - '+s.role;initSel()}}
</script></body></html>
