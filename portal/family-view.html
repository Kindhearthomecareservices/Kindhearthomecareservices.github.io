<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>const SUPABASE_URL="https://enlvelqeqbmhamyqtzxj.supabase.co";const SUPABASE_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter;background:#f6f9f7;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.05)}.i{padding:12px;border:2px solid #ddeadd;border-radius:12px;width:100%;margin:6px 0}.btn{padding:12px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer;width:100%}.badge{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:800}.ok{background:#e8f5e3;color:#0A7A42}.bad{background:#ffe8e8;color:#a00}.live{background:#e0f2ff;color:#0a4a8a}.small{font-size:12px;color:#6b7e6f}</style></head><body>
<div id="loginBox" class="card" style="max-width:420px;margin:60px auto"><h2>👨‍👩‍👧 Family Portal</h2><p class="small">Enter your Family PIN given by Admin (e.g. KHA2751)</p><input id="pin" class="i" placeholder="KHA..."><button class="btn" style="background:#0A7A42;color:#fff" onclick="login()">View My Loved One</button><div id="lmsg" class="small"></div></div>
<div id="app" style="display:none;max-width:800px;margin:auto"></div>
<script>
let patient=null;
async function login(){
 let code=pin.value.trim().toUpperCase();
 let {data,error}=await supabaseClient.from('patients').select('*').eq('family_code',code).single();
 if(error||!data){lmsg.innerText='❌ PIN not found';return}
 patient=data; loginBox.style.display='none'; app.style.display='block'; loadAll();
}
async function loadAll(){
 let {data:assigns}=await supabaseClient.from('assignments').select('*, staff:staff_id(full_name,role)').eq('patient_id',patient.id);
 let {data:tasks}=await supabaseClient.from('tasks').select('*').eq('patient_id',patient.id).order('created_at',{ascending:false});
 let {data:treats}=await supabaseClient.from('treatments').select('*').eq('patient_id',patient.id);
 let {data:records}=await supabaseClient.from('care_records').select('*, staff:staff_id(full_name)').eq('patient_id',patient.id).order('time',{ascending:false}).limit(20);
 app.innerHTML=`
 <div class="card" style="border-left:6px solid #0A7A42"><h2 style="margin:0">${patient.full_name} <span class="badge ok">${patient.care_status}</span></h2><span class="small">${patient.location||''} • Diagnosis: ${patient.diagnosis||'—'} • Allergies: ${patient.allergies||'None'} • PIN: ${patient.family_code}</span>
 <div style="margin-top:10px">${(assigns||[]).map(a=>`<span class="badge ${a.assignment_type==='Live-in'?'live':'ok'}" style="margin-right:6px">👩‍⚕️ ${a.staff?.full_name||'?'} - ${a.staff?.role||''} • ${a.assignment_type||'Daily'}</span>`).join('')||'<span class="small">No staff assigned yet</span>'}</div></div>
 <div class="card"><h3>📋 Today's Care Tasks</h3><div>${(tasks||[]).map(t=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0"><span>${t.title} <small class="small">${t.due_time||''}</small></span><span class="badge ${t.status==='Done'?'ok':'bad'}">${t.status}</span></div>`).join('')||'No tasks yet'}</div></div>
 <div class="card"><h3>💊 Treatment Sheet</h3><div>${(treats||[]).map(m=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${m.medication}</b> - ${m.dosage||''} ${m.frequency||''} (${m.route||''})<br><small class="small">${m.instructions||''} • ${m.start_date||''} to ${m.end_date||''}</small></div>`).join('')||'No medications'}</div></div>
 <div class="card"><h3>🩺 Recent Visits & Vitals (from Nurse)</h3><div>${(records||[]).map(r=>`<div style="padding:10px 0;border-bottom:1px solid #f0f0f0"><div><b>${r.status||'Visit'}</b> ${r.flag_alert?'<span class="badge bad">🚨 ALERT: '+r.flag_reason+'</span>':''}<br><small class="small">by ${r.staff?.full_name||'Staff'} • ${new Date(r.time).toLocaleString()}</small></div><div style="font-size:13px;margin-top:4px">${r.note||''} ${r.vitals?`<br><small>BP: ${r.vitals.bp||'-'} | Temp: ${r.vitals.temp||'-'} | SpO2: ${r.vitals.spo2||'-'} | HR: ${r.vitals.hr||'-'}</small>`:''}</div></div>`).join('')||'No visits yet - nurse will update after visit'}</div></div>
 <div class="card" style="background:#14495f;color:#fff"><b>Need help?</b><br><span class="small" style="color:#a8c4b8">Call KindHeart: 0720... • Eldoret • Right care at home</span><div style="margin-top:10px"><button class="btn" style="background:#fff;color:#14495f;width:auto" onclick="location.reload()">Logout</button> <button class="btn" style="background:#0A7A42;color:#fff;width:auto" onclick="loadAll()">↻ Refresh</button></div></div>
 `;
}
</script></body></html>
