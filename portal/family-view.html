<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--teal:#0f4a5a;--green:#6bb64a;--bg:#f0fdf4;--border:#d8edcf}*{font-family:Inter;box-sizing:border-box}body{background:var(--bg);max-width:480px;margin:0 auto;padding:12px}
.top{background:var(--teal);color:#fff;padding:18px;border-radius:22px;display:flex;align-items:center;gap:12px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid var(--border)}
input{width:100%;padding:13px;border:1.5px solid #d0d5dd;border-radius:14px;margin:6px 0}.btn{width:100%;padding:13px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-weight:800}
.nurseBox{background:linear-gradient(135deg,#e8f5e3,#d1f0c8);border:1px solid #b6e3a3;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}.badge{padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px}.ok{background:#dcfce7;color:#166534}.low{background:#fee2e2;color:#991b1b}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="top"><img src="logo.png" style="width:40px;height:40px;border-radius:10px;background:#fff;padding:4px"><div><b>KindHeart Family Portal</b><br><small style="opacity:.8">Right care at home • Live</small></div></div>

<div class="card"><input id="cname" placeholder="Client Name e.g Steve Torotich" list="clist"><datalist id="clist"></datalist><button class="btn" onclick="load()">View Full Report</button></div>

<div id="patient" class="card" style="display:none"></div><div id="nurseCard"></div><div id="alert" class="card" style="display:none"></div>
<div class="card"><b>💊 Treatment Given Today</b><div id="tlist" style="margin-top:8px">Search client above</div></div>
<div class="card"><b>🩺 Latest Vitals & Care</b><div id="vlist"></div></div>
<div class="card"><b>📋 History</b><div id="hlist"></div></div>

<script>
const URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const S=window.supabase.createClient(URL,KEY);
async function load(){let name=cname.value.trim()||new URLSearchParams(location.search).get('name'); if(!name)return alert('Enter client name'); let {data:pt}=await S.from('patients').select('*').ilike('full_name','%'+name+'%').limit(1).single(); if(!pt){alert('Client not found');return} document.getElementById('patient').style.display='block'; document.getElementById('patient').innerHTML=`👤 <b>${pt.full_name}</b><br><small>${pt.diagnosis||''} • ${pt.address||''}</small>`; nurseCard.innerHTML=`<div class=card style="margin:12px 0"><div class=nurseBox><div class=avatar>${(pt.assigned_nurse_name||'N').slice(0,2).toUpperCase()}</div><div><b>Caregiver Today: ${pt.assigned_nurse_name||'Not assigned yet'}</b><br><small>${pt.assigned_nurse_role||''} | ${pt.assigned_nurse_phone||''}</small><br><small style="color:#065f46;font-weight:700">✅ Verified by KindHeart - On duty now</small></div></div></div>`; let {data:sheets}=await S.from('daily_sheets').select('*').eq('patient_id',pt.patient_id).order('created_at',{ascending:false}); if(!sheets||!sheets.length){tlist.innerHTML='No reports yet - nurse has not submitted';return} let latest=sheets[0]; let {data:master}=await S.from('treatment_sheets').select('*').eq('patient_id',pt.patient_id).eq('is_active',true); let today=new Date().toISOString().split('T')[0]; let {data:logs}=await S.from('treatment_logs').select('*, treatment_sheets(drug_name,dosage)').eq('patient_id',pt.patient_id).eq('date',today); tlist.innerHTML=(master||[]).map(m=>{let given=(logs||[]).filter(l=>l.treatment_id==m.id); let slots=given.map(g=>`<span style="color:#065f46;font-weight:700">✅ ${g.given_time_slot} ${new Date(g.given_at).toLocaleTimeString()}</span>`).join(' ')||'<span style="color:#999">⏳ Not yet given today</span>'; return `<div style="padding:10px 0;border-bottom:1px solid #f2f4f7"><b>${m.drug_name} ${m.dosage||''}</b><br><small>${m.times||''}</small><br>${slots}</div>`}).join('')||'No treatment sheet set by admin'; vlist.innerHTML=`<table style="width:100%;font-size:14px"><tr><td style="padding:6px 0;color:#667085">BP / HR / Temp</td><td><b>${latest.bp_morning||''} / ${latest.hr_morning||''} / ${latest.temp_morning||''}</b></td></tr><tr><td style="padding:6px 0;color:#667085">Pills</td><td><span class="badge ${latest.days_left<=4?'low':'ok'}">${latest.pills_remaining||0} pills - ${latest.days_left||0} days left</span></td></tr><tr><td style="padding:6px 0;color:#667085">Care Done</td><td>${latest.nursing_cares||''}</td></tr><tr><td style="padding:6px 0;color:#667085">Day Report</td><td><b>${latest.day_report||''}</b></td></tr></table>`; alert.style.display='block'; alert.innerHTML=latest.days_left<=8?`<span class="badge low">⚠️ LOW STOCK ${latest.pills_remaining} pills</span>`:`<span class="badge ok">✅ Stock OK ${latest.days_left} days remaining</span>`; hlist.innerHTML=sheets.slice(0,5).map(s=>`<div style="padding:8px 0;border-bottom:1px solid #f5f5f5"><small>${new Date(s.created_at).toLocaleString()}</small><br>${s.nursing_cares||''}<br><b>${s.day_report||''}</b></div>`).join('');}
async function loadList(){let {data:p}=await S.from('patients').select('full_name').limit(50); clist.innerHTML=(p||[]).map(c=>`<option value="${c.full_name}">`).join('');}loadList();
(function(){let n=new URLSearchParams(location.search).get('name'); if(n){cname.value=n; load();}})();
</script></body></html>
