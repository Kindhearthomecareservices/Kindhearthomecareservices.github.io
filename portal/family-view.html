<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindHeart Family - Live Care</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f8faf6}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--blue)}#lock{position:fixed;inset:0;z-index:99;background:linear-gradient(180deg,#14495f,#0e3a4c);display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px;box-shadow:0 12px 32px rgba(20,73,95,.08);border:1px solid #eef3f0}.inp{width:100%;padding:16px;border:2px solid #e6efe7;border-radius:16px;margin:8px 0}.btn{padding:14px;border-radius:100px;border:0;font-weight:800;cursor:pointer;width:100%;background:var(--blue);color:#fff}.timeline{position:relative;padding-left:22px;border-left:3px solid #e8efe9;margin:12px}.dot{position:absolute;left:-9px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 0 0 3px #e0f2e9}</style></head><body>
<div id="lock"><div class="card" style="max-width:380px;width:100%;text-align:center"><img src="../logo.png" style="width:70px"><h2>Live Care Tracker</h2><p style="font-size:13px;color:#6a8a7a">Enter Family PIN given by KindHeart to see live updates, photos & meds</p><input id="fpin" class="inp" placeholder="Family PIN - e.g. STE4829"><button class="btn" onclick="login()">View Live Care 🔴</button><p id="err" style="color:#c00;display:none"></p><a href="https://wa.me/254700000000" style="display:block;margin-top:12px;font-size:12px;color:var(--green);font-weight:800;text-decoration:none">Need PIN? WhatsApp Admin</a></div></div>
<div id="app" style="display:none"><div style="background:#fff;padding:14px;position:sticky;top:0;box-shadow:0 4px 20px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px"><img src="../logo.png" style="width:40px"><div><b id="pName">Patient</b><div style="font-size:11px;color:var(--green);font-weight:800">🔴 LIVE • Updates every 5 sec</div></div><button style="margin-left:auto;background:#eef3f0;border:0;padding:8px 12px;border-radius:20px" onclick="logout()">Exit</button></div>
<div class="card" style="background:linear-gradient(135deg,#14495f,#1a5a75);color:#fff"><div style="display:flex;justify-content:space-between"><div><small style="opacity:.8">Today's Progress</small><h2 id="todayCount" style="margin:4px 0">0 reports</h2><small id="lastUpdate">Last update: just now</small></div><div style="background:rgba(255,255,255,.15);padding:10px 14px;border-radius:20px;text-align:center"><b id="photoCount">0</b><br><small>Photos</small></div></div></div>
<div id="feed"></div>
<div class="card"><h4>📞 Need to talk to nurse?</h4><a id="callNurse" href="#" style="text-decoration:none"><button class="btn" style="background:var(--green)">Call Assigned Nurse</button></a></div></div>
<script src="config.js"></script>
<script>
let patient=null;let channel=null;
async function login(){let pin=fpin.value.trim();if(!pin)return;let {data,error}=await supa.from('patients').select('*').eq('family_code',pin).single();if(error||!data){err.style.display='block';err.innerText='Wrong PIN - Ask admin for correct Family PIN';return;}patient=data;localStorage.setItem('kh_family_pin',pin);localStorage.setItem('kh_patient_id',data.id);lock.style.display='none';app.style.display='block';pName.innerText=data.full_name;loadFeed();subscribe();}
function logout(){localStorage.clear();location.reload();}
async function loadFeed(){if(!patient)return;let today=new Date().toISOString().split('T')[0];let {data:records}=await supa.from('care_records').select('*, nurses(full_name, staff_type)').eq('patient_id',patient.id).order('created_at',{ascending:false}).limit(100);let {data:shifts}=await supa.from('shift_reports').select('*, nurses(full_name)').eq('patient_id',patient.id).order('created_at',{ascending:false}).limit(5);let todayRecs=(records||[]).filter(r=>r.shift_date===today);todayCount.innerText=`${todayRecs.length} care reports today`;photoCount.innerText=(records||[]).filter(r=>r.photo_url).length;lastUpdate.innerText='Last: '+(records&&records[0]?new Date(records[0].created_at).toLocaleTimeString():'No reports');feed.innerHTML=(records||[]).map(r=>`<div class="card" style="margin-left:12px"><div class="timeline"><div class="dot" style="background:${r.record_type==='Medication'?'#14495f':'#5ca94a'}"></div><div style="display:flex;justify-content:space-between"><b>${r.record_type==='Medication'?'💊 Medication':'✅ Task'} - ${r.status}</b><small>${r.time_done||''} • ${new Date(r.created_at).toLocaleDateString()}</small></div><small>by ${r.nurses?.staff_type||'Staff'} ${r.nurses?.full_name||''}</small>${r.details?.note?`<div style="background:#f8faf6;padding:12px;border-radius:12px;margin:8px 0;border-left:3px solid var(--green)"><b style="font-size:12px">Nurse Note:</b><br>${r.details.note}</div>`:''}${r.photo_url?`<img src="${r.photo_url}" style="width:100%;border-radius:14px;margin-top:8px;max-height:340px;object-fit:cover" loading="lazy">`:''}</div></div>`).join('')||`<div class="card" style="text-align:center;padding:30px"><h3>Waiting for nurse to start today...</h3><p style="color:#6a8a7a;font-size:13px">Once nurse checks in and reports tasks, you will see photos, notes and meds here live. No need to call.</p></div>`;if(shifts&&shifts.length){feed.innerHTML+=`<div class="card" style="background:#f8faf6"><h4>📝 Shift Summaries</h4>`+shifts.map(s=>`<div style="padding:10px;border-bottom:1px solid #e8efe9"><b>${s.shift_date} - ${s.nurses?.full_name||''}</b><br><small>Summary: ${s.summary||''}</small><br><small style="color:#6a8a7a">Next: ${s.next_notes||''}</small></div>`).join('')+`</div>`;}}
function subscribe(){if(channel)supa.removeChannel(channel);channel=supa.channel('family-'+patient.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'care_records',filter:`patient_id=eq.${patient.id}`},payload=>{loadFeed();if('vibrate' in navigator)navigator.vibrate(200);}).subscribe();}
let savedPin=localStorage.getItem('kh_family_pin');if(savedPin){fpin.value=savedPin;login();}
</script></body></html>
