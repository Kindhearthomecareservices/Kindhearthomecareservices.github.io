<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f8faf6}body{margin:0;font-family:Inter,system-ui;background:var(--bg);padding:10px}.nav{background:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:0 0 18px 18px;box-shadow:0 4px 16px #0001}.nav img{width:38px}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 20px #0001;border:1px solid #e6efe7}.photo{width:100%;border-radius:14px;margin:8px 0}</style></head><body>
<div class="nav"><img src="logo.png"><b style="color:var(--blue)">Kind<span style="color:var(--green)">Heart</span> Family</b></div>
<div class="card"><h3 style="color:var(--blue)">👨‍👩‍👧 Family Access</h3><input id="code" placeholder="Enter Family Code e.g. JACK123" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid #ddeadd"><button onclick="loginF()" style="width:100%;padding:12px;margin-top:8px;background:var(--green);color:#fff;border:0;border-radius:12px;font-weight:800">View My Loved One</button></div><div id="app" style="display:none"><div class="card"><h2 id="pName" style="color:var(--blue);margin:0"></h2><p id="pInfo" style="color:#6a8a7a;margin:4px 0"></p></div><div class="card"><h4>✅ Tasks Done Today</h4><div id="tasks"></div></div><div class="card"><h4>💊 Medications Given</h4><div id="meds"></div></div><div class="card"><h4>❤️ Vitals & Notes</h4><div id="notes"></div></div><div class="card"><h4>📸 True Photos from Nurse - Right care at home</h4><div id="photos"></div></div></div>
<script>
const SUPA_URL="https://enlveleqbqbmhamyqtxzj.supabase.co"; const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curPat=null;
async function loginF(){let code=document.getElementById('code').value.trim(); let {data}=await supa.from('patients').select('*').or(`family_code.eq.${code},phone.eq.${code},family_phone.eq.${code}`).limit(1).single(); if(!data)return alert('Code not found - Ask Admin for Family Code'); curPat=data; document.getElementById('app').style.display='block'; pName.innerText=data.full_name; pInfo.innerText=(data.location||'')+' • '+(data.diagnosis||''); loadAll();}
async function loadAll(){let {data:recs}=await supa.from('care_records').select('*, nurses(full_name)').eq('patient_id',curPat.id).order('created_at',{ascending:false}).limit(100); tasks.innerHTML=recs.filter(r=>r.record_type==='task').map(r=>`<div style="padding:8px;border-bottom:1px solid #eee">✅ ${r.details.task} <small>by ${r.nurses?.full_name} ${new Date(r.created_at).toLocaleTimeString()}</small></div>`).join('')||'No tasks yet'; meds.innerHTML=recs.filter(r=>r.record_type==='medication').map(r=>`<div style="padding:8px;border-bottom:1px solid #eee">💊 ${r.details.med} <small>${new Date(r.created_at).toLocaleTimeString()}</small></div>`).join('')||'No meds yet'; notes.innerHTML=recs.filter(r=>r.record_type==='note'||r.record_type==='photo').map(r=>`<div class="card"><small>${new Date(r.created_at).toLocaleString()} by ${r.nurses?.full_name}</small><br>BP:${r.details?.vitals?.bp||''} Temp:${r.details?.vitals?.temp||''}<br>${r.details?.note||''}</div>`).join('')||'No notes'; photos.innerHTML=recs.filter(r=>r.photo_url).map(r=>`<div class="card"><img class="photo" src="${r.photo_url}"><small>📸 by ${r.nurses?.full_name} ${new Date(r.created_at).toLocaleString()}<br>${r.details?.note||''}</small></div>`).join('')||'No photos yet - Nurse will upload';}
</script></body></html>
