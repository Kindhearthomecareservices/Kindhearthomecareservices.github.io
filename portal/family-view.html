<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Live V3 - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--b:#14495f;--g:#5ca94a}*{box-sizing:border-box}body{margin:0;font-family:Inter;background:#f6faf7;color:var(--b)}.cd{background:#fff;border-radius:18px;padding:16px;margin:10px;box-shadow:0 6px 18px rgba(0,0,0,.05);border:1px solid #eef3ee}.i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0}.bt{padding:12px;border-radius:100px;border:0;font-weight:800;width:100%;background:var(--b);color:#fff;cursor:pointer}.hdr{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;border-bottom:3px solid var(--g);z-index:10}.badge{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:800} canvas{width:100%;height:180px;background:#f8fbff;border-radius:12px;border:1px solid #e3eef3}</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#14495f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99"><div class="cd" style="max-width:380px;width:100%;text-align:center"><img src="logo.png" style="width:70px"><h3 style="margin:6px 0">Family Live Care</h3><p style="font-size:12px;color:#5a8a5a"><a href="https://kindhearthomecareservices.co.ke" style="color:var(--g);font-weight:700;text-decoration:none">kindhearthomecareservices.co.ke</a><br>Right care at home</p><input id="code" class="i" placeholder="Enter Family PIN e.g. JAC4832"><button class="bt" onclick="login()">View Live Updates</button><p id="err" style="color:red;display:none"></p><a href="https://wa.me/254707546365" style="display:block;margin-top:12px;color:var(--g);font-weight:800;text-decoration:none">💬 WhatsApp Admin 0707 546 365</a></div></div>

<div id="app" style="display:none"><div class="hdr"><img src="logo.png" style="width:42px"><div><b id="pname"></b><br><small><a href="https://kindhearthomecareservices.co.ke" target="_blank" style="color:var(--g);text-decoration:none">kindhearthomecareservices.co.ke</a> • <span id="nursename"></span></small></div><button style="margin-left:auto;background:#eee;border:0;padding:6px 14px;border-radius:20px" onclick="logout()">Exit</button></div>

<div class="cd" style="background:linear-gradient(135deg,#14495f,#5ca94a);color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><div><b id="pname2" style="font-size:18px"></b><br><small id="ploc"></small></div><div style="text-align:right"><small>Family PIN</small><br><b id="pcode" style="background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px"></b></div></div></div>

<div class="cd"><h4 style="margin:0 0 8px 0">📈 Vitals Trend (Last 10)</h4><canvas id="chart" width="600" height="200"></canvas><div id="vitalsLatest" style="margin-top:8px;font-size:13px"></div></div>

<div id="feed"></div>

<div class="cd" style="text-align:center;font-size:12px;color:#888"><img src="logo.png" style="width:40px"><br><b>KindHeart Homecare Services</b><br><a href="https://kindhearthomecareservices.co.ke" style="color:var(--g)">www.kindhearthomecareservices.co.ke</a><br>📞 0707 546 365 • Secure & Private • Updates every 15s</div>
</div>
<script>
let patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]'),assigns=JSON.parse(localStorage.getItem('kh_a')||'[]');let pat=null;
function login(){let p=patients.find(x=>x.family_code===code.value.trim());if(!p){err.style.display='block';err.innerText='Wrong PIN - Ask Admin 0707546365';return}pat=p;localStorage.setItem('kh_cur_family',p.family_code);lock.style.display='none';app.style.display='block';pname.innerText=p.full_name+' - Live';pname2.innerText=p.full_name;ploc.innerText=p.location||'Home Care';pcode.innerText=p.family_code;let asg=assigns.find(a=>a.patient_id===p.id);let nurse=asg?staff.find(s=>s.id===asg.staff_id):null;nursename.innerText=nurse?`Care by ${nurse.full_name}`:'';load();}
function logout(){localStorage.removeItem('kh_cur_family');location.reload()}
function drawChart(vitals){let c=document.getElementById('chart');let ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(vitals.length===0){ctx.fillStyle='#888';ctx.font='14px Inter';ctx.fillText('No vitals yet - Nurse will record soon',20,100);return;}let temps=vitals.map(v=>parseFloat(v.vitals.temp)||0).filter(x=>x>0);let pulses=vitals.map(v=>parseFloat(v.vitals.pulse)||0).filter(x=>x>0);ctx.strokeStyle='#e0e0e0';ctx.beginPath();ctx.moveTo(40,20);ctx.lineTo(40,160);ctx.lineTo(580,160);ctx.stroke();
function plot(arr,color,offset){if(arr.length<2)return;let max=Math.max(...arr),min=Math.min(...arr);let range=max-min||1;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();arr.forEach((val,i)=>{let x=50 + i*(500/Math.max(1,arr.length-1));let y=150 - ((val-min)/range)*110 - offset;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();ctx.fillStyle=color;arr.forEach((val,i)=>{let x=50 + i*(500/Math.max(1,arr.length-1));let y=150 - ((val-min)/range)*110 - offset;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();});}
plot(temps,'#e74c3c',0);plot(pulses,'#14495f',0);ctx.fillStyle='#e74c3c';ctx.fillRect(50,10,10,10);ctx.fillStyle='#333';ctx.font='11px Inter';ctx.fillText('Temp °C',65,18);ctx.fillStyle='#14495f';ctx.fillRect(120,10,10,10);ctx.fillText('Pulse',135,18);}
function load(){let all=reports.filter(x=>x.patient_id===pat.id).slice().reverse();let vitals=all.filter(x=>x.type==='Vitals').slice(0,10).reverse();drawChart(vitals);
if(vitals.length>0){let last=vitals[vitals.length-1];vitalsLatest.innerHTML=`<b>Latest:</b> BP ${last.vitals.bp||'-'} | Temp ${last.vitals.temp||'-'}°C | Pulse ${last.vitals.pulse||'-'} | SpO2 ${last.vitals.spo2||'-'}% | Sugar ${last.vitals.sugar||'-'} • ${new Date(last.time).toLocaleString()}`;}else vitalsLatest.innerHTML='No vitals yet';
feed.innerHTML=all.map(r=>{let s=staff.find(x=>x.id===r.staff_id);let icon=r.type==='Vitals'?'🩺':r.type==='Note'?'📝':r.type==='Med'?'💊':'✅';let badge=r.type==='Vitals'?'<span class="badge" style="background:#e3f0ff;color:#1a4a8a">VITALS</span>':r.type==='Note'?'<span class="badge" style="background:#fff3db;color:#8a5a00">SOAP NOTE</span>':r.type==='Med'?`<span class="badge" style="background:#e8e0ff;color:#4a2a8a">${r.status}</span>`:'<span class="badge" style="background:#e0f2e9;color:#2a7a3b">DONE</span>';let body='';if(r.type==='Vitals'){body=`BP: ${r.vitals.bp||'-'} | Temp: ${r.vitals.temp||'-'}°C | Pulse: ${r.vitals.pulse||'-'} bpm | Resp: ${r.vitals.resp||'-'} | SpO2: ${r.vitals.spo2||'-'}% | Wt: ${r.vitals.weight||'-'}kg | Sugar: ${r.vitals.sugar||'-'} | Pain: ${r.vitals.pain||'-'}/10`;}else if(r.type==='Note'&&r.soap){body=`<b>S:</b> ${r.soap.s||''}<br><b>O:</b> ${r.soap.o||''}<br><b>A:</b> ${r.soap.a||''}<br><b>P:</b> ${r.soap.p||''}`;}else body=r.note||'';return `<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${icon} ${r.status}</b> - ${r.type}</div>${badge}</div><small>${s?.full_name||'Staff'} • ${new Date(r.time).toLocaleString()}</small><p style="margin:8px 0;line-height:1.5">${body}</p></div>`}).join('')||'<div class="cd">No reports yet. Nurse Chebet will update soon.</div>';}
let cur=localStorage.getItem('kh_cur_family');if(cur){code.value=cur;login()}setInterval(()=>{if(pat){patients=JSON.parse(localStorage.getItem('kh_p')||'[]');reports=JSON.parse(localStorage.getItem('kh_r')||'[]');load();}},10000);
</script></body></html>
