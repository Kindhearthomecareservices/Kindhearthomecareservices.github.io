<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Live View</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><style>body{margin:0;font-family:Inter,sans-serif;background:#f8faf6}.i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0;background:#fff}.cd{background:#fff;border-radius:16px;padding:14px;margin:10px}.bt{padding:14px;border-radius:100px;border:0;font-weight:800;width:100%;background:#14495f;color:#fff}</style></head><body>
<div id="lk" style="position:fixed;inset:0;background:#14495f;display:flex;align-items:center;justify-content:center;padding:20px"><div class="cd" style="max-width:360px;width:100%;text-align:center"><img src="../logo.png" style="width:60px"><h3>Family Live Care</h3><input id="fp" class="i" placeholder="Enter Family PIN e.g. KIM1234"><button class="bt" onclick="login()">View Live Updates</button><p id="er" style="color:red;display:none"></p><a href="https://wa.me/254707546365" style="display:block;margin-top:12px;color:#5ca94a;font-weight:800;text-decoration:none">WhatsApp Admin - 0707 546 365</a></div></div>
<div id="ap" style="display:none"><div class="cd" style="display:flex;align-items:center;gap:8px"><img src="../logo.png" style="width:36px"><b id="pn"></b><button style="margin-left:auto;background:#eee;border:0;padding:6px 10px;border-radius:20px" onclick="logout()">Exit</button></div><div id="fd"></div></div>
<script>
const U="https://enlvelqeqbmhamyqtxzj.supabase.co";const K="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";let supa=supabase.createClient(U,K);let pat=null;
async function login(){try{let {data,error}=await supa.from('patients').select('*').eq('family_code',fp.value.trim()).single();if(error)throw error;pat=data;localStorage.setItem('f',fp.value.trim());lk.style.display='none';ap.style.display='block';pn.innerText=data.full_name+' - Live';lf();}catch(e){er.style.display='block';er.innerText='Wrong PIN. WhatsApp 0707546365 for help. Error: '+e.message;}}
function logout(){localStorage.clear();location.reload();}
async function lf(){let {data,error}=await supa.from('care_records').select('*, nurses(full_name)').eq('patient_id',pat.id).order('created_at',{ascending:false}).limit(100);if(error){fd.innerHTML=error.message;return;}fd.innerHTML=(data||[]).map(r=>`<div class="cd"><b>${r.status}</b> - ${new Date(r.created_at).toLocaleString()}<br><small>${r.nurses?.full_name||''} • ${r.record_type}</small><p>${r.details?.note||''}</p>${r.photo_url?`<img src="${r.photo_url}" style="width:100%;border-radius:12px;margin-top:8px">`:''}</div>`).join('')||'<div class="cd">No reports yet. Nurse will post updates soon.</div>';}
let s=localStorage.getItem('f');if(s){fp.value=s;login();}
setInterval(()=>{if(pat)lf();},15000);
</script></body></html>
