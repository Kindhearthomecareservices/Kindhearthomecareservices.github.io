<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#fff7ed;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}.photo{width:100%;border-radius:12px;margin:6px 0}</style></head><body>
<div class="card"><h3>👨‍👩‍👧 Family Portal</h3><input id="code" placeholder="Family Code or Phone"><button onclick="loginF()" style="padding:10px;background:#f59e0b;border:0;border-radius:10px;font-weight:800">View My Loved One</button></div><div id="app" style="display:none"><div class="card"><h2 id="pName"></h2><p id="pInfo"></p></div><div class="card"><h4>✅ Tasks Done</h4><div id="tasks"></div></div><div class="card"><h4>💊 Meds Given</h4><div id="meds"></div></div><div class="card"><h4>❤️ Vitals & Notes</h4><div id="notes"></div></div><div class="card"><h4>📸 True Photos from Nurse</h4><div id="photos"></div></div></div>
<script>
const SUPA_URL="https://xdyoqxhqbeuiuvpsqlbb.supabase.co"; const SUPA_KEY="YOUR_ANON_KEY_HERE"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curPat=null;
async function loginF(){let code=document.getElementById('code').value.trim(); let {data}=await supa.from('patients').select('*').or(`family_code.eq.${code},phone.eq.${code},family_phone.eq.${code}`).limit(1).single(); if(!data){alert('Not found');return;} curPat=data; document.getElementById('app').style.display='block'; document.getElementById('pName').innerText=data.full_name; document.getElementById('pInfo').innerText=(data.location||'')+' - '+(data.diagnosis||''); loadAll();}
async function loadAll(){let {data:recs}=await supa.from('care_records').select('*, nurses(full_name)').eq('patient_id',curPat.id).order('created_at',{ascending:false}).limit(100); document.getElementById('tasks').innerHTML=recs.filter(r=>r.record_type==='task').map(r=>`<div>✅ ${r.details.task} by ${r.nurses?.full_name} ${new Date(r.created_at).toLocaleTimeString()}</div>`).join('')||'No tasks yet'; document.getElementById('meds').innerHTML=recs.filter(r=>r.record_type==='medication').map(r=>`<div>💊 ${r.details.med} ${new Date(r.created_at).toLocaleTimeString()}</div>`).join('')||'No meds'; document.getElementById('notes').innerHTML=recs.filter(r=>r.record_type==='note'||r.record_type==='vitals').map(r=>`<div class="card"><small>${new Date(r.created_at).toLocaleString()} by ${r.nurses?.full_name}</small><br>BP:${r.details?.vitals?.bp||''} Temp:${r.details?.vitals?.temp||''}<br>${r.details?.note||''}</div>`).join('')||'No notes'; document.getElementById('photos').innerHTML=recs.filter(r=>r.photo_url).map(r=>`<div class="card"><img class="photo" src="${r.photo_url}"><small>📸 by ${r.nurses?.full_name} ${new Date(r.created_at).toLocaleString()}<br>${r.details?.note||''}</small></div>`).join('')||'No photos yet';}
</script></body></html>
