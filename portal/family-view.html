<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Premium</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--g:#0f3d2e;--bg:#f0fdf4}*{font-family:Inter;box-sizing:border-box}body{background:var(--bg);margin:0;padding:12px}.header{background:var(--g);color:#fff;padding:18px;border-radius:20px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.06)}.badge{padding:6px 12px;border-radius:99px;font-weight:700;font-size:12px}.low{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.nurseBox{background:#ecfdf3;border:1px solid #a6f4c5;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="header"><b>KindHeart Family Portal</b><br><small>Live care updates</small></div>
<div class="card"><input id="pid" placeholder="Patient ID KH-001"><button onclick="load()" style="width:100%;padding:12px;border-radius:12px;border:0;background:var(--g);color:#fff;font-weight:800">View Full Report</button></div>
<div id="patient" class="card"></div><div id="nurseCard"></div><div id="alert" class="card"></div>
<div class="card"><b>💊 Treatment Sheet - Given Today</b><div id="tlist"></div></div>
<div class="card"><b>🩺 Latest Vitals & Nursing Care</b><div id="vlist"></div></div>
<div class="card"><b>📋 Day Reports History</b><div id="hlist"></div></div>
<script>
const URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const S=window.supabase.createClient(URL,KEY);
async function load(){let id=pid.value.trim()||new URLSearchParams(location.search).get('id'); if(!id)return; pid.value=id;
const {data:pt}=await S.from('patients').select('*').eq('patient_id',id).single();
patient.innerHTML=pt?`<b>${pt.patient_id} - ${pt.full_name||''}</b><br>${pt.diagnosis||''} | ${pt.address||''}`:'Not found';
nurseCard.innerHTML=pt?`<div class=card style="margin:0"><div class=nurseBox><div class=avatar>${(pt.assigned_nurse_name||'N').slice(0,2).toUpperCase()}</div><div><b>Caregiver Today: ${pt.assigned_nurse_name||'Not assigned yet'}</b><br><small>${pt.assigned_nurse_role||'Nurse/Caregiver'} | ${pt.assigned_nurse_phone||''}</small><br><small style="color:#065f46">✅ Verified by KindHeart - On duty now</small></div></div></div>`:'';
const {data:sheets}=await S.from('daily_sheets').select('*').eq('patient_id',id).order('created_at',{ascending:false});
if(!sheets||!sheets.length){alert.innerHTML='No reports yet'; return} let latest=sheets[0];
const {data:master}=await S.from('treatment_sheets').select('*').eq('patient_id',id).eq('is_active',true);
let today=new Date().toISOString().split('T')[0]; const {data:logs}=await S.from('treatment_logs').select('*, treatment_sheets(drug_name,dosage)').eq('patient_id',id).eq('date',today);
tlist.innerHTML=(master||[]).map(m=>{let given=(logs||[]).filter(l=>l.treatment_id==m.id); let slots=given.map(g=>`<span style="color:#065f46;font-weight:700">✅ ${g.given_time_slot} ${new Date(g.given_at).toLocaleTimeString()}</span>`).join(' ')||'<span style="color:#999">Not yet given today</span>'; return `<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${m.drug_name} ${m.dosage||''} ${m.frequency||''}</b><br><small>${m.times||''}</small><br>${slots}</div>`}).join('')||'No sheet';
vlist.innerHTML=`<table style="width:100%"><tr><td>AVPU</td><td>${latest.avpu||''}</td></tr><tr><td>BP / HR / Temp</td><td>${latest.bp_morning||''} / ${latest.hr_morning||''} / ${latest.temp_morning||''}</td></tr><tr><td>Input / Output</td><td>${latest.input_ml||''} / ${latest.output_ml||''} ml</td></tr><tr><td>Pills</td><td><span class="badge ${latest.days_left<=4?'low':'ok'}">${latest.pills_remaining} - ${latest.days_left} days</span></td></tr><tr><td>Nursing Care</td><td>${latest.nursing_cares||''}</td></tr><tr><td>Day Report</td><td><b>${latest.day_report||''}</b></td></tr></table>`;
alert.innerHTML=latest.days_left<=8?`<span class="badge low">⚠️ LOW STOCK ${latest.pills_remaining} pills - ${latest.days_left} days</span><br><a href="https://wa.me/254${(pt?.family_phone||'').replace(/^0/,'')}?text=Refill for ${id}" style="display:inline-block;margin-top:8px;padding:10px;background:#000;color:#fff;border-radius:10px;text-decoration:none">Refill via WhatsApp</a>`:`<span class="badge ok">OK Stock ${latest.days_left} days</span>`;
hlist.innerHTML=sheets.map(s=>`<div style="padding:8px 0;border-bottom:1px solid #f5f5f5"><small>${new Date(s.created_at).toLocaleString()}</small><br>Care: ${s.nursing_cares||''}<br>Report: ${s.day_report||''}</div>`).join('');
}
(function(){let id=new URLSearchParams(location.search).get('id'); if(id){pid.value=id; load();}})();
</script></body></html>
