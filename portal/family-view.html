<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Live</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Inter;background:#f5f8f5}.i{width:100%;padding:12px;border:2px solid #ddeadd;border-radius:10px;margin:6px 0}.cd{background:#fff;border-radius:14px;padding:14px;margin:10px;box-shadow:0 4px 10px rgba(0,0,0,.05)}.bt{padding:14px;border-radius:100px;border:0;font-weight:800;width:100%;background:#14495f;color:#fff}</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#14495f;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99"><div class="cd" style="max-width:340px;width:100%;text-align:center"><h3>Family Live Care</h3><input id="code" class="i" placeholder="Enter Family PIN e.g. STE1234"><button class="bt" onclick="login()">View Live Updates</button><p id="err" style="color:red;display:none"></p><a href="https://wa.me/254707546365" style="display:block;margin-top:12px;color:#5ca94a;font-weight:800;text-decoration:none">WhatsApp Admin 0707 546 365</a></div></div>
<div id="app" style="display:none"><div class="cd" style="display:flex;align-items:center;gap:8px"><b id="pname"></b><button style="margin-left:auto;background:#eee;border:0;padding:6px 10px;border-radius:20px" onclick="logout()">Exit</button></div><div id="feed"></div></div>
<script>
let patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]');let pat=null;
function login(){let p=patients.find(x=>x.family_code===code.value.trim());if(!p){err.style.display='block';err.innerText='Wrong PIN - Ask Admin 0707546365';return}pat=p;localStorage.setItem('kh_cur_family',p.family_code);lock.style.display='none';app.style.display='block';pname.innerText=p.full_name+' - Live';load()}
function logout(){localStorage.removeItem('kh_cur_family');location.reload()}
function load(){let r=reports.filter(x=>x.patient_id===pat.id).slice().reverse();feed.innerHTML=r.map(x=>{let s=staff.find(z=>z.id===x.staff_id);return `<div class="cd"><b>${x.status}</b> - ${x.type}<br><small>${s?.full_name||''} • ${new Date(x.time).toLocaleString()}</small><p>${x.note||''}</p></div>`}).join('')||'<div class="cd">No reports yet. Nurse will update soon.</div>'}
let cur=localStorage.getItem('kh_cur_family');if(cur){code.value=cur;login()}setInterval(()=>{if(pat)load()},10000);
</script></body></html>
