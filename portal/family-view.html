<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f8faf6}body{margin:0;font-family:Inter,system-ui;background:var(--bg);padding:0}.nav{background:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;box-shadow:0 4px 16px #0001;position:sticky;top:0;z-index:9}.nav img{width:48px}.nav b{color:var(--blue);font-size:18px}.nav b span{color:var(--green)}.wrap{max-width:480px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 26px #14495f12;border:1px solid #e6efe7}.input{width:100%;padding:14px;border-radius:14px;border:1.8px solid #ddeadd;font-size:15px}.btn{width:100%;padding:14px;background:var(--green);color:#fff;border:0;border-radius:14px;font-weight:800;font-size:16px;margin-top:10px}.photo{width:100%;border-radius:14px;margin:8px 0;box-shadow:0 6px 18px #0002}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#e9f3ea;color:var(--blue)}</style></head><body>
<div class="nav"><img src="logo.png"><div><b>Kind<span>Heart</span></b><div style="font-size:10px;letter-spacing:2px;color:var(--blue);font-weight:700">FAMILY PORTAL</div><div style="font-size:11px;color:var(--green);font-weight:600">💚 Right care at home 💚</div></div></div>
<div class="wrap"><div class="card"><h3 style="color:var(--blue);margin:0 0 10px">👨‍👩‍👧 Family Login</h3><p style="font-size:13px;color:#6a8a7a">Enter Family PIN that Admin generated for you</p><input id="code" class="input" placeholder="Family PIN e.g. JAC4829"><button class="btn" onclick="loginF()">View My Loved One →</button></div><div id="app" style="display:none"><div class="card"><h2 id="pName" style="color:var(--blue);margin:0"></h2><p id="pInfo" style="color:#6a8a7a;margin:6px 0"></p><span class="badge" id="pStatus">Active Care</span><div id="assignedStaff" style="margin-top:10px;font-size:13px"></div></div><div class="card"><h4 style="color:var(--blue)">✅ Daily Tasks & Care</h4><div id="tasks"></div></div><div class="card"><h4 style="color:var(--blue)">💊 Medications Taken</h4><div id="meds"></div></div><div class="card"><h4 style="color:var(--blue)">📝 Caregiver / Nursing Notes</h4><div id="notes"></div></div><div class="card"><h4 style="color:var(--blue)">📸 True Photos from Nurse / Caregiver</h4><div id="photos"></div></div></div></div>
<script>
const SUPA_URL="https://enlveleqbqbmhamyqtxzj.supabase.co"; const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let curPat=null;
async function loginF(){let code=document.getElementById('code').value.trim(); if(!code)return alert('Enter Family PIN'); let {data,error}=await supa.from('patients').select('*').or(`family_code.eq.${code},family_pin.eq.${code},phone.eq.${code},family_phone.eq.${code}`).limit(1).single(); if(error||!data)return alert('PIN not found - Ask Admin'); curPat=data; app.style.display='block'; pName.innerText=data.full_name; pInfo.innerText=(data.location||'Eldoret')+' • '+(data.diagnosis||'Under Home Care'); loadAll(); window.scrollTo(0,200);}
async function loadAll(){let {data:assigns}=await supa.from('patient_assignments').select('*, nurses(full_name, staff_type, role)').eq('patient_id',curPat.id).eq('is_active',true); assignedStaff.innerHTML=(assigns||[]).map(a=>{let role=a.nurses?.staff_type||a.nurses?.role||'Staff'; return `<div style="background:#f0f7f0;padding:8px 12px;border-radius:10px;margin:4px 0">👩‍⚕️ <b>${role}:</b> ${a.nurses?.full_name} (${a.care_type||''})</div>`}).join('')||'<small>No staff assigned yet</small>'; let {data:recs}=await supa.from('care_records').select('*, nurses(full_name, staff_type, role)').eq('patient_id',curPat.id).order('created_at',{ascending:false}).limit(100); tasks.innerHTML=recs.filter(r=>r.record_type==='task').map(r=>{let role=r.nurses?.staff_type||r.nurses?.role||''; return `<div style="padding:10px;border-bottom:1px solid #f0f5f1">✅ <b>${r.details.task}</b> <br><small style="color:#6a8a7a">by ${role} ${r.nurses?.full_name||'Staff'} • ${new Date(r.created_at).toLocaleString()} ${r.details?.note?`<br>📝 Note: ${r.details.note}`:''}</small></div>`}).join('')||'<small style="color:#999">No tasks completed yet</small>'; meds.innerHTML=recs.filter(r=>r.record_type==='medication').map(r=>{let role=r.nurses?.staff_type||r.nurses?.role||''; return `<div style="padding:10px;border-bottom:1px solid #f0f5f1">💊 <b>${r.details.med} ${r.details.dosage||''}</b><br><small style="color:#6a8a7a">by ${role} ${r.nurses?.full_name} • ${new Date(r.created_at).toLocaleString()} ${r.details?.note?`<br>📝 Note: ${r.details.note}`:''}</small></div>`}).join('')||'<small style="color:#999">No medications yet</small>'; notes.innerHTML=recs.filter(r=>r.details?.note||r.details?.vitals).map(r=>{let role=r.nurses?.staff_type||r.nurses?.role||''; return `<div style="background:#f7faf7;padding:12px;border-radius:14px;margin:8px 0"><small style="color:var(--blue);font-weight:700">${new Date(r.created_at).toLocaleString()} • ${role} ${r.nurses?.full_name||'Staff'}</small><br>${r.details?.vitals?.bp?`BP: ${r.details.vitals.bp} `:''}${r.details?.vitals?.temp?`Temp: ${r.details.vitals.temp}`:''}<br>${r.details?.note||''}</div>`}).join('')||'<small style="color:#999">No notes yet</small>'; photos.innerHTML=recs.filter(r=>r.photo_url).map(r=>{let role=r.nurses?.staff_type||r.nurses?.role||''; return `<div style="background:#fff;border:1px solid #e6efe7;border-radius:16px;padding:10px;margin:10px 0"><img class="photo" src="${r.photo_url}"><div style="padding:6px"><small style="color:var(--blue);font-weight:700">📸 by ${role} ${r.nurses?.full_name||'Staff'} • ${new Date(r.created_at).toLocaleString()}</small><br><small>${r.details?.note||'Care photo'}</small></div></div>`}).join('')||'<div style="text-align:center;padding:20px;color:#999">No photos yet</div>';}
</script></body></html>
