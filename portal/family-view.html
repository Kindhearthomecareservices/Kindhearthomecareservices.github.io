<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Portal - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://enlvelqeqbmhamyqtzxj.supabase.co";const SUPABASE_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter;background:#f6f9f7;color:#123}.top{background:#0A7A42;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0}.main{padding:10px;max-width:900px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}.i{padding:10px;border:2px solid #ddeadd;border-radius:10px;width:100%;margin:4px 0}.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.small{font-size:11px;color:#6b7e6f;font-weight:600}.badge{padding:3px 8px;border-radius:100px;font-size:11px;font-weight:800}.ok{background:#e8f5e3;color:#0A7A42}.bad{background:#ffe8e8;color:#a00}.item{padding:8px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;flex-wrap:wrap}</style></head><body><div class="top"><div><b>Family Portal</b><br><span style="font-size:11px">KindHeart Homecare Services</span></div><button class="btn" style="background:#fff;color:#0A7A42" onclick="location.reload()">Logout</button></div><div class="main"><div id="loginBox" class="card" style="max-width:420px;margin:80px auto;text-align:center"><div style="font-size:42px">👨‍👩‍👧</div><h2>Family Portal</h2><p class="small">Enter your Family PIN given by Admin</p><input id="pin" class="i" placeholder="Enter Family PIN"><button class="btn" style="background:#0A7A42;color:#fff;width:100%;margin-top:8px" onclick="login()">View My Loved One</button><div id="lmsg" class="small"></div></div><div id="appBox" style="display:none"><div id="patCard" class="card"></div><div class="card"><h3>📊 Latest Vitals</h3><div id="vitals"></div></div><div class="card"><h3>📋 Tasks Today</h3><div id="tasks"></div></div><div class="card"><h3>💊 Medications Balance (Treatment Sheet)</h3><div id="meds"></div></div><div class="card"><h3>📦 Consumables Used — Diapers, Gloves etc (Logged by Caregiver)</h3><div id="invLog"></div></div><div class="card"><h3>📝 Care Reports</h3><div id="reports"></div></div></div></div><script>
let curPat=null;
async function login(){let {data:p,error}=await supabaseClient.from('patients').select('*').eq('family_code',pin.value.trim()).single();if(error||!p){lmsg.innerText='Invalid PIN';return}curPat=p;loginBox.style.display='none';appBox.style.display='block';loadAll();}
async function loadAll(){patCard.innerHTML=`<b>${curPat.full_name}</b> <span class="badge ok">${curPat.care_status}</span><br><span class="small">Location: ${curPat.location||''} • Allergies: ${curPat.allergies||'None'} • Diagnosis: ${curPat.diagnosis||''}</span>`;let {data:v}=await supabaseClient.from('care_records').select('*').eq('patient_id',curPat.id).order('time',{ascending:false}).limit(10);vitals.innerHTML=(v||[]).map(r=>`<div style="padding:6px 0;border-bottom:1px solid #eee;font-size:13px">${r.bp?'BP '+r.bp+' ':''}${r.temperature?'Temp '+r.temperature+'°C ':''}${r.spo2?'SpO2 '+r.spo2+'% ':''} ${r.flag_alert?'🚨':''} <small class="small">${new Date(r.time).toLocaleString()}</small><br><span class="small">${r.status||''} ${r.notes||''}</span></div>`).join('')||'No vitals yet';let {data:t}=await supabaseClient.from('tasks').select('*').eq('patient_id',curPat.id).order('created_at',{ascending:false}).limit(20);tasks.innerHTML=(t||[]).map(x=>`<div class="item"><span>${x.title} ${x.due_time||''}</span><span class="badge ${x.status=='Done'?'ok':'bad'}">${x.status}</span></div>`).join('')||'No tasks';let {data:m}=await supabaseClient.from('treatments').select('*').eq('patient_id',curPat.id);meds.innerHTML=(m||[]).map(x=>`<div class="item"><div><b>${x.medication}</b> ${x.dosage||''} ${x.frequency||''}<br><span class="small">${x.instructions||''}</span></div><div style="text-align:right"><span class="small">Total ${x.total_quantity||0}</span><br><b style="color:${(x.remaining_quantity||0)<5?'red':'green'}">${x.remaining_quantity||0} left</b><br>${(x.remaining_quantity||0)<5?'<span class="badge bad">LOW!</span>':''}</div></div>`).join('')||'No medications';let {data:tr}=await supabaseClient.from('inventory_transactions').select('*').eq('patient_id',curPat.id).order('created_at',{ascending:false}).limit(50);let {data:items}=await supabaseClient.from('inventory_items').select('*');let {data:staff}=await supabaseClient.from('staff').select('*');invLog.innerHTML=(tr||[]).map(t=>{let iname=items.find(x=>x.id==t.item_id)?.name||t.notes||'Item';let sname=staff.find(x=>x.id==t.staff_id)?.full_name||'Caregiver';return `<div style="padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px"><b>${t.quantity}x ${iname}</b> used by ${sname} <small class="small">${new Date(t.created_at).toLocaleString()} ${t.notes||''}</small></div>`}).join('')||'No consumables logged yet';reports.innerHTML=(v||[]).filter(x=>x.status&&!x.bp).map(r=>`<div style="padding:6px 0;border-bottom:1px solid #eee;font-size:12px">${r.status} ${r.flag_alert?'🚨':''} <small class="small">${new Date(r.time).toLocaleString()}</small></div>`).join('')||'No reports';}
</script></body></html>
