<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Portal - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--b:#14495f;--g:#5ca94a;--bg:#c8d5c1}*{box-sizing:border-box}body{margin:0;font-family:Inter;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#fff;padding:28px;border-radius:22px;max-width:380px;width:100%;text-align:center}.i{width:100%;padding:12px 14px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0}.bt{padding:12px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.phone{width:100%;max-width:420px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(20,73,95,.15)}.head{padding:18px;display:flex;align-items:center;gap:12px}.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px}.sc{background:#f8fbf7;border-radius:16px;padding:12px;text-align:center;border:1.5px solid #e3ece0}.sc.ok{border-color:#5ca94a;background:#e8f5e3}.sc.warn{border-color:#e6a200;background:#fff8db}.sc.bad{border-color:#c00;background:#ffe8e8}.bubble{background:#eef7ec;border-radius:22px 22px 22px 4px;padding:14px;margin:10px 12px}.bubble.bad{background:#ffe8e8;border-left:4px solid #c00}.bubble.warn{background:#fff8db;border-left:4px solid #e6a200}.next{margin:12px;border:1.5px dashed #8aa58a;border-radius:14px;padding:10px;text-align:center;font-weight:700;font-size:13px}</style></head><body>
<div id="lock"><div class="box"><img src="logo.png" style="width:80px"><h2 style="margin:8px 0"><span style="color:#14495f">Kind</span><span style="color:#5ca94a">Heart</span></h2><div style="letter-spacing:3px;font-size:11px;font-weight:800;color:#8aa58a">HOMECARE SERVICES</div><p style="font-size:13px">Family Portal</p><input id="code" class="i" placeholder="Enter Family PIN"><button class="bt" style="background:#14495f;color:#fff;width:100%" onclick="login()">View Care Updates</button><p id="err" style="color:red;display:none">Invalid PIN</p></div></div>
<div id="app" class="phone" style="display:none">
<div class="head"><img src="logo.png" style="width:40px"><div><b>KindHeart</b><div style="font-size:11px;background:#5ca94a;color:#fff;padding:2px 8px;border-radius:100px;display:inline-block">Family Portal</div></div><div style="margin-left:auto"><button style="background:#fee4e4;color:#c00;border:0;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700" onclick="logout()">Logout</button></div></div>
<div style="padding:0 16px 8px;display:flex;align-items:center;gap:12px"><div id="av" style="width:64px;height:64px;border-radius:100px;background:#d8e6d2;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#14495f">P</div><div><div id="pname" style="font-weight:800;font-size:20px">Patient</div><div id="ploc" style="font-size:13px;color:#5a8a5a">📍 Eldoret • 🧑‍⚕️ Nurse: --</div></div></div>
<div class="sum"><div class="sc" id="s_vitals"><div style="font-size:24px">✅</div><b id="vtxt">Vitals OK</b><br><small id="vsub">Stable</small></div><div class="sc"><div style="font-size:24px">📋</div><b id="ttxt">0 Tasks</b><br><small>Today</small></div><div class="sc"><div style="font-size:24px">💊</div><b id="mtxt">0 Meds</b><br><small>Today</small></div></div>
<div style="padding:16px 16px 0;font-weight:800">🕒 Today's Updates</div><div id="feed"></div>
<div class="next">🔔 Next: Nurse will update after visit</div>
<div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><a id="whatsapp" href="#" target="_blank" style="background:#25D366;color:#fff;text-decoration:none;padding:12px;border-radius:100px;text-align:center;font-weight:800">💬 WhatsApp</a><a href="https://www.kindhearthomecareservices.co.ke" target="_blank" style="background:#eaf3eb;color:#14495f;text-decoration:none;padding:12px;border-radius:100px;text-align:center;font-weight:800;border:1.5px solid #14495f">🌐 Website</a></div></div>
<script>
let patients=[],staff=[],assigns=[],reports=[],curP=null;
function load(){patients=JSON.parse(localStorage.getItem('kh_p')||'[]');staff=JSON.parse(localStorage.getItem('kh_s')||'[]');assigns=JSON.parse(localStorage.getItem('kh_a')||'[]');reports=JSON.parse(localStorage.getItem('kh_r')||'[]');}
function login(){load();let p=patients.find(x=>x.family_code===code.value.trim());if(!p){err.style.display='block';return;}curP=p;sessionStorage.setItem('family',JSON.stringify(p));render();}
function logout(){sessionStorage.clear();location.reload();}
let sf=sessionStorage.getItem('family');if(sf){curP=JSON.parse(sf);render();}
function checkBP(bp){if(!bp||!bp.includes('/')) return {t:'--',c:'ok'};let s=parseInt(bp.split('/')[0]);let d=parseInt(bp.split('/')[1]);if(s>=180||d>=120) return {t:'CRISIS 200/100 — High!',c:'bad'};if(s>=140||d>=90) return {t:'HIGH — Alert',c:'bad'};if(s>=130||d>=85) return {t:'Elevated',c:'warn'};if(s<90||d<60) return {t:'Low',c:'warn'};return {t:'Normal',c:'ok'};}
function checkTemp(t){let v=parseFloat(t);if(isNaN(v))return{t:'--',c:'ok'};if(v>=38)return{t:'Fever '+v+'°C',c:'bad'};if(v>=37.5)return{t:'Slightly High',c:'warn'};if(v<35.5)return{t:'Low Temp',c:'warn'};return{t:'Normal',c:'ok'};}
function checkSpO2(v){let n=parseInt(v);if(isNaN(n))return{t:'--',c:'ok'};if(n<90)return{t:'LOW '+n+'%',c:'bad'};if(n<94)return{t:'Low '+n+'%',c:'warn'};return{t:'Normal',c:'ok'};}
function render(){load();document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';document.getElementById('pname').innerText=curP.full_name;document.getElementById('ploc').innerText=`📍 ${curP.location||'Eldoret'} • 🧑‍⚕️ Nurse: ${getNurse()}`;document.getElementById('av').innerText=curP.full_name.charAt(0).toUpperCase();document.getElementById('whatsapp').href=`https://wa.me/254707546365?text=Hello KindHeart, update on ${curP.full_name} - PIN ${curP.family_code}`;let today=new Date().toDateString();let r=reports.filter(x=>x.patient_id===curP.id);let tToday=r.filter(x=>x.type==='Task'&&new Date(x.time).toDateString()===today).length;let mToday=r.filter(x=>x.type==='Med'&&x.status==='Given'&&new Date(x.time).toDateString()===today).length;let vit=r.filter(x=>x.type==='Vitals').slice(-1)[0];let overall='ok';let vitTxt='Vitals OK';let vitSub='Stable';if(vit&&vit.vitals){let bp=checkBP(vit.vitals.bp);let temp=checkTemp(vit.vitals.temp);let spo=checkSpO2(vit.vitals.spo2);if(bp.c==='bad'||temp.c==='bad'||spo.c==='bad'){overall='bad';vitTxt=bp.c==='bad'?bp.t:temp.c==='bad'?temp.t:spo.t;vitSub='Needs Attention!';}else if(bp.c==='warn'||temp.c==='warn'||spo.c==='warn'){overall='warn';vitTxt=bp.c==='warn'?bp.t:temp.c==='warn'?temp.t:spo.t;vitSub='Elevated';}}let sv=document.getElementById('s_vitals');sv.className='sc '+overall;document.getElementById('vtxt').innerText=vitTxt;document.getElementById('vsub').innerText=vitSub;document.getElementById('ttxt').innerText=tToday+' Tasks';document.getElementById('mtxt').innerText=mToday+' Meds';let feed=document.getElementById('feed');if(r.length===0){feed.innerHTML='<div class="bubble">No updates yet</div>';return;}feed.innerHTML=r.slice().reverse().slice(0,20).map(x=>{let who=staff.find(s=>s.id===x.staff_id);let name=who?who.full_name:'Nurse';let time=new Date(x.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});let msg='';let cls='bubble';if(x.type==='Vitals'&&x.vitals){let bp=checkBP(x.vitals.bp);let tp=checkTemp(x.vitals.temp);let sp=checkSpO2(x.vitals.spo2);if(bp.c==='bad'||tp.c==='bad'||sp.c==='bad') cls='bubble bad';else if(bp.c==='warn'||tp.c==='warn'||sp.c==='warn') cls='bubble warn';msg=`🩺 <b>${name} checked BP ${x.vitals.bp||'-'} — ${bp.t}</b><br>Temp ${x.vitals.temp||'-'} • ${tp.t} • Pulse ${x.vitals.pulse||'-'} • SpO2 ${x.vitals.spo2||'-'}% • ${sp.t}`;}else if(x.type==='Task'){msg=`✅ ${x.note}`}else if(x.type==='Med'){msg=`💊 ${x.note} • Status: ${x.status}`}else if(x.type==='Note'&&x.soap){msg=`📝 <b>Note:</b> ${x.soap.s||''} ${x.soap.o||''}`}else msg=x.note||'';return `<div class="${cls}">${msg}<br><small>🕒 ${time} • Just now</small></div>`}).join('');}
function getNurse(){let a=assigns.find(x=>x.patient_id===curP.id);if(!a)return '--';let s=staff.find(x=>x.id===a.staff_id);return s?s.full_name:'--';}
</script></body></html>
