<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KindHeart Admin Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f4a5a;--green:#6bb64a;--greenLight:#e8f5e3;--bg:#f7f9f6;--card:#ffffff;--text:#101828;--muted:#667085;--border:#eef2e7;--radius:20px}
*{font-family:Inter,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);padding:0 0 110px 0;max-width:480px;margin:0 auto}
.top{background:var(--card);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.logoWrap{display:flex;align-items:center;gap:10px}.logoWrap img{width:42px;height:42px;object-fit:contain;border-radius:10px}
.badge{background:var(--teal);color:#fff;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin:14px 16px;box-shadow:0 8px 32px rgba(15,74,90,.06);border:1px solid var(--border)}
.cardTitle{font-weight:800;font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid #d0d5dd;border-radius:14px;margin:7px 0;font-size:14px;background:#fff;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--greenLight)}
.btn{width:100%;padding:14px;border-radius:14px;border:0;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}.btn-teal{background:var(--teal);color:#fff}.btn-teal:active{transform:scale(.98)}.btn-green{background:var(--green);color:#fff}.btn-outline{background:#fff;border:1.5px solid var(--teal);color:var(--teal)}
.row{display:flex;gap:10px}.row>*{flex:1}
.clientCard{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #f2f4f7}.clientCard:last-child{border:0}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--green));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.pill{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block}.pill-green{background:var(--greenLight);color:var(--teal);border:1px solid #c6e8b8}.pill-gray{background:#f2f4f7;color:#667085}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:14px;border-radius:16px;background:var(--greenLight);border:1px solid #d8edcf}.stat b{font-size:22px;color:var(--teal)}.stat small{color:var(--muted)}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 14px 0;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.08);z-index:20}
.tabItem{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;transition:.2s;padding:4px 16px;border-radius:12px}.tabItem.active{color:var(--teal);background:var(--greenLight)}.tabItem.icon{font-size:20px}
.page{display:none;animation:fade.25s ease}.page.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.treatItem{padding:10px 12px;background:#f8faf6;border-radius:12px;margin:6px 0;border-left:4px solid var(--green)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<script>if(prompt('Admin PIN')!=='2024'){location.href='/';}</script>
<div class="top"><div class="logoWrap"><img src="logo.png" onerror="this.src='https://via.placeholder.com/42'"><div><b style="color:var(--teal)">KindHeart</b> <b style="color:var(--green)">Admin</b><br><small style="color:var(--muted);font-size:11px">Right care at home • Premium</small></div></div><div class="badge" id="countBadge">0 Clients</div></div>

<!-- PAGE 1: DASHBOARD -->
<div id="dashPage" class="page active">
<div class="card"><div class="stats"><div class="stat"><small>Total Clients</small><br><b id="statClients">0</b></div><div class="stat" style="background:#eef6ff;border-color:#c7dfff"><small>Active Nurses</small><br><b id="statNurses" style="color:#0f4a5a">0</b></div></div></div>

<div class="card"><div class="cardTitle">➕ Add New Client <span style="font-size:11px;color:var(--muted)">No ID needed - Use Name</span></div>
<input id="fname" placeholder="Full Name e.g Steve Torotich"><div class="row"><input id="age" placeholder="Age"><input id="gender" placeholder="Male / Female"></div>
<input id="diag" placeholder="Diagnosis e.g Flu, Hypertension"><input id="famname" placeholder="Family Contact Name"><input id="famphone" placeholder="Family WhatsApp 07..."><input id="addr" placeholder="Address - Estate, Eldoret">
<button class="btn btn-teal" onclick="addClient()">Save Client</button><p id="cmsg" style="margin-top:8px;font-weight:700;font-size:13px"></p></div>

<div class="card"><div class="cardTitle">💊 Quick Assign & Treatment</div>
<input id="clientName" placeholder="Type Client Name" list="dlist" onchange="viewSheet()"><datalist id="dlist"></datalist>
<select id="nurseSelect"><option>Select Nurse / Caregiver</option></select>
<button class="btn btn-green" style="margin-top:8px" onclick="assignNurse()">Assign Nurse → Family will see name</button>
<div class="row" style="margin-top:12px"><input id="drug" placeholder="Drug e.g Amlodipine"><input id="dose" placeholder="5mg"></div>
<div class="row"><input id="freq" placeholder="BD / OD"><input id="times" placeholder="Morning, Evening"></div>
<button class="btn btn-outline" onclick="addMed()">+ Add to Treatment Sheet</button>
<div id="sheetPreview" style="margin-top:12px"></div></div>
</div>

<!-- PAGE 2: CLIENTS -->
<div id="clientsPage" class="page">
<div class="card"><div class="cardTitle">📋 All Clients <span class="pill pill-green" id="clientCount">0 total</span></div>
<input id="search" placeholder="🔍 Search client name..." oninput="filterClients()">
<div id="clientsList" style="margin-top:10px">Loading...</div></div>
</div>

<!-- PAGE 3: STAFF -->
<div id="staffPage" class="page">
<div class="card"><div class="cardTitle">👩‍⚕️ Staff Directory</div>
<div class="row"><input id="sname" placeholder="Name Faith Chebet"><input id="srole" placeholder="RN / Caregiver"></div>
<div class="row"><input id="sphone" placeholder="Phone 07..."><input id="sid" placeholder="ID No"></div>
<button class="btn btn-outline" onclick="addStaff()">+ Add Staff</button><div id="staffList" style="margin-top:12px"></div></div>
</div>

<!-- PAGE 4: TREATMENTS -->
<div id="treatPage" class="page"><div class="card"><div class="cardTitle">💊 All Treatment Sheets</div><div id="allSheets">Loading...</div></div></div>

<!-- BOTTOM TABS - NOW WORKING -->
<div class="bottomNav">
<div class="tabItem active" onclick="switchTab('dashPage',this)"><span class="icon">🏠</span>Home</div>
<div class="tabItem" onclick="switchTab('clientsPage',this)"><span class="icon">👥</span>Clients</div>
<div class="tabItem" onclick="switchTab('staffPage',this)"><span class="icon">👩‍⚕️</span>Staff</div>
<div class="tabItem" onclick="switchTab('treatPage',this)"><span class="icon">💊</span>Sheets</div>
</div>

<script>
const URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const S=window.supabase.createClient(URL,KEY);
let allPatients=[];
function switchTab(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tabItem').forEach(t=>t.classList.remove('active')); el.classList.add('active'); window.scrollTo({top:0,behavior:'smooth'});}
function makeId(n){return 'KH-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString().slice(-4);}
async function addClient(){let name=fname.value.trim(); if(!name)return alert('Enter name'); let pid=makeId(name); let {error}=await S.from('patients').insert({patient_id:pid,full_name:name,age:parseInt(age.value)||null,gender:gender.value,diagnosis:diag.value,family_name:famname.value,family_phone:famphone.value,address:addr.value}); cmsg.innerText=error?'❌ '+error.message:'✅ Added '+name; if(!error){fname.value='';age.value='';gender.value='';diag.value='';famname.value='';famphone.value='';addr.value=''; load();}}
async function addStaff(){await S.from('staff').insert({name:sname.value,role:srole.value,phone:sphone.value,id_number:sid.value}); sname.value='';srole.value='';sphone.value=''; load();}
async function assignNurse(){let name=clientName.value.trim(); let v=nurseSelect.value.split('|'); if(!name||v.length<2)return alert('Select client & nurse'); let {data:pt}=await S.from('patients').select('patient_id').ilike('full_name','%'+name+'%').limit(1).single(); if(!pt)return alert('Client not found'); await S.from('patients').update({assigned_nurse_name:v[0],assigned_nurse_phone:v[1],assigned_nurse_role:v[2]}).eq('patient_id',pt.patient_id); alert('✅ '+v[0]+' assigned to '+name); load();}
async function addMed(){let name=clientName.value.trim(); if(!name)return alert('Enter client name'); let {data:pt}=await S.from('patients').select('patient_id').ilike('full_name','%'+name+'%').limit(1).single(); if(!pt)return alert('Client not found'); await S.from('treatment_sheets').insert({patient_id:pt.patient_id,drug_name:drug.value,dosage:dose.value,frequency:freq.value,times:times.value}); drug.value='';dose.value='';freq.value='';times.value=''; viewSheet(); load();}
async function viewSheet(){let name=clientName.value.trim(); if(!name)return; let {data:pt}=await S.from('patients').select('patient_id').ilike('full_name','%'+name+'%').limit(1).single(); if(!pt)return; let {data}=await S.from('treatment_sheets').select('*').eq('patient_id',pt.patient_id).eq('is_active',true); sheetPreview.innerHTML=(data||[]).map(m=>`<div class=treatItem><b>${m.drug_name}</b> ${m.dosage||''} ${m.frequency||''}<br><small>${m.times||''}</small></div>`).join('')||'<small>No meds yet</small>';}
function filterClients(){let q=search.value.toLowerCase(); renderClients(allPatients.filter(c=>c.full_name.toLowerCase().includes(q)));}
function renderClients(list){clientsList.innerHTML=list.map(c=>`<div class=clientCard><div class=avatar>${c.full_name.slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${c.full_name}</b><br><small style="color:var(--muted)">${c.diagnosis||'No diagnosis'} • ${c.address||''}<br><span class=pill pill-green>👩‍⚕️ ${c.assigned_nurse_name||'Not assigned'}</span></small></div><div style="text-align:right"><a href="nurse-entry.html?name=${encodeURIComponent(c.full_name)}" style="font-size:12px;font-weight:700;color:var(--teal)">Nurse</a><br><a href="family-view.html?name=${encodeURIComponent(c.full_name)}" style="font-size:12px;font-weight:700;color:var(--green)">Family</a></div></div>`).join('')||'No clients';}
async function load(){let {data:staff}=await S.from('staff').select('*').eq('active',true); staffList.innerHTML=(staff||[]).map(s=>`<span class="pill pill-green">${s.name} - ${s.role}</span>`).join(' ')||'No staff'; nurseSelect.innerHTML='<option>Select Nurse</option>'+(staff||[]).map(s=>`<option value="${s.name}|${s.phone}|${s.role}">${s.name} (${s.role})</option>`).join(''); statNurses.innerText=(staff||[]).length; let {data:p}=await S.from('patients').select('*').order('created_at',{ascending:false}); allPatients=p||[]; countBadge.innerText=allPatients.length+' Clients'; clientCount.innerText=allPatients.length+' total'; statClients.innerText=allPatients.length; dlist.innerHTML=allPatients.map(c=>`<option value="${c.full_name}">`).join(''); renderClients(allPatients); let {data:ts}=await S.from('treatment_sheets').select('*, patients!inner(full_name)').eq('is_active',true).limit(100); allSheets.innerHTML=(ts||[]).map(t=>`<div class=treatItem>${t.patients.full_name}: <b>${t.drug_name}</b> ${t.dosage||''}</div>`).join('')||'No sheets';}load();
</script></body></html>
