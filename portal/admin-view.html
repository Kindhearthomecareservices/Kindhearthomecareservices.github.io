<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin KindHeart</title><script src="config.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f3f7f3}header{background:#163f4f;color:#fff;padding:14px 18px;display:flex;justify-content:space-between} .card{background:#fff;border-radius:14px;padding:14px;margin:10px} .btn{padding:8px 12px;border-radius:8px;border:none;font-weight:700;cursor:pointer} .btn-p{background:#163f4f;color:#fff}.btn-g{background:#0a7a22;color:#fff}.btn-r{background:#c0392b;color:#fff}.btn-y{background:#f2c14e;color:#000} input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px 0} .item{border:1px solid #eee;border-radius:10px;padding:10px;margin:6px 0}</style>
</head><body>
<header><b>KindHeart Admin</b><button class="btn btn-y" onclick="location.href='index.html'">Hub</button></header>
<div id="login" class="card" style="max-width:400px;margin:40px auto"><h3>Admin Login</h3><input id="pass" type="password" placeholder="KindHeart@2024"><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button></div>
<div id="app" style="display:none">
<div class="card"><b>Patients: <span id="cPat">0</span></b> | Staff: <span id="cStaff">0</span></div>
<div class="card"><h3>Add Patient</h3><input id="pName" placeholder="Full Name"><input id="pLoc" placeholder="Location e.g Kapseret"><button class="btn btn-g" onclick="addPatient()">Generate KH Code & Save</button><div id="patList"></div></div>
<div class="card"><h3>Add Staff</h3><input id="sName" placeholder="Name"><select id="sType"><option>Nurse</option><option>Caregiver</option></select><input id="sPhone" placeholder="Phone 07xx"><button class="btn btn-g" onclick="addStaff()">Generate PIN & Save</button><div id="staffList"></div></div>
</div>
<script>
const H={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
function doLogin(){if(pass.value==='KindHeart@2024'){login.style.display='none';app.style.display='block';loadAll();}else alert('Wrong');}
async function loadAll(){try{let r=await fetch(SUPABASE_URL+"/rest/v1/patients?status=eq.Active",{headers:H});let d=await r.json();cPat.innerText=d.length||0; let r2=await fetch(SUPABASE_URL+"/rest/v1/nurses?is_active=eq.true",{headers:H});let d2=await r2.json();cStaff.innerText=d2.length||0; loadPatients(); loadStaff();}catch(e){alert(e)}}
async function addPatient(){const code='KH'+Math.floor(1000+Math.random()*9000);let res=await fetch(SUPABASE_URL+"/rest/v1/patients",{method:"POST",headers:H,body:JSON.stringify({full_name:pName.value,location:pLoc.value,family_code:code,family_pin:code})});if(!res.ok){alert(await res.text());return;}alert('Saved Code: '+code);pName.value='';pLoc.value='';loadAll();}
async function loadPatients(){let r=await fetch(SUPABASE_URL+"/rest/v1/patients?order=created_at.desc",{headers:H});let data=await r.json();let h='';data.forEach(p=>{h+=`<div class="item"><b>${p.full_name}</b> ${p.location} <b>${p.family_code}</b> <button class="btn btn-r" onclick="delPat('${p.id}')">Delete</button></div>`});patList.innerHTML=h;}
async function delPat(id){if(!confirm('Delete?'))return;await fetch(SUPABASE_URL+"/rest/v1/patients?id=eq."+id,{method:"DELETE",headers:H});loadAll();}
async function addStaff(){const pin=''+Math.floor(1000+Math.random()*9000);let res=await fetch(SUPABASE_URL+"/rest/v1/nurses",{method:"POST",headers:H,body:JSON.stringify({full_name:sName.value,staff_type:sType.value,phone:sPhone.value,pin:pin})});if(!res.ok){alert(await res.text());return;}alert('Staff PIN: '+pin);sName.value='';sPhone.value='';loadAll();}
async function loadStaff(){let r=await fetch(SUPABASE_URL+"/rest/v1/nurses?order=created_at.desc",{headers:H});let data=await r.json();let h='';data.forEach(s=>{h+=`<div class="item"><b>${s.full_name}</b> (${s.staff_type}) PIN:${s.pin} <button class="btn btn-r" onclick="delStaff('${s.id}')">Delete</button></div>`});staffList.innerHTML=h;}
async function delStaff(id){if(!confirm('Delete staff?'))return;await fetch(SUPABASE_URL+"/rest/v1/nurses?id=eq."+id,{method:"DELETE",headers:H});loadAll();}
</script></body></html>
