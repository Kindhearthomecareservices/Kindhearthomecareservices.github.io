<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KindHeart Admin - Command Centre V3.1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f4a5a;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--bg:#f7f8f5}
*{font-family:Inter,system-ui;box-sizing:border-box}
body{margin:0;background:var(--bg);padding-bottom:90px}
.top{background:var(--teal);color:#fff;padding:12px 14px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}
.top img{width:46px;height:46px;background:#fff;border-radius:12px;padding:5px;object-fit:contain;box-shadow:0 2px 6px #0002}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 4px;box-shadow:0 2px 10px #0001;border:1px solid #e5e7eb}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.kpi .c{background:#fff;border-radius:16px;padding:14px;border-left:4px solid var(--green);box-shadow:0 2px 6px #0001}
.page{display:none}.page.active{display:block}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;z-index:30}
.tabBtn{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:#667085;cursor:pointer}.tabBtn.active{color:var(--teal);font-weight:800;border-top:2px solid var(--teal)}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px;border-bottom:1px solid #f2f4f7}
input,select,textarea{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:10px;margin:5px 0;font-size:14px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
button.green{background:var(--green)}button.ghost{background:#f3f4f6;color:#111}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:50;padding:12px}.modal.show{display:flex}
.modalBox{background:#fff;width:100%;max-width:700px;border-radius:18px;padding:16px;max-height:92vh;overflow:auto}
.medForm{background:#f0fdf4;padding:12px;border-radius:12px;border:2px dashed #22c55e;margin:8px 0}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#eef6ee}
small.muted{color:#667085}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
</head><body>
<div class="top">
<img src="logo.png" onerror="this.src='./logo.png';this.onerror=null" alt="KindHeart Logo">
<div><b>KINDHEART HOMECARE</b><br><small>Command Centre V3.1 • Medications Direct Write</small></div>
<div style="margin-left:auto;text-align:right"><small id="todayDate"></small><br><button onclick="loadAll()" style="padding:7px 14px;background:#fff;color:#0f4a5a;border-radius:10px;margin-top:4px;font-weight:800">↻ Refresh</button></div>
</div>
