<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KindHeart Admin - Linked</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--teal:#0f4a5a;--green:#6bb64a;--bg:#f6f8f4;--border:#e8efe3;--muted:#667085}*{box-sizing:border-box;font-family:Inter,sans-serif;margin:0;padding:0}body{background:var(--bg);max-width:480px;margin:0 auto;padding-bottom:120px}.top{position:sticky;top:0;z-index:50;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.card{background:#fff;border-radius:20px;margin:12px 14px;padding:16px;border:1px solid var(--border);box-shadow:0 4px 18px rgba(15,74,90,.06)}input,select,textarea{width:100%;padding:12px;border:1.6px solid #d0d5dd;border-radius:13px;margin:6px 0;font-size:14px}.btn{width:100%;padding:12px;border-radius:13px;border:0;font-weight:800;cursor:pointer}.btn-teal{background:var(--teal);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-outline{background:#fff;border:1.6px solid var(--teal);color:var(--teal)}.row{display:flex;gap:8px}.row>*{flex:1}.pill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#e8f5e3;color:var(--teal);display:inline-block}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--green));color:#fff;display:grid;place-items:center;font-weight:800}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f2f4f7;align-items:center}.group{border:1px solid var(--border);border-radius:16px;margin:10px 0;overflow:hidden}.groupHead{background:#f8faf6;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.drugRow{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid #f2f4f7}.badge{background:var(--teal);color:#fff;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:800}.pages.page{display:none}.pages.page.active{display:block}.bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:100;border-radius:22px 22px 0 0}.tabBtn{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px;border-radius:12px}.tabBtn.active{color:var(--teal);background:#e8f5e3}.tabBtn span{font-size:20px}#editModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:200;align-items:flex-end}#editModal.show{display:flex}.modalBox{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px 24px;max-height:88vh;overflow:auto}.iconBtn{width:32px;height:32px;border-radius:50%;border:1px solid #d0d5dd;background:#fff;display:grid;place-items:center;cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
</head><body>
<div class="top"><div style="display:flex;gap:8px;align-items:center"><img src="logo.png" style="width:38px;height:38px" onerror="this.style.display='none'"><div><b style="color:var(--teal)">KindHeart <span style="color:var(--green)">Admin</span></b><div style="font-size:11px;color:var(--muted)">Wellbeing Linked</div></div></div><div class="badge" id="topCount">0</div></div>
<div class="pages">
<div id="p-home" class="page active">
<div class="card"><div class="row"><div style="background:#e8f5e3;padding:12px;border-radius:14px;flex:1"><small>Total Clients</small><div id="sClients" style="font-size:22px;font-weight:800;color:var(--teal)">0</div></div><div style="background:#eaf2ff;padding:12px;border-radius:14px;flex:1"><small>Active Staff</small><div id="sStaff" style="font-size:22px;font-weight:800;color:var(--teal)">0</div></div></div></div>
<div class="card"><h3>➕ Add Client</h3><input id="fname" placeholder="Full Name"><div class="row"><input id="age" type="number" placeholder="Age"><select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select></div><input id="diag" placeholder="Diagnosis"><input id="famname" placeholder="Family Name"><input id="famphone" placeholder="Family WhatsApp"><input id="addr" placeholder="Address"><button class="btn btn-teal" onclick="addClient()">Save Client</button><div id="cmsg" style="font-size:12px;font-weight:700;margin-top:6px"></div></div>
<div class="card"><h3>💊 Quick Assign & Treatment</h3><input id="cName" list="dlist" placeholder="Client Name" oninput="loadSheet()"><datalist id="dlist"></datalist><div class="row"><select id="roleFilter" onchange="filterNurses()"><option value="all">All Roles</option><option value="nurse">Nurses</option><option value="caregiver">Caregivers</option></select><select id="nurseSel"><option>Select Staff</option></select></div><button class="btn btn-green" onclick="assignStaff()">Assign</button><div id="assignMsg" style="font-size:12px;font-weight:700;margin-top:6px"></div><div style="margin-top:12px;border-top:1px dashed #e5e7eb;padding-top:10px"><div class="row"><input id="drug" placeholder="Drug"><input id="dose" placeholder="Dose"></div><div class="row"><select id="freq"><option>OD</option><option>BD</option><option>TDS</option></select><input id="times" placeholder="Morning, Evening"></div><button class="btn btn-outline" onclick="addTreatment()">+ Add Drug</button><div id="sheetPreview" style="margin-top:10px"></div></div></div>
</div>
<div id="p-clients" class="page"><div class="card"><h3>👥 Clients - Tap ✏️ to edit</h3><div id="listClients"></div></div></div>
<div id="p-staff" class="page"><div class="card"><h3>👩‍⚕️ Add Staff</h3><div class="row"><input id="sname" placeholder="Name"><select id="srole"><option>Nurse</option><option>Caregiver</option><option>RN</option></select></div><div class="row"><input id="sphone" placeholder="Phone"><input id="sid" placeholder="ID"></div><button class="btn btn-outline" onclick="addStaff()">+ Add</button></div><div class="card"><h3>Staff List</h3><div id="listStaff"></div></div></div>
<div id="p-sheets" class="page"><div class="card"><h3>💊 Sheets Grouped by Client</h3><div id="allSheets"></div></div></div>
<div id="p-reports" class="page"><div class="card"><h3>💚 Patient Wellbeing Reports (Live from Nurses)</h3><div id="reportList"></div></div></div>
</div>
<div class="bottomNav"><div class="tabBtn active" onclick="openTab('p-home',this)"><span>🏠</span>Home</div><div class="tabBtn" onclick="openTab('p-clients',this)"><span>👥</span>Clients</div><div class="tabBtn" onclick="openTab('p-staff',this)"><span>👩‍⚕️</span>Staff</div><div class="tabBtn" onclick="openTab('p-sheets',this)"><span>💊</span>Sheets</div><div class="tabBtn" onclick="openTab('p-reports',this)"><span>💚</span>Wellbeing</div></div>
<div id="editModal" onclick="if(event.target.id==='editModal')closeModal()"><div class="modalBox"><h3 id="modalTitle">Edit</h3><div id="modalBody" style="margin-top:10px"></div><div class="row" style="margin-top:12px"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button id="modalSave" class="btn btn-teal">Save</button></div><button id="modalDelete" class="btn" style="background:#fee4e2;color:#b42318;margin-top:8px">🗑️ Delete</button></div></div>
<script>
const SB_URL="https://enlvelqeqbmhamyqtzxj.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVubHZlbHFlcWJtaGFteXF0enhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUwOTM3NDMsImV4cCI6MjA2MDY2OTc0M30.5c3eU0OFOuelYmgIpMWC3TseZCTT_3nAhd1d2nVEbGY";
const supa=window.supabase.createClient(SB_URL,SB_KEY);
let allClients=[],allStaff=[],allSheets=[],staffFiltered=[];
function openTab(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(id==='p-reports')loadReports();if(id==='p-sheets')loadSheetsGrouped();}
function closeModal(){editModal.classList.remove('show');}function makeId(n){return 'KH-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,15)+'-'+Date.now().toString().slice(-4);}
function openModal(t,html,save,del){modalTitle.innerText=t;modalBody.innerHTML=html;editModal.classList.add('show');modalSave.onclick=save;modalDelete.style.display=del?'block':'none';modalDelete.onclick=del||(()=>{});}
function renderClients(){listClients.innerHTML=allClients.map(c=>`<div class=item><div class=avatar>${c.full_name.slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${c.full_name}</b><br><small>${c.diagnosis||''} • ${c.assigned_nurse_name||'Not assigned'} (${c.assigned_nurse_role||''})</small></div><div style="display:flex;gap:6px"><button class=iconBtn onclick="editClient('${c.patient_id}')">✏️</button><button class=iconBtn onclick="delClient('${c.patient_id}')">🗑️</button></div></div>`).join('');}
function editClient(pid){const c=allClients.find(x=>x.patient_id===pid);const html=`<input id=e_name value="${c.full_name}"><input id=e_diag value="${c.diagnosis||''}"><input id=e_fam value="${c.family_phone||''}"><input id=e_nurse value="${c.assigned_nurse_name||''}"><input id=e_role value="${c.assigned_nurse_role||''}">`;openModal('Edit Client',html,async()=>{await supa.from('patients').update({full_name:e_name.value,diagnosis:e_diag.value,family_phone:e_fam.value,assigned_nurse_name:e_nurse.value,assigned_nurse_role:e_role.value}).eq('patient_id',pid);closeModal();loadData();},async()=>{if(confirm('Delete?')){await supa.from('patients').delete().eq('patient_id',pid);closeModal();loadData();}});}
async function delClient(pid){if(confirm('Delete?')){await supa.from('patients').delete().eq('patient_id',pid);loadData();}}
function renderStaff(){listStaff.innerHTML=allStaff.map(s=>`<div class=item><div style="flex:1"><b>${s.name}</b> - ${s.role} ${s.phone||''}</div><button class=iconBtn onclick="delStaff('${s.id}')">🗑️</button></div>`).join('');}
async function delStaff(id){if(confirm('Delete staff?')){await supa.from('staff').delete().eq('id',id);loadData();}}
async function loadSheetsGrouped(){allSheets.innerHTML='Loading...';let {data}=await supa.from('treatment_sheets').select('*, patients!inner(full_name)').order('created_at',{ascending:false});const groups={};(data||[]).forEach(r=>{const k=r.patients.full_name;if(!groups[k])groups[k]=[];groups[k].push(r);});allSheets.innerHTML=Object.keys(groups).map(name=>`<div class=group><div class=groupHead><b>👤 ${name}</b><span class=pill>${groups[name].length} drugs</span></div><div>${groups[name].map(d=>`<div class=drugRow><div><b>${d.drug_name}</b> ${d.dosage||''} ${d.times||''}</div><div style="display:flex;gap:6px"><button class=iconBtn onclick="editDrug('${d.id}')">✏️</button><button class=iconBtn onclick="delDrug('${d.id}')">🗑️</button></div></div>`).join('')}</div></div>`).join('')||'No sheets';allSheets=data||[];}
function editDrug(id){const t=(allSheets.find?allSheets.find(x=>x.id===id):null)||{};const html=`<input id=e_drug value="${t.drug_name||''}"><div class=row><input id=e_dose value="${t.dosage||''}"><input id=e_times value="${t.times||''}"></div>`;openModal('Edit Drug',html,async()=>{await supa.from('treatment_sheets').update({drug_name:e_drug.value,dosage:e_dose.value,times:e_times.value}).eq('id',id);closeModal();loadSheetsGrouped();},async()=>{if(confirm('Delete?')){await supa.from('treatment_sheets').delete().eq('id',id);closeModal();loadSheetsGrouped();}});}
async function delDrug(id){if(confirm('Delete drug?')){await supa.from('treatment_sheets').delete().eq('id',id);loadSheetsGrouped();}}
async function addClient(){const name=fname.value.trim();if(!name)return alert('Enter name');cmsg.innerText='Saving...';const pid=makeId(name);let {error}=await supa.from('patients').insert({patient_id:pid,full_name:name,age:parseInt(age.value)||null,gender:gender.value,diagnosis:diag.value,family_name:famname.value,family_phone:famphone.value,address:addr.value});cmsg.innerText=error?'❌ '+error.message:'✅ Saved';if(!error){fname.value='';age.value='';diag.value='';famname.value='';famphone.value='';addr.value='';loadData();}}
async function addStaff(){const name=sname.value.trim();if(!name)return;await supa.from('staff').insert({name:name,role:srole.value,phone:sphone.value,id_number:sid.value});sname.value='';sphone.value='';sid.value='';loadData();}
function filterNurses(){const f=roleFilter.value.toLowerCase();staffFiltered=f==='all'?allStaff:allStaff.filter(s=>s.role.toLowerCase().includes(f));nurseSel.innerHTML='<option>Select Staff</option>'+staffFiltered.map(s=>`<option value="${s.name}|${s.phone}|${s.role}">${s.name} - ${s.role}</option>`).join('');}
async function assignStaff(){const cname=cName.value.trim();const val=nurseSel.value;if(!cname||!val.includes('|'))return alert('Select client and staff');assignMsg.innerText='Assigning...';const [nName,nPhone,nRole]=val.split('|');let {data:pt}=await supa.from('patients').select('patient_id').ilike('full_name','%'+cname+'%').limit(1).single();if(!pt)return assignMsg.innerText='Client not found';let {error}=await supa.from('patients').update({assigned_nurse_name:nName,assigned_nurse_phone:nPhone,assigned_nurse_role:nRole}).eq('patient_id',pt.patient_id);assignMsg.innerText=error?'❌ '+error.message:'✅ '+nName+' assigned';loadData();}
async function addTreatment(){const cname=cName.value.trim();if(!cname)return alert('Enter client');let {data:pt}=await supa.from('patients').select('patient_id').ilike('full_name','%'+cname+'%').limit(1).single();if(!pt)return alert('Client not found');await supa.from('treatment_sheets').insert({patient_id:pt.patient_id,drug_name:drug.value,dosage:dose.value,frequency:freq.value,times:times.value});drug.value='';dose.value='';times.value='';loadSheet();loadSheetsGrouped();}
async function loadSheet(){const cname=cName.value.trim();if(!cname)return;let {data:pt}=await supa.from('patients').select('patient_id').ilike('full_name','%'+cname+'%').limit(1).single();if(!pt)return;let {data}=await supa.from('treatment_sheets').select('*').eq('patient_id',pt.patient_id).order('created_at');sheetPreview.innerHTML=(data||[]).map(m=>`<div style="padding:6px;border-left:3px solid var(--green);background:#f8faf6;margin:4px 0;border-radius:8px"><b>${m.drug_name}</b> ${m.dosage||''} ${m.times||''}</div>`).join('');}
async function loadReports(){reportList.innerHTML='Loading...';let {data}=await supa.from('daily_sheets').select('*, patients!inner(full_name)').order('created_at',{ascending:false}).limit(30);if(!data||!data.length){reportList.innerHTML='No wellbeing reports yet';return;}reportList.innerHTML=data.map(r=>`<div style="padding:12px;border:1px solid var(--border);border-radius:14px;margin:8px 0;background:#fff"><b>💚 ${r.patients.full_name}</b> - ${new Date(r.created_at).toLocaleString()} - ${r.nurse_name||'Nurse'}<br><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><span class=pill>😊 ${r.mood||'-'}</span><span class=pill>🍽️ ${r.appetite||'-'} ${r.appetite_percent||''}%</span><span class=pill>😴 ${r.sleep_hours||'-'}</span><span class=pill>🚶 ${r.mobility||'-'}</span><span class=pill>💧 ${r.hydration_glasses||0} glasses</span><span class=pill>🩹 Pain ${r.pain_score||0}/10</span></div><small><b>Vitals:</b> BP ${r.bp_morning||'-'} HR ${r.hr_morning||'-'} Temp ${r.temp_morning||'-'}<br><b>ADL:</b> ${(r.adl_tasks?JSON.stringify(r.adl_tasks):r.nursing_cares||'')}<br><b>Story:</b> ${r.day_report||''}<br>Pills: ${r.pills_remaining||0} left (${r.days_left||0} days)</small></div>`).join('');}
async function loadData(){let {data:p}=await supa.from('patients').select('*').order('created_at',{ascending:false});allClients=p||[];topCount.innerText=allClients.length+' Clients';sClients.innerText=allClients.length;dlist.innerHTML=allClients.map(c=>`<option value="${c.full_name}">`).join('');renderClients();let {data:s}=await supa.from('staff').select('*').eq('active',true).order('created_at',{ascending:false});allStaff=s||[];sStaff.innerText=allStaff.length;staffFiltered=allStaff;filterNurses();renderStaff();loadSheetsGrouped();}
if(prompt('Admin PIN')!=='2024'){location.href='/';}else{loadData();}
</script></body></html>
