<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - KindHeart</title><style>body{font-family:system-ui;padding:16px;background:#f1f5f9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}.badge{padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}.low{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<script>if(prompt('Enter Admin PIN')!='2024'){alert('Wrong PIN');location.href='/';}</script>
<h2 style="color:#0f172a">KindHeart Admin Dashboard</h2><button onclick="load()" style="padding:8px 16px;border-radius:8px;border:0;background:#0f172a;color:#fff">Refresh</button>
<div id="stats" class="card" style="margin:12px 0"></div><div id="grid" class="grid"></div>
<script>
const URL="https://enlvelqeqbmhamyqtzxj.supabase.co"; const KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";
const supabase=window.supabase.createClient(URL,KEY);
async function load(){const {data,error}=await supabase.from('daily_sheets').select('*').order('created_at',{ascending:false}).limit(100);
if(error){stats.innerText=error.message;return}const latest={};data.forEach(r=>{if(!latest[r.patient_id])latest[r.patient_id]=r});const ps=Object.values(latest);
stats.innerHTML=`Active Patients: ${ps.length} | Low Stock (<5 days): ${ps.filter(p=>p.days_left<=4).length}`;
grid.innerHTML=ps.map(p=>`<div class=card><h3>${p.patient_id} <span class="badge ${p.days_left<=4?'low':'ok'}">${p.pills_remaining} left</span></h3><p>${new Date(p.created_at).toLocaleString()} | BP:${p.bp_morning} | ${p.avpu}</p><p>${(p.day_report||'').slice(0,120)}...</p><p><a href="family-view.html?id=${p.patient_id}" target="_blank">Open Family Link</a></p></div>`).join('')||'No reports yet - ask nurse to submit one';}load();
</script></body></html>
