<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f4f6f4;margin:0;padding:10px}.top{display:flex;gap:6px;overflow:auto;padding:6px}.top button{padding:10px 14px;border:0;border-radius:10px;font-weight:800;white-space:nowrap}.page{display:none}.page.active{display:block}.card{background:#fff;border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 2px 8px #0001}input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{padding:8px 12px;border:0;border-radius:8px;font-weight:700;margin:2px}.blue{background:#0f4a5a;color:#fff}.green{background:#22c55e;color:#fff}.red{background:#ef4444;color:#fff}.orange{background:#f59e0b}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.photo{width:100%;border-radius:10px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>
<div class="top"><button class="blue" onclick="showP('p-dash')">Dashboard</button><button class="blue" onclick="showP('p-patients')">Patients + Edit</button><button class="blue" onclick="showP('p-nurses')">Nurses</button><button class="blue" onclick="showP('p-assign')">Assign</button><button class="blue" onclick="showP('p-plans')">Tasks & Meds</button><button class="orange" onclick="showP('p-reports')">Reports+Photos</button></div>
<div id="p-dash" class="page active"><div class="card"><h3>Dashboard</h3><div class="grid"><div class="card"><b id="c-pat">0</b><br>Patients</div><div class="card"><b id="c-nurse">0</b><br>Nurses</div><div class="card"><b id="c-task">0</b><br>Tasks Today</div><div class="card"><b id="c-photo">0</b><br>Photos</div></div><button class="btn blue" onclick="loadDash()">Refresh</button></div></div>
<div id="p-patients" class="page"><div class="card"><h3 id="pTitle">Add Patient</h3><input id="p_name" placeholder="Full Name *"><input id="p_phone" placeholder="Patient Phone"><input id="p_fphone" placeholder="Family Phone (login)"><input id="p_fcode" placeholder="Family Code e.g. JACK123"><input id="p_loc" placeholder="Location"><textarea id="p_diag" placeholder="Diagnosis"></textarea><button class="btn green" onclick="savePatient()">💾 Save Patient</button><button class="btn" onclick="clearP()">Clear</button><input id="p_search" placeholder="Search..." oninput="loadPatients()"></div><div class="card"><div id="p_list"></div></div></div>
<div id="p-nurses" class="page"><div class="card"><h3>Add Real Nurse</h3><input id="n_name" placeholder="Full Name"><input id="n_phone" placeholder="Phone"><input id="n_pin" placeholder="PIN 2024"><button class="btn green" onclick="saveNurse()">Save Nurse</button></div><div class="card"><div id="n_list"></div></div></div>
<div id="p-assign" class="page"><div class="card"><h3>Assign Nurse to Patient</h3><select id="a_pat"></select><select id="a_nurse"></select><div class="grid"><select id="a_type"><option>Home Care</option><option>Hospital</option><option>Night</option></select><input id="a_start" value="08:00"><input id="a_end" value="18:00"></div><button class="btn green" onclick="doAssign()">Assign Now</button></div><div class="card"><div id="a_list"></div></div></div>
<div id="p-plans" class="page"><div class="card"><h3>Tasks & Meds for Patient</h3><select id="pl_pat" onchange="loadPlans()"></select><div class="grid"><div><h4>Tasks</h4><input id="t_name" placeholder="Task e.g. Vitals"><input id="t_time" placeholder="08:00"><input id="t_desc" placeholder="Description"><button class="btn green" onclick="addTask()">+ Task</button><div id="t_list"></div></div><div><h4>Meds</h4><input id="m_name" placeholder="Med e.g. Paracetamol"><input id="m_dose" placeholder="500mg"><input id="m_time" placeholder="08:00"><input id="m_inst" placeholder="Instructions"><button class="btn green" onclick="addMed()">+ Med</button><div id="m_list"></div></div></div></div></div>
<div id="p-reports" class="page"><div class="card"><h3>📸 Live Reports - Real Photos from Nurses</h3><button class="btn blue" onclick="loadReports()">Refresh</button><div id="r_list"></div></div></div>
<script>
const SUPA_URL="https://xdyoqxhqbeuiuvpsqlbb.supabase.co"; const SUPA_KEY="YOUR_ANON_KEY_HERE";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let editPid=null;
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active'); if(id==='p-patients')loadPatients(); if(id==='p-nurses')loadNurses(); if(id==='p-assign'){loadPatients();loadNurses();loadAssigns();} if(id==='p-plans')loadPatients(); if(id==='p-reports')loadReports(); if(id==='p-dash')loadDash();}
async function loadDash(){let {count:p}=await supa.from('patients').select('*',{count:'exact',head:true}); let {count:n}=await supa.from('nurses').select('*',{count:'exact',head:true}); let {count:ph}=await supa.from('care_records').select('*',{count:'exact',head:true}).not('photo_url','is',null); document.getElementById('c-pat').innerText=p||0; document.getElementById('c-nurse').innerText=n||0; document.getElementById('c-photo').innerText=ph||0;}
async function loadPatients(){let {data}=await supa.from('patients').select('*').order('created_at',{ascending:false}); let q=document.getElementById('p_search')?.value?.toLowerCase()||''; let f=data?.filter(d=>d.full_name.toLowerCase().includes(q))||[]; document.getElementById('p_list').innerHTML=f.map(p=>`<div class="item"><div><b>${p.full_name}</b><br><small>${p.location||''} | Code:${p.family_code||'NONE'}</small></div><div><button class="btn blue" onclick="editPat('${p.id}')">Edit</button><button class="btn red" onclick="delPat('${p.id}')">Del</button></div></div>`).join(''); let opts=data.map(p=>`<option value="${p.id}">${p.full_name}</option>`).join(''); document.getElementById('a_pat').innerHTML=opts; document.getElementById('pl_pat').innerHTML=opts;}
async function savePatient(){let payload={full_name:document.getElementById('p_name').value,phone:document.getElementById('p_phone').value,family_phone:document.getElementById('p_fphone').value,family_code:document.getElementById('p_fcode').value,location:document.getElementById('p_loc').value,diagnosis:document.getElementById('p_diag').value}; if(!payload.full_name){alert('Name needed');return;} if(editPid){await supa.from('patients').update(payload).eq('id',editPid);}else{await supa.from('patients').insert(payload);} clearP(); loadPatients();}
function clearP(){editPid=null; document.getElementById('pTitle').innerText='Add Patient'; ['p_name','p_phone','p_fphone','p_fcode','p_loc','p_diag'].forEach(i=>document.getElementById(i).value='');}
async function editPat(id){let {data}=await supa.from('patients').select('*').eq('id',id).single(); editPid=id; document.getElementById('pTitle').innerText='Edit '+data.full_name; document.getElementById('p_name').value=data.full_name; document.getElementById('p_phone').value=data.phone||''; document.getElementById('p_fphone').value=data.family_phone||''; document.getElementById('p_fcode').value=data.family_code||''; document.getElementById('p_loc').value=data.location||''; document.getElementById('p_diag').value=data.diagnosis||''; showP('p-patients');}
async function delPat(id){if(!confirm('Delete?'))return; await supa.from('patients').delete().eq('id',id); loadPatients();}
async function loadNurses(){let {data}=await supa.from('nurses').select('*').order('created_at',{ascending:false}); document.getElementById('n_list').innerHTML=(data||[]).map(n=>`<div class="item"><div>${n.full_name} - PIN:${n.pin}</div><button class="btn red" onclick="delN('${n.id}')">Del</button></div>`).join(''); document.getElementById('a_nurse').innerHTML=(data||[]).map(n=>`<option value="${n.id}">${n.full_name}</option>`).join('');}
async function saveNurse(){let payload={full_name:document.getElementById('n_name').value,phone:document.getElementById('n_phone').value,pin:document.getElementById('n_pin').value||'2024'}; if(!payload.full_name)return; await supa.from('nurses').insert(payload); document.getElementById('n_name').value=''; loadNurses();}
async function delN(id){await supa.from('nurses').delete().eq('id',id); loadNurses();}
async function loadAssigns(){let {data}=await supa.from('patient_assignments').select('*, patients(full_name), nurses(full_name)').order('created_at',{ascending:false}); document.getElementById('a_list').innerHTML=(data||[]).map(a=>`<div class="item"><div>${a.patients?.full_name} → ${a.nurses?.full_name} (${a.care_type})</div><button class="btn red" onclick="unAssign('${a.id}')">X</button></div>`).join('');}
async function doAssign(){let payload={patient_id:document.getElementById('a_pat').value,nurse_id:document.getElementById('a_nurse').value,care_type:document.getElementById('a_type').value,shift_start:document.getElementById('a_start').value,shift_end:document.getElementById('a_end').value}; await supa.from('patient_assignments').insert(payload); loadAssigns();}
async function unAssign(id){await supa.from('patient_assignments').delete().eq('id',id); loadAssigns();}
async function loadPlans(){let pid=document.getElementById('pl_pat').value; if(!pid)return; let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pid); let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pid); document.getElementById('t_list').innerHTML=(tasks||[]).map(t=>`<div class="item"><div>${t.time_to_do} ${t.task_name}</div><button class="btn red" onclick="delT('${t.id}')">X</button></div>`).join(''); document.getElementById('m_list').innerHTML=(meds||[]).map(m=>`<div class="item"><div>${m.time_to_give} ${m.medication_name}</div><button class="btn red" onclick="delM('${m.id}')">X</button></div>`).join('');}
async function addTask(){let pid=document.getElementById('pl_pat').value; await supa.from('treatment_tasks').insert({patient_id:pid,task_name:document.getElementById('t_name').value,time_to_do:document.getElementById('t_time').value,description:document.getElementById('t_desc').value}); document.getElementById('t_name').value=''; loadPlans();}
async function addMed(){let pid=document.getElementById('pl_pat').value; await supa.from('medications').insert({patient_id:pid,medication_name:document.getElementById('m_name').value,dosage:document.getElementById('m_dose').value,time_to_give:document.getElementById('m_time').value,instructions:document.getElementById('m_inst').value}); document.getElementById('m_name').value=''; loadPlans();}
async function delT(id){await supa.from('treatment_tasks').delete().eq('id',id); loadPlans();}
async function delM(id){await supa.from('medications').delete().eq('id',id); loadPlans();}
async function loadReports(){let {data}=await supa.from('care_records').select('*, patients(full_name), nurses(full_name)').order('created_at',{ascending:false}).limit(100); document.getElementById('r_list').innerHTML=(data||[]).map(r=>`<div class="card"><b>${r.patients?.full_name}</b> by ${r.nurses?.full_name} <small>${new Date(r.created_at).toLocaleString()}</small><br><span style="background:#eee;padding:3px 6px;border-radius:6px">${r.record_type}</span> ${r.details?.task||r.details?.med||r.details?.note||''}<br>${r.details?.vitals?`BP:${r.details.vitals.bp} Temp:${r.details.vitals.temp}`:''}${r.photo_url?`<img class="photo" src="${r.photo_url}">`:''}</div>`).join('')||'No reports';}
loadDash(); loadPatients(); loadNurses();
</script></body></html>
