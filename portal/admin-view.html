<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><style>:root{--b:#14495f;--g:#5ca94a}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f8faf6;color:var(--b)}#lock{position:fixed;inset:0;z-index:99;background:var(--b);display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:24px;text-align:center}.i{width:100%;padding:13px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0;background:#fff}.bt{padding:12px 18px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.bt-b{background:var(--b);color:#fff;width:100%}.nav{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:10px;border-bottom:3px solid var(--g)}.tabs{position:sticky;top:52px;background:#fff;display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid #eee;z-index:9}.tabs button{border:0;padding:8px 14px;border-radius:100px;background:#eaf3eb;font-weight:700}.tabs button.active{background:var(--b);color:#fff}.pg{display:none;padding:10px;max-width:1000px;margin:auto}.pg.active{display:block}.cd{background:#fff;border-radius:18px;padding:14px;margin:8px 0;box-shadow:0 6px 18px rgba(0,0,0,.05);border:1px solid #eef3f0}.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;gap:8px}.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.rw{grid-template-columns:1fr}}</style></head><body>
<div id="lock"><div class="box"><img src="../logo.png" style="width:60px"><h3>KindHeart Admin</h3><input id="pw" class="i" type="password" placeholder="" value=""><button class="bt bt-b" onclick="un()">Unlock</button><p id="er" style="color:red;display:none">Wrong</p></div></div>
<div id="ap" style="display:none"><div class="nav"><img src="../logo.png" style="width:36px"><b>KindHeart PREMIUM</b><button style="margin-left:auto;background:#fee4e4;color:#c00;border:0;padding:6px 10px;border-radius:20px" onclick="logout()">Logout</button></div>
<div class="tabs"><button class="active" onclick="sh('d',this)">Dashboard</button><button onclick="sh('p',this)">Patients</button><button onclick="sh('s',this)">Staff</button><button onclick="sh('a',this)">Assign</button><button onclick="sh('pl',this)">Plans</button><button onclick="sh('f',this)">Live</button></div>

<div id="d" class="pg active"><div class="cd"><h3>Overview</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div><b id="cp">0</b><br><small>Patients</small></div><div><b id="cs">0</b><br><small>Staff</small></div><div><b id="cph">0</b><br><small>Photos</small></div><div><b id="cr">0</b><br><small>Today</small></div></div></div></div>

<div id="p" class="pg"><div class="cd"><h3 id="pt">Add Client</h3>
<div class="rw"><input id="pn" class="i" placeholder="" value=""><input id="pp" class="i" placeholder="" value=""></div>
<div class="rw"><input id="pf" class="i" placeholder="" value=""><input id="ploc" class="i" placeholder="" value=""></div>
<div style="display:flex;gap:6px"><input id="pc" class="i" placeholder="" value=""><button class="bt" style="background:var(--g);color:#fff;width:auto" onclick="gp()">Generate PIN</button></div>
<textarea id="pd" class="i" placeholder="" style="height:60px"></textarea>
<div class="rw"><button class="bt bt-b" onclick="sp()">Save Client</button><button class="bt" style="background:#eee" onclick="cl()">Clear</button></div>
<div id="pb" style="display:none;padding:10px;border-radius:10px;margin-top:8px;font-weight:700"></div>
</div><div class="cd"><input id="ps" class="i" placeholder="" value="" oninput="lp()"><div id="plist"></div></div></div>

<div id="s" class="pg"><div class="cd"><h3>Staff</h3><input id="sn" class="i" placeholder="" value=""><div class="rw"><select id="sr" class="i"><option value=""></option><option value="Nurse">Nurse</option><option value="Caregiver">Caregiver</option></select><div style="display:flex;gap:6px"><input id="spin" class="i" placeholder="" value=""><button class="bt" style="background:var(--g);color:#fff" onclick="gs()">Gen</button></div></div><input id="sph" class="i" placeholder="" value=""><button class="bt bt-b" style="background:var(--g);margin-top:6px" onclick="ss()">Save Staff</button></div><div class="cd"><div id="slist"></div></div></div>

<div id="a" class="pg"><div class="cd"><select id="apat" class="i"><option value=""></option></select><select id="anur" class="i" style="margin-top:6px"><option value=""></option></select><button class="bt bt-b" style="margin-top:8px" onclick="da()">Assign</button></div><div class="cd"><div id="alist"></div></div></div>

<div id="pl" class="pg"><div class="cd"><select id="plpat" class="i" onchange="lpl()"><option value=""></option></select></div><div class="rw"><div class="cd"><input id="tn" class="i" placeholder="" value=""><div class="rw"><input id="tt" class="i" placeholder="" value=""><input id="td" class="i" placeholder="" value=""></div><button class="bt bt-b" style="background:var(--g)" onclick="at()">+ Task</button><div id="tlist"></div></div><div class="cd"><input id="mn" class="i" placeholder="" value=""><div class="rw"><input id="md" class="i" placeholder="" value=""><input id="mf" class="i" placeholder="" value=""></div><div class="rw"><input id="mdu" class="i" placeholder="" value=""><input id="mt" class="i" placeholder="" value=""></div><button class="bt bt-b" style="background:var(--g)" id="mb" onclick="am()">+ Med</button><div id="mlist"></div></div></div></div>

<div id="f" class="pg"><div class="cd"><button class="bt bt-b" style="width:auto" onclick="lf()">Refresh</button><div id="flist"></div></div></div></div>

<script>
const U="https://enlvelqeqbmhamyqtxzj.supabase.co";const K="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";const PASS="KindHeart@2024";let supa=supabase.createClient(U,K);
function un(){if(pw.value===PASS){lock.style.display='none';ap.style.display='block';sessionStorage.setItem('k','1');la();}else er.style.display='block';}
function logout(){sessionStorage.clear();location.reload();}
if(sessionStorage.getItem('k')){lock.style.display='none';ap.style.display='block';}
function sh(id,e){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.classList.add('active');if(id==='p')lp();if(id==='s')ls();if(id==='a'){lp();ls();lal();}if(id==='pl'){lp();lpl();}if(id==='f')lf();if(id==='d')ld();}
function gp(){let pin=Math.floor(1000+Math.random()*9000);let pre=(pn.value||'KH').substring(0,3).toUpperCase().replace(/[^A-Z]/g,'K');if(pn.value.trim()==='')pre='KH';pc.value=pre+pin;pb.style.display='block';pb.style.background="#e0f2e9";pb.innerText='PIN: '+pre+pin;}
function gs(){spin.value=Math.floor(1000+Math.random()*9000);}
let ep=null,es=null,em=null;
async function la(){ld();lp();ls();lal();lf();}
async function ld(){let {count:p}=await supa.from('patients').select('*',{count:'exact',head:true});let {count:s}=await supa.from('nurses').select('*',{count:'exact',head:true});cp.innerText=p||0;cs.innerText=s||0;}
async function lp(){let {data}=await supa.from('patients').select('*').order('created_at',{ascending:false});let q=(ps.value||'').toLowerCase();let f=q?data.filter(d=>d.full_name.toLowerCase().includes(q)):data;plist.innerHTML=f.map(p=>`<div class="it"><div><b>${p.full_name}</b><br><small>${p.family_code||''}</small></div><div><button class="bt" style="background:#eaf3eb;padding:6px 10px" onclick="epat('${p.id}')">Edit</button> <button class="bt" style="background:#fee4e4;color:#c00;padding:6px 10px" onclick="dpat('${p.id}')">Delete</button></div></div>`).join('')||'No clients';let o=(data||[]).map(p=>`<option value="${p.id}">${p.full_name}</option>`).join('');apat.innerHTML='<option value=""></option>'+o;plpat.innerHTML='<option value=""></option>'+o;}
async function sp(){let pl={full_name:pn.value.trim(),phone:pp.value.trim(),family_phone:pf.value.trim(),family_code:pc.value.trim(),family_pin:pc.value.trim(),location:ploc.value.trim(),diagnosis:pd.value.trim()};if(!pl.full_name||!pl.family_code){alert('Name + Generate PIN');return;}let r;if(ep)r=await supa.from('patients').update(pl).eq('id',ep).select();else r=await supa.from('patients').insert([pl]).select();if(r.error){alert(r.error.message);return;}pb.style.display='block';pb.style.background="#e0f2e9";pb.innerText='Saved: '+r.data[0].full_name+' - PIN '+r.data[0].family_code;cl();lp();ld();}
function cl(){ep=null;pt.innerText='Add Client';['pn','pp','pf','pc','ploc','pd'].forEach(i=>document.getElementById(i).value='');}
async function epat(id){let {data}=await supa.from('patients').select('*').eq('id',id).single();ep=id;pt.innerText='Edit Client';pn.value=data.full_name;pp.value=data.phone||'';pf.value=data.family_phone||'';pc.value=data.family_code||'';ploc.value=data.location||'';pd.value=data.diagnosis||'';pb.style.display='block';pb.style.background="#eef3f0";pb.innerText='Editing: '+data.full_name;sh('p',document.querySelectorAll('.tabs button')[1]);}
async function dpat(id){if(!confirm('Delete client?'))return;await supa.from('patients').delete().eq('id',id);lp();ld();}
async function ls(){let {data}=await supa.from('nurses').select('*').order('created_at',{ascending:false});slist.innerHTML=(data||[]).map(n=>`<div class="it"><div><b>${n.full_name}</b> - ${n.pin}</div><div><button class="bt" style="background:#eaf3eb;padding:6px 10px" onclick="enst('${n.id}')">Edit</button> <button class="bt" style="background:#fee4e4;color:#c00;padding:6px 10px" onclick="dn('${n.id}')">Delete</button></div></div>`).join('')||'No staff';anur.innerHTML='<option value=""></option>'+(data||[]).map(n=>`<option value="${n.id}">${n.full_name} - ${n.pin}</option>`).join('');}
async function enst(id){let {data}=await supa.from('nurses').select('*').eq('id',id).single();es=id;sn.value=data.full_name;spin.value=data.pin;sph.value=data.phone||'';sr.value=data.staff_type;sh('s',document.querySelectorAll('.tabs button')[2]);}
async function ss(){let pl={full_name:sn.value.trim(),phone:sph.value.trim(),pin:spin.value.trim(),staff_type:sr.value||'Nurse',role:sr.value||'Nurse',is_active:true};if(!pl.full_name||!pl.pin){alert('Name + PIN');return;}let r;if(es)r=await supa.from('nurses').update(pl).eq('id',es);else r=await supa.from('nurses').insert([pl]);if(r.error){alert(r.error.message);return;}es=null;sn.value='';sph.value='';spin.value='';sr.value='';ls();ld();}
async function dn(id){if(!confirm('Delete staff?'))return;await supa.from('nurses').delete().eq('id',id);ls();ld();}
async function lal(){let {data}=await supa.from('patient_assignments').select('*, patients(full_name), nurses(full_name)').order('created_at',{ascending:false});alist.innerHTML=(data||[]).map(a=>`<div class="it"><div>${a.patients?.full_name} → ${a.nurses?.full_name}</div><button class="bt" style="background:#fee4e4;color:#c00;padding:4px 8px" onclick="ua('${a.id}')">X</button></div>`).join('')||'None';}
async function da(){if(!apat.value||!anur.value)return alert('Select');await supa.from('patient_assignments').insert({patient_id:apat.value,nurse_id:anur.value});lal();}
async function ua(id){await supa.from('patient_assignments').delete().eq('id',id);lal();}
async function lpl(){let pid=plpat.value;if(!pid)return;let {data:t}=await supa.from('treatment_tasks').select('*').eq('patient_id',pid);let {data:m}=await supa.from('medications').select('*').eq('patient_id',pid);tlist.innerHTML=(t||[]).map(x=>`<div class="it"><div>${x.task_name}</div><button class="bt" style="background:#fee4e4;color:#c00;padding:4px 8px" onclick="dt('${x.id}')">Del</button></div>`).join('');mlist.innerHTML=(m||[]).map(x=>`<div class="it"><div>${x.medication_name}</div><div><button class="bt" style="background:#eaf3eb;padding:4px 8px" onclick="emf('${x.id}')">Edit</button> <button class="bt" style="background:#fee4e4;color:#c00;padding:4px 8px" onclick="dm('${x.id}')">Del</button></div></div>`).join('');}
async function at(){if(!plpat.value||!tn.value)return;await supa.from('treatment_tasks').insert({patient_id:plpat.value,task_name:tn.value,time_to_do:tt.value,description:td.value});tn.value='';tt.value='';td.value='';lpl();}
async function dt(id){await supa.from('treatment_tasks').delete().eq('id',id);lpl();}
async function emf(id){let {data}=await supa.from('medications').select('*').eq('id',id).single();mn.value=data.medication_name;md.value=data.dosage||'';mf.value=data.frequency||'';mdu.value=data.duration||'';mt.value=data.time_to_give||'';em=id;mb.innerText='Update';}
async function am(){let pl={patient_id:plpat.value,medication_name:mn.value,dosage:md.value,frequency:mf.value,duration:mdu.value,time_to_give:mt.value};if(em)await supa.from('medications').update(pl).eq('id',em);else await supa.from('medications').insert([pl]);em=null;mb.innerText='+ Med';['mn','md','mf','mdu','mt'].forEach(i=>document.getElementById(i).value='');lpl();}
async function dm(id){await supa.from('medications').delete().eq('id',id);lpl();}
async function lf(){let {data}=await supa.from('care_records').select('*, patients(full_name)').order('created_at',{ascending:false}).limit(50);flist.innerHTML=(data||[]).map(r=>`<div class="cd"><b>${r.patients?.full_name||''}</b> - ${r.status}<br><small>${r.details?.note||''}</small><br><button class="bt" style="background:#fee4e4;color:#c00;padding:4px 8px;margin-top:6px;width:auto" onclick="dr('${r.id}')">Delete</button></div>`).join('')||'No reports';}
async function dr(id){await supa.from('care_records').delete().eq('id',id);lf();}
la();
</script></body></html>
