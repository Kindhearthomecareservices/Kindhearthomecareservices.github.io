<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KindHeart Admin - Premium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui} body{margin:0;background:#f6f8f7;padding-bottom:90px}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.logo{display:flex;gap:8px;align-items:center}.logo img{height:36px}
.badge{background:#0f4a5a;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.card{background:#fff;margin:12px;border-radius:20px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.stat{display:flex;gap:12px}.stat div{flex:1;padding:14px;border-radius:16px}.s1{background:#e8f5e9}.s2{background:#e3f2fd}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin:6px 0;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-teal{background:#0f4a5a;color:#fff}.btn-green{background:#6bb64a;color:#fff}.btn-outline{background:#fff;border:2px solid #0f4a5a;color:#0f4a5a}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;display:flex;justify-content:space-around;padding:10px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20}
.nav button{border:none;background:0;flex:1;padding:6px;font-size:12px;color:#6b7280}.nav button.active{color:#0f4a5a;font-weight:800}
.tab{display:none}.tab.active{display:block;animation:fade.2s} @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.client-row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #f3f4f6}
.avatar{width:36px;height:36px;border-radius:50%;background:#0f4a5a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="header">
 <div class="logo"><img src="logo.png" onerror="this.style.display='none'"><div><b style="color:#0f4a5a">KindHeart</b> <b style="color:#6bb64a">Admin</b><div style="font-size:10px;color:#6b7280">Right care at home • Premium</div></div></div>
 <div class="badge" id="topBadge">0 Clients</div>
</div>

<!-- HOME TAB -->
<div id="tab-home" class="tab active">
 <div class="card stat"><div class="s1"><small>Total Clients</small><h2 id="cTotal" style="margin:4px 0;color:#0f4a5a">0</h2></div><div class="s2"><small>Active Nurses</small><h2 id="cNurse" style="margin:4px 0;color:#0f4a5a">0</h2></div></div>

 <div class="card">
  <b>➕ Add New Client</b> <small style="float:right;color:#6b7280">No ID needed - Use Name</small>
  <input id="p_name" placeholder="Full Name e.g Steve Torotich">
  <div style="display:flex;gap:8px"><input id="p_age" placeholder="Age" type="number"><select id="p_gender"><option value="">Male / Female</option><option>Male</option><option>Female</option></select></div>
  <input id="p_diag" placeholder="Diagnosis e.g Flu, Hypertension">
  <input id="p_family" placeholder="Family Contact Name">
  <input id="p_phone" placeholder="Family WhatsApp 07...">
  <input id="p_addr" placeholder="Address - Estate, Eldoret">
  <button type="button" class="btn btn-teal" onclick="addClient()">Save Client</button>
  <div id="msgClient" style="font-size:12px;margin-top:6px"></div>
 </div>

 <div class="card">
  <b>💊 Quick Assign & Treatment</b>
  <input id="q_client" placeholder="Type Client Name" list="clientsList"><datalist id="clientsList"></datalist>
  <select id="q_staff"><option value="">Select Nurse / Caregiver</option></select>
  <button type="button" class="btn btn-green" onclick="assignStaff()">Assign Nurse → Family will see name</button>
  <div id="msgAssign" style="font-size:12px;margin-top:6px"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><input id="d_name" placeholder="Drug e.g Amlodipine"><input id="d_dose" placeholder="5mg"></div>
  <div style="display:flex;gap:8px"><input id="d_freq" placeholder="BD / OD"><input id="d_times" placeholder="Morning, Evening"></div>
  <button type="button" class="btn btn-outline" onclick="addTreatment()">+ Add to Treatment Sheet</button>
  <div id="msgTreat" style="font-size:12px;margin-top:6px"></div>
 </div>
</div>

<!-- CLIENTS TAB -->
<div id="tab-clients" class="tab">
 <div class="card"><b>👥 All Clients</b><input id="searchClient" placeholder="Search client..." oninput="renderClients()"><div id="listClients" style="margin-top:10px"></div></div>
</div>

<!-- STAFF TAB -->
<div id="tab-staff" class="tab">
 <div class="card"><b>👩‍⚕️ Add Staff (Nurse or Caregiver)</b>
  <input id="s_name" placeholder="Name e.g Faith Chebet">
  <select id="s_role"><option>Nurse</option><option>RN</option><option>Caregiver</option><option>Clinical Officer</option></select>
  <input id="s_phone" placeholder="Phone 07..."><input id="s_id" placeholder="ID Number">
  <button type="button" class="btn btn-teal" onclick="addStaff()">Save Staff</button><div id="msgStaff"></div>
 </div>
 <div class="card"><b>Staff List</b><div id="listStaff"></div></div>
</div>

<!-- SHEETS TAB -->
<div id="tab-sheets" class="tab">
 <div class="card"><b>💊 Treatment Sheets</b><div id="listSheets"></div></div>
</div>

<div class="nav">
 <button id="b-home" class="active" onclick="switchTab('home')">🏠<br>Home</button>
 <button id="b-clients" onclick="switchTab('clients')">👥<br>Clients</button>
 <button id="b-staff" onclick="switchTab('staff')">👩‍⚕️<br>Staff</button>
 <button id="b-sheets" onclick="switchTab('sheets')">📋<br>Sheets</button>
</div>

<script>
const SUPA_URL="https://zifbnupmwizhhughupcu.supabase.co";
const SUPA_KEY="sb_publishable_Jn4BvMhT0V1Gk2o6N0o6_5d5a5a5a5a";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppZmJudXBt d2l6aGh1Z2h1cGN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4MTgwNzUsImV4cCI6MjA3NDM5NDA3NX0.pZ1cZzZzZzZzZzZzZzZ";
const S = supabase.createClient(SUPA_URL, ANON);

let allPatients=[], allStaff=[];
function switchTab(t){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.getElementById('tab-'+t).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 document.getElementById('b-'+t).classList.add('active');
 window.scrollTo(0,0);
 if(t==='clients') renderClients();
 if(t==='staff') renderStaff();
 if(t==='sheets') loadSheets();
}

async function init(){
 const {data:p}=await S.from('patients').select('*').order('created_at',{ascending:false});
 allPatients=p||[];
 const {data:s}=await S.from('staff').select('*').order('created_at',{ascending:false});
 allStaff=s||[];
 document.getElementById('cTotal').innerText=allPatients.length;
 document.getElementById('cNurse').innerText=allStaff.length;
 document.getElementById('topBadge').innerText=allPatients.length+' Clients';
 // populate datalist and dropdown
 const dl=document.getElementById('clientsList'); dl.innerHTML='';
 const qStaff=document.getElementById('q_staff'); qStaff.innerHTML='<option value=\"\">Select Nurse / Caregiver</option>';
 allPatients.forEach(p=>{ let o=document.createElement('option'); o.value=p.full_name; dl.appendChild(o); });
 allStaff.forEach(st=>{
   let opt=document.createElement('option');
   opt.value=JSON.stringify(st);
   opt.textContent=st.name+' - '+st.role+' ('+(st.role.toLowerCase().includes('care')?'Caregiver':'Nurse')+')';
   qStaff.appendChild(opt);
 });
 renderClients(); renderStaff(); loadSheets();
}

function renderClients(){
 const q=(document.getElementById('searchClient')?.value||'').toLowerCase();
 const c=document.getElementById('listClients'); c.innerHTML='';
 allPatients.filter(p=>p.full_name.toLowerCase().includes(q)).forEach(p=>{
  const ini=p.full_name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  c.innerHTML+=`<div class="client-row"><div class="avatar">${ini}</div><div style="flex:1"><b>${p.full_name}</b><div style="font-size:11px;color:#6b7280">${p.diagnosis||''} • ${p.assigned_nurse_name||'Not assigned'}</div></div><a href="family-view.html?name=${encodeURIComponent(p.full_name)}" style="font-size:11px">Family</a></div>`;
 });
}
function renderStaff(){
 const c=document.getElementById('listStaff'); c.innerHTML='';
 allStaff.forEach(s=>{
  c.innerHTML+=`<div class="client-row"><div class="avatar" style="background:#6bb64a">${s.name[0]}</div><div style="flex:1"><b>${s.name}</b><div style="font-size:11px">${s.role} • ${s.phone}</div></div></div>`;
 });
}

async function addClient(){
 const name=document.getElementById('p_name').value.trim(); if(!name) return alert('Enter name');
 const pid=name.toLowerCase().replace(/\s+/g,'_');
 const row={patient_id:pid, full_name:name, age:parseInt(document.getElementById('p_age').value)||null, gender:document.getElementById('p_gender').value, diagnosis:document.getElementById('p_diag').value, family_name:document.getElementById('p_family').value, family_phone:document.getElementById('p_phone').value, address:document.getElementById('p_addr').value};
 document.getElementById('msgClient').innerText='Saving...';
 const {error}=await S.from('patients').upsert(row,{onConflict:'patient_id'});
 document.getElementById('msgClient').innerText=error?'❌ '+error.message:'✅ Added '+name;
 if(!error){ document.getElementById('p_name').value=''; init(); }
}

async function addStaff(){
 const row={name:document.getElementById('s_name').value, role:document.getElementById('s_role').value, phone:document.getElementById('s_phone').value, id_number:document.getElementById('s_id').value};
 const {error}=await S.from('staff').insert(row);
 document.getElementById('msgStaff').innerText=error?'❌ '+error.message:'✅ Saved '+row.name;
 if(!error) init();
}

async function assignStaff(){
 const cname=document.getElementById('q_client').value.trim(); const sVal=document.getElementById('q_staff').value;
 if(!cname||!sVal) return alert('Select client and staff');
 const st=JSON.parse(sVal);
 document.getElementById('msgAssign').innerText='Assigning...';
 const pid=cname.toLowerCase().replace(/\s+/g,'_');
 const {error}=await S.from('patients').update({assigned_nurse_name:st.name, assigned_nurse_phone:st.phone, assigned_nurse_role:st.role}).eq('patient_id',pid);
 document.getElementById('msgAssign').innerText=error?'❌ '+error.message:'✅ '+st.name+' ('+st.role+') assigned to '+cname;
 if(!error) init();
}

async function addTreatment(){
 const cname=document.getElementById('q_client').value.trim(); if(!cname) return alert('Type client name first');
 const pid=cname.toLowerCase().replace(/\s+/g,'_');
 const row={patient_id:pid, drug_name:document.getElementById('d_name').value, dosage:document.getElementById('d_dose').value, frequency:document.getElementById('d_freq').value, times:document.getElementById('d_times').value};
 const {error}=await S.from('treatment_sheets').insert(row);
 document.getElementById('msgTreat').innerText=error?'❌ '+error.message:'✅ Added '+row.drug_name+' for '+cname;
 if(!error){ document.getElementById('d_name').value=''; loadSheets(); }
}

async function loadSheets(){
 const {data}=await S.from('treatment_sheets').select('*, patients(full_name)').order('created_at',{ascending:false}).limit(20);
 const c=document.getElementById('listSheets'); c.innerHTML='';
 (data||[]).forEach(r=>{ c.innerHTML+=`<div style="padding:8px;border-bottom:1px solid #eee"><b>${r.drug_name} ${r.dosage||''}</b> <small>for ${r.patients?.full_name||r.patient_id}</small><div style="font-size:11px;color:#6b7280">${r.frequency} • ${r.times}</div></div>`; });
}

init();
</script>
</body>
</html>
