<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KindHeart Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div class="brand-header">
 <div class="left"><img src="logo.png"><div><b>KindHeart Admin</b><br><a href="https://kindhearthomecareservices.co.ke">kindhearthomecareservices.co.ke</a> | 0707546365</div></div>
 <div><button onclick="location.reload()">↻ Refresh</button></div>
</div>
<div class="card grid2">
 <div>Active Patients: <b id="c1">2</b></div><div>Low Stock: <b id="cLow" style="color:red">0</b></div>
</div>
<div class="card">
 <h3>Add Treatment Sheet — AUTOMATED (Once for duration)</h3>
 <select id="pat" class="input"><option value="KHA5577">Mama Jane KHA5577</option></select>
 <input id="drug" class="input" placeholder="Drug Name e.g. Paracetamol 1g">
 <div class="grid2"><input id="dosage" class="input" placeholder="TDS / BD"><input id="total" type="number" class="input" placeholder="Total Qty e.g. 90"></div>
 <div class="grid2"><input id="start" type="date" class="input"><input id="duration" type="number" class="input" placeholder="Duration Days e.g. 30"></div>
 <input id="tNotes" class="input" placeholder="Notes: Give with meals">
 <button class="btn btn-green" onclick="addTreatment(pat.value,drug.value,dosage.value,tNotes.value,total.value,start.value,duration.value);alert('Added for '+duration.value+' days');render()">Save Treatment (Auto for duration)</button>
</div>

<div class="card"><h3>What Staff Has Done — Live Feed</h3><div id="feed"></div></div>
<script src="app.js"></script>
<script>
function render(){
 let db=initDB(); let html='';
 db.vitals.slice(-10).reverse().forEach(v=>{
   html+=`<div class="history-item ${v.is_abnormal?'red-alert':''}">${v.created_at.slice(0,16)} - ${v.staff_id} - BP ${v.bp}, Temp ${v.temp}, SpO2 ${v.spo2}%, HR ${v.hr} - ${v.status} <button onclick="delVital('${v.id}')">Del</button></div>`;
 });
 db.care_notes.slice(-10).reverse().forEach(n=>{
   html+=`<div class="history-item">${n.created_at.slice(0,16)} - ${n.staff_id} (${n.note_type}): ${n.content} <button onclick="delNote('${n.id}')">Del</button></div>`;
 });
 db.inventory.forEach(i=>{
   let cls=i.stock_status.includes('OUT')?'red-alert':i.stock_status.includes('Deplete')?'yellow-alert':'';
   html+=`<div class="history-item ${cls}">${i.item_name} - ${i.used_today} used - ${i.stock_status} - ${i.remaining} left - ${i.created_at?.slice(0,16)}</div>`;
 });
 document.getElementById('feed').innerHTML=html;
 document.getElementById('cLow').innerText=db.inventory.filter(i=>i.stock_status!=='In Stock').length;
}
function delVital(id){let db=initDB();db.vitals=db.vitals.filter(x=>x.id!==id);saveDB(db);render()}
function delNote(id){let db=initDB();db.care_notes=db.care_notes.filter(x=>x.id!==id);saveDB(db);render()}
initDB();render();
</script></body></html>
