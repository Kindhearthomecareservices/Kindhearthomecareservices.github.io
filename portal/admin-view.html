<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KindHeart</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--blue:#14495f;--green:#5ca94a;--bg:#f5faf6}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg)}.nav{position:sticky;top:0;z-index:9;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;box-shadow:0 2px 18px #0001;border-bottom:3px solid var(--green)}.nav img{width:44px;height:44px;object-fit:contain}.nav b{color:var(--blue);font-size:20px}.nav b span{color:var(--green)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e8efe9;position:sticky;top:60px;z-index:8}.tabs button{border:0;padding:9px 14px;border-radius:100px;font-weight:700;white-space:nowrap;background:#eaf3eb;color:var(--blue);font-size:13px}.tabs button.active{background:var(--blue);color:#fff}.page{display:none;padding:12px;max-width:960px;margin:auto}.page.active{display:block}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 24px #14495f0f;border:1px solid #e6efe7}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1.6px solid #ddeadd;border-radius:12px;font-size:14px}input:focus{border-color:var(--green);outline:none}.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.green{background:var(--blue);color:#fff}.lime{background:var(--green);color:#fff}.red{background:#fee4e4;color:#c00}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f5f1}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat>div{background:linear-gradient(135deg,#fff,#eef6ef);border-radius:16px;padding:14px;text-align:center;border:1px solid #e0ece2}.photo{width:100%;border-radius:14px;margin-top:8px;box-shadow:0 4px 14px #0002}</style></head><body>
<div class="nav"><img src="logo.png"><div><b>Kind<span>Heart</span></b><div style="font-size:10px;letter-spacing:2px;color:var(--blue);font-weight:700">HOMECARE SERVICES • ADMIN</div></div></div>
<div class="tabs"><button class="active" onclick="showP('p-dash',this)">Dashboard</button><button onclick="showP('p-patients',this)">Patients + Edit</button><button onclick="showP('p-nurses',this)">Nurses</button><button onclick="showP('p-assign',this)">Assign</button><button onclick="showP('p-plans',this)">Tasks & Meds</button><button onclick="showP('p-reports',this)">📸 Live Photos</button></div>
<div id="p-dash" class="page active"><div class="card"><h3 style="color:var(--blue);margin:4px 0">Executive Dashboard</h3><div class="stat"><div><b id="c-pat" style="font-size:26px;color:var(--blue)">0</b><br>Patients</div><div><b id="c-nurse" style="font-size:26px;color:var(--green)">0</b><br>Nurses</div><div><b id="c-photo" style="font-size:26px">0</b><br>Photos</div><div><b id="c-rec" style="font-size:26px">0</b><br>Reports</div></div><button class="btn green" onclick="loadDash()" style="margin-top:10px">Refresh</button></div></div>
<div id="p-patients" class="page"><div class="card"><h3 id="pTitle" style="color:var(--blue)">Add Patient</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="p_name" placeholder="Full Name *"><input id="p_phone" placeholder="Patient Phone"><input id="p_fphone" placeholder="Family Phone"><input id="p_fcode" placeholder="Family Code e.g. JACK123"><input id="p_loc" placeholder="Location Eldoret"><input id="p_search" placeholder="Search..." oninput="loadPatients()"></div><textarea id="p_diag" placeholder="Diagnosis"></textarea><button class="btn green" onclick="savePatient()">💾 Save Patient</button><button class="btn" onclick="clearP()">Clear</button></div><div class="card"><div id="p_list"></div></div></div>
<div id="p-nurses" class="page"><div class="card"><h3 style="color:var(--blue)">Add Real Nurse</h3><input id="n_name" placeholder="Full Name"><input id="n_phone" placeholder="Phone"><input id="n_pin" placeholder="PIN e.g. 2024"><button class="btn lime" onclick="saveNurse()">Save Nurse</button></div><div class="card"><div id="n_list"></div></div></div>
<div id="p-assign" class="page"><div class="card"><h3 style="color:var(--blue)">Assign Nurse to Patient</h3><select id="a_pat"></select><select id="a_nurse"></select><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><select id="a_type"><option>Home Care</option><option>Hospital</option><option>Night</option></select><input id="a_start" value="08:00"><input id="a_end" value="18:00"></div><button class="btn green" onclick="doAssign()">Assign Now</button></div><div class="card"><div id="a_list"></div></div></div>
<div id="p-plans" class="page"><div class="card"><h3 style="color:var(--blue)">Care Plan - Tasks & Medications</h3><select id="pl_pat" onchange="loadPlans()"></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><h4>📋 Tasks</h4><input id="t_name" placeholder="Task e.g. Vitals"><input id="t_time" placeholder="08:00"><input id="t_desc" placeholder="Description"><button class="btn lime" onclick="addTask()">+ Task</button><div id="t_list"></div></div><div><h4>💊 Meds</h4><input id="m_name" placeholder="Med e.g. Paracetamol"><input id="m_dose" placeholder="500mg"><input id="m_time" placeholder="08:00"><button class="btn lime" onclick="addMed()">+ Medication</button><div id="m_list"></div></div></div></div></div>
<div id="p-reports" class="page"><div class="card"><h3 style="color:var(--blue)">📸 Live Nurse Reports - True Photos</h3><button class="btn green" onclick="loadReports()">🔄 Refresh</button><div id="r_list"></div></div></div>
<script>
const SUPA_URL="https://enlveleqbqbmhamyqtxzj.supabase.co"; const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw"; const supa=supabase.createClient(SUPA_URL,SUPA_KEY); let editPid=null;
function showP(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active'); if(id==='p-patients')loadPatients(); if(id==='p-nurses')loadNurses(); if(id==='p-assign'){loadPatients();loadNurses();loadAssigns();} if(id==='p-plans')loadPatients(); if(id==='p-reports')loadReports(); if(id==='p-dash')loadDash();}
async function loadDash(){let {count:p}=await supa.from('patients').select('*',{count:'exact',head:true}); let {count:n}=await supa.from('nurses').select('*',{count:'exact',head:true}); let {count:ph}=await supa.from('care_records').select('*',{count:'exact',head:true}).not('photo_url','is',null); let {count:re}=await supa.from('care_records').select('*',{count:'exact',head:true}); document.getElementById('c-pat').innerText=p||0; document.getElementById('c-nurse').innerText=n||0; document.getElementById('c-photo').innerText=ph||0; document.getElementById('c-rec').innerText=re||0;}
async function loadPatients(){let {data}=await supa.from('patients').select('*').order('created_at',{ascending:false}); let q=document.getElementById('p_search')?.value?.toLowerCase()||''; let f=data?.filter(d=>d.full_name.toLowerCase().includes(q))||[]; document.getElementById('p_list').innerHTML=f.map(p=>`<div class="item"><div><b>${p.full_name}</b><br><small style="color:#789">${p.location||''} • Code: ${p.family_code||'NONE'}</small></div><div><button class="btn lime" onclick="editPat('${p.id}')">Edit</button><button class="btn red" onclick="delPat('${p.id}')">Del</button></div></div>`).join('')||'No patients yet'; let opts=(data||[]).map(p=>`<option value="${p.id}">${p.full_name}</option>`).join(''); document.getElementById('a_pat').innerHTML=opts; document.getElementById('pl_pat').innerHTML=opts;}
async function savePatient(){let payload={full_name:document.getElementById('p_name').value,phone:document.getElementById('p_phone').value,family_phone:document.getElementById('p_fphone').value,family_code:document.getElementById('p_fcode').value,location:document.getElementById('p_loc').value,diagnosis:document.getElementById('p_diag').value}; if(!payload.full_name)return alert('Name needed'); if(editPid)await supa.from('patients').update(payload).eq('id',editPid); else await supa.from('patients').insert(payload); clearP(); loadPatients(); loadDash();}
function clearP(){editPid=null; document.getElementById('pTitle').innerText='Add Patient'; ['p_name','p_phone','p_fphone','p_fcode','p_loc','p_diag'].forEach(i=>document.getElementById(i).value='');}
async function editPat(id){let {data}=await supa.from('patients').select('*').eq('id',id).single(); editPid=id; document.getElementById('pTitle').innerText='Edit '+data.full_name; document.getElementById('p_name').value=data.full_name; document.getElementById('p_phone').value=data.phone||''; document.getElementById('p_fphone').value=data.family_phone||''; document.getElementById('p_fcode').value=data.family_code||''; document.getElementById('p_loc').value=data.location||''; document.getElementById('p_diag').value=data.diagnosis||''; window.scrollTo(0,0);}
async function delPat(id){if(!confirm('Delete patient?'))return; await supa.from('patients').delete().eq('id',id); loadPatients();}
async function loadNurses(){let {data}=await supa.from('nurses').select('*').order('created_at',{ascending:false}); document.getElementById('n_list').innerHTML=(data||[]).map(n=>`<div class="item"><div><b>${n.full_name}</b><br><small>PIN:${n.pin}</small></div><button class="btn red" onclick="delN('${n.id}')">Del</button></div>`).join('')||'No nurses - Add first real nurse'; document.getElementById('a_nurse').innerHTML=(data||[]).map(n=>`<option value="${n.id}">${n.full_name}</option>`).join('');}
async function saveNurse(){let payload={full_name:document.getElementById('n_name').value,phone:document.getElementById('n_phone').value,pin:document.getElementById('n_pin').value||'2024'}; if(!payload.full_name)return; await supa.from('nurses').insert(payload); document.getElementById('n_name').value=''; loadNurses(); loadDash();}
async function delN(id){await supa.from('nurses').delete().eq('id',id); loadNurses();}
async function loadAssigns(){let {data}=await supa.from('patient_assignments').select('*, patients(full_name), nurses(full_name)').order('created_at',{ascending:false}); document.getElementById('a_list').innerHTML=(data||[]).map(a=>`<div class="item"><div>${a.patients?.full_name} → ${a.nurses?.full_name} <small>(${a.care_type})</small></div><button class="btn red" onclick="unAssign('${a.id}')">X</button></div>`).join('')||'No assignments';}
async function doAssign(){await supa.from('patient_assignments').insert({patient_id:document.getElementById('a_pat').value,nurse_id:document.getElementById('a_nurse').value,care_type:document.getElementById('a_type').value,shift_start:document.getElementById('a_start').value,shift_end:document.getElementById('a_end').value}); loadAssigns();}
async function unAssign(id){await supa.from('patient_assignments').delete().eq('id',id); loadAssigns();}
async function loadPlans(){let pid=document.getElementById('pl_pat').value; if(!pid)return; let {data:tasks}=await supa.from('treatment_tasks').select('*').eq('patient_id',pid); let {data:meds}=await supa.from('medications').select('*').eq('patient_id',pid); document.getElementById('t_list').innerHTML=(tasks||[]).map(t=>`<div class="item"><div>${t.time_to_do} ${t.task_name}</div><button class="btn red" onclick="delT('${t.id}')">X</button></div>`).join(''); document.getElementById('m_list').innerHTML=(meds||[]).map(m=>`<div class="item"><div>${m.time_to_give} ${m.medication_name}</div><button class="btn red" onclick="delM('${m.id}')">X</button></div>`).join('');}
async function addTask(){if(!document.getElementById('pl_pat').value)return alert('Select patient'); await supa.from('treatment_tasks').insert({patient_id:document.getElementById('pl_pat').value,task_name:document.getElementById('t_name').value,time_to_do:document.getElementById('t_time').value,description:document.getElementById('t_desc').value}); document.getElementById('t_name').value=''; loadPlans();}
async function addMed(){if(!document.getElementById('pl_pat').value)return alert('Select patient'); await supa.from('medications').insert({patient_id:document.getElementById('pl_pat').value,medication_name:document.getElementById('m_name').value,dosage:document.getElementById('m_dose').value,time_to_give:document.getElementById('m_time').value}); document.getElementById('m_name').value=''; loadPlans();}
async function delT(id){await supa.from('treatment_tasks').delete().eq('id',id); loadPlans();}
async function delM(id){await supa.from('medications').delete().eq('id',id); loadPlans();}
async function loadReports(){let {data}=await supa.from('care_records').select('*, patients(full_name), nurses(full_name)').order('created_at',{ascending:false}).limit(100); document.getElementById('r_list').innerHTML=(data||[]).map(r=>`<div class="card"><b>${r.patients?.full_name}</b> <small>by ${r.nurses?.full_name} • ${new Date(r.created_at).toLocaleString()}</small><br><span style="background:#e9f3ea;padding:4px 10px;border-radius:20px;font-size:12px">${r.record_type}</span> ${r.details?.task||r.details?.med||r.details?.note||''}<br>${r.details?.vitals?`BP:${r.details.vitals.bp} Temp:${r.details.vitals.temp}`:''}${r.photo_url?`<img class="photo" src="${r.photo_url}">`:''}</div>`).join('')||'No reports yet - Nurse will upload real photos';}
loadDash(); loadPatients(); loadNurses();
</script></body></html>
