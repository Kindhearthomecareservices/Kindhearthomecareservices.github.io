<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Portal - KindHeart</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--b:#14495f;--g:#5ca94a;--bg:#eef4eb}*{box-sizing:border-box}body{margin:0;font-family:Inter;background:var(--bg);color:var(--b)}#lock{position:fixed;inset:0;background:var(--b);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#fff;padding:28px;border-radius:22px;max-width:380px;width:100%;text-align:center}.i{width:100%;padding:12px 14px;border:2px solid #ddeadd;border-radius:12px;margin:6px 0}.bt{padding:11px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer}.nav{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;border-bottom:3px solid var(--g);z-index:10}.tabs{background:#fff;padding:10px;display:flex;gap:6px;overflow:auto;position:sticky;top:60px;z-index:9}.tabs button{border:0;padding:9px 16px;border-radius:100px;background:#eaf3eb;font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.on{background:var(--b);color:#fff}.pg{display:none;padding:12px;max-width:980px;margin:auto}.pg.on{display:block}.cd{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 18px rgba(20,73,95,.06)}.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f2f2f2;gap:10px}.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.rw{grid-template-columns:1fr}}.badge{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:800}.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.ov{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="lock"><div class="box"><img src="logo.png" style="width:70px"><h3>Admin Portal</h3><p style="font-size:12px;color:#5a8a5a">KindHeart Homecare<br><a href="https://kindhearthomecareservices.co.ke" style="color:var(--g)">kindhearthomecareservices.co.ke</a></p><input id="pw" class="i" type="password" placeholder="Password"><button class="bt" style="background:var(--b);color:#fff;width:100%" onclick="login()">Unlock</button><p id="err" style="color:red;display:none">Wrong password</p></div></div>
<div id="app" style="display:none"><div class="nav"><img src="logo.png" style="width:38px"><div><b>Admin Portal</b><br><a href="https://kindhearthomecareservices.co.ke" target="_blank" style="font-size:12px;color:var(--g);text-decoration:none">kindhearthomecareservices.co.ke</a></div><div style="margin-left:auto"><button style="background:#fee4e4;color:#c00;border:0;padding:6px 12px;border-radius:20px;font-weight:700" onclick="logout()">Logout</button></div></div>
<div class="tabs"><button class="on" onclick="show('d',this)">Dashboard</button><button onclick="show('p',this)">Patients</button><button onclick="show('s',this)">Staff</button><button onclick="show('a',this)">Assign</button><button onclick="show('c',this)">Care Plans</button><button onclick="show('r',this)">Reports Live</button></div>
<div id="d" class="pg on"><div class="cd"><h3>Dashboard - Live Overview</h3><div class="ov"><div class="cd" style="text-align:center;margin:0"><b id="cp" style="font-size:28px">0</b><br><small>Patients</small></div><div class="cd" style="text-align:center;margin:0"><b id="cs" style="font-size:28px">0</b><br><small>Staff</small></div><div class="cd" style="text-align:center;margin:0"><b id="cr" style="font-size:28px">0</b><br><small>Reports</small></div><div class="cd" style="text-align:center;margin:0"><b id="cv" style="font-size:28px">0</b><br><small>Vitals</small></div></div></div></div>
<div id="p" class="pg"><div class="cd"><h3 id="pt">Add Patient</h3><div class="rw"><input id="pn" class="i" placeholder="Full Name"><input id="pp" class="i" placeholder="Phone"></div><div class="rw"><input id="pf" class="i" placeholder="Family Phone"><input id="pl" class="i" placeholder="Location"></div><div style="display:flex;gap:8px"><input id="pc" class="i" placeholder="Family PIN"><button class="bt" style="background:var(--g);color:#fff;width:130px" onclick="gpin()">Generate</button></div><textarea id="pd" class="i" placeholder="Diagnosis" style="height:60px"></textarea><div class="rw"><button class="bt" style="background:var(--b);color:#fff" onclick="saveP()">Save</button><button class="bt" style="background:#eee" onclick="clearP()">Clear</button></div><div id="pb" style="display:none;padding:10px;margin-top:8px;border-radius:10px"></div></div><div class="cd"><input id="ps" class="i" placeholder="Search..." oninput="listP()"><div id="plist"></div></div></div>
<div id="s" class="pg"><div class="cd"><h3>Staff</h3><input id="sn" class="i" placeholder="Full Name"><div class="rw"><select id="sr" class="i"><option>Nurse</option><option>Caregiver</option></select><div style="display:flex;gap:6px"><input id="spin" class="i" placeholder="PIN"><button class="bt" style="background:var(--g);color:#fff" onclick="gspin()">Gen</button></div></div><input id="sph" class="i" placeholder="Phone"><button class="bt" style="background:var(--g);color:#fff;margin-top:6px" onclick="saveS()">Save Staff</button></div><div class="cd"><div id="slist"></div></div></div>
<div id="a" class="pg"><div class="cd"><h3>Assign Patient to Staff</h3><select id="ap" class="i"></select><select id="as" class="i" style="margin-top:6px"></select><button class="bt" style="background:var(--b);color:#fff;margin-top:8px" onclick="doAssign()">Assign</button></div><div class="cd"><div id="alist"></div></div></div>
<div id="c" class="pg"><div class="cd"><select id="cp_sel" class="i" onchange="listC()"><option value="">Select Patient</option></select></div><div class="rw"><div class="cd"><h4>Tasks</h4><input id="tn" class="i" placeholder="e.g. Bed Bath"><input id="tt" class="i" placeholder="Time 7am"><button class="bt" style="background:var(--g);color:#fff" onclick="addT()">+ Task</button><div id="tlist"></div></div><div class="cd"><h4>Meds</h4><input id="mn" class="i" placeholder="Drug"><div class="rw"><input id="md" class="i" placeholder="Dosage"><input id="mf" class="i" placeholder="Time"></div><button class="bt" style="background:var(--b);color:#fff" onclick="addM()">+ Med</button><div id="mlist"></div></div></div></div>
<div id="r" class="pg"><div class="cd"><h3>Live Feed of Reports</h3><button class="bt" style="background:var(--b);color:#fff;width:auto" onclick="listR()">Refresh</button><div id="rlist" style="margin-top:12px"></div></div></div></div>
<script>
const PASS="KindHeart@2024";let patients=JSON.parse(localStorage.getItem('kh_p')||'[]'),staff=JSON.parse(localStorage.getItem('kh_s')||'[]'),assigns=JSON.parse(localStorage.getItem('kh_a')||'[]'),tasks=JSON.parse(localStorage.getItem('kh_t')||'[]'),meds=JSON.parse(localStorage.getItem('kh_m')||'[]'),reports=JSON.parse(localStorage.getItem('kh_r')||'[]');let ep=null;
function save(){localStorage.setItem('kh_p',JSON.stringify(patients));localStorage.setItem('kh_s',JSON.stringify(staff));localStorage.setItem('kh_a',JSON.stringify(assigns));localStorage.setItem('kh_t',JSON.stringify(tasks));localStorage.setItem('kh_m',JSON.stringify(meds));localStorage.setItem('kh_r',JSON.stringify(reports));}
function login(){if(pw.value===PASS){lock.style.display='none';app.style.display='block';sessionStorage.setItem('k','1');init();}else err.style.display='block'}function logout(){sessionStorage.clear();location.reload()}if(sessionStorage.getItem('k')){lock.style.display='none';app.style.display='block';}
function show(id,e){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.classList.add('on');if(id==='p')listP();if(id==='s')listS();if(id==='a'){listP();listS();listA()}if(id==='c'){listP();listC()}if(id==='r')listR();if(id==='d')dash()}
function gpin(){let pre=(pn.value||'KH').slice(0,3).toUpperCase().replace(/[^A-Z]/g,'K')||'KH';pc.value=pre+Math.floor(1000+Math.random()*9000)}function gspin(){spin.value=Math.floor(1000+Math.random()*9000)}
function init(){dash();listP();listS();listA();listR()}function dash(){cp.innerText=patients.length;cs.innerText=staff.length;cr.innerText=reports.length;cv.innerText=reports.filter(r=>r.type==='Vitals').length;}
function listP(){let q=(ps.value||'').toLowerCase();let f=q?patients.filter(x=>x.full_name.toLowerCase().includes(q)):patients;plist.innerHTML=f.map(p=>`<div class="it"><div><b>${p.full_name}</b><br><small>PIN:${p.family_code} • ${p.location}</small></div><div style="display:flex;gap:6px"><button class="bt" style="background:#eaf3eb;width:auto" onclick="editP('${p.id}')">Edit</button><button class="bt" style="background:#fee4e4;color:#c00;width:auto" onclick="delP('${p.id}')">Del</button></div></div>`).join('')||'No patients';ap.innerHTML='<option value="">Select Patient</option>'+patients.map(p=>`<option value="${p.id}">${p.full_name} - ${p.family_code}</option>`).join('');cp_sel.innerHTML='<option value="">Select Patient</option>'+patients.map(p=>`<option value="${p.id}">${p.full_name}</option>`).join('')}
function saveP(){let d={id:ep||Date.now().toString(),full_name:pn.value.trim(),phone:pp.value.trim(),family_phone:pf.value.trim(),family_code:pc.value.trim(),location:pl.value.trim(),diagnosis:pd.value.trim()};if(!d.full_name||!d.family_code)return alert('Name + PIN');if(ep){let i=patients.findIndex(x=>x.id===ep);patients[i]=d}else patients.unshift(d);save();clearP();listP();dash()}function clearP(){ep=null;pt.innerText='Add Patient';['pn','pp','pf','pc','pl','pd'].forEach(i=>document.getElementById(i).value='')}function editP(id){let d=patients.find(x=>x.id===id);ep=id;pt.innerText='Edit: '+d.full_name;pn.value=d.full_name;pp.value=d.phone;pf.value=d.family_phone;pc.value=d.family_code;pl.value=d.location;pd.value=d.diagnosis;show('p',document.querySelectorAll('.tabs button')[1])}function delP(id){if(!confirm('Delete?'))return;patients=patients.filter(x=>x.id!==id);tasks=tasks.filter(x=>x.patient_id!==id);meds=meds.filter(x=>x.patient_id!==id);reports=reports.filter(x=>x.patient_id!==id);assigns=assigns.filter(x=>x.patient_id!==id);save();listP();dash()}
function listS(){slist.innerHTML=staff.map(s=>`<div class="it"><div><b>${s.full_name}</b> - ${s.role} - PIN ${s.pin}</div><div style="display:flex;gap:6px"><button class="bt" style="background:#eaf3eb;width:auto" onclick="editS('${s.id}')">Edit</button><button class="bt" style="background:#fee4e4;color:#c00;width:auto" onclick="delS('${s.id}')">Del</button></div></div>`).join('')||'No staff';as.innerHTML='<option value="">Select Staff</option>'+staff.map(s=>`<option value="${s.id}">${s.full_name} - ${s.pin}</option>`).join('')}function saveS(){let d={id:Date.now().toString(),full_name:sn.value.trim(),role:sr.value,pin:spin.value.trim(),phone:sph.value.trim()};if(!d.full_name||!d.pin)return alert('Name + PIN');staff.unshift(d);save();sn.value='';spin.value='';sph.value='';listS();dash();}function editS(id){let d=staff.find(x=>x.id===id);sn.value=d.full_name;sr.value=d.role;spin.value=d.pin;sph.value=d.phone;staff=staff.filter(x=>x.id!==id);save()}function delS(id){staff=staff.filter(x=>x.id!==id);assigns=assigns.filter(x=>x.staff_id!==id);save();listS();dash()}
function listA(){alist.innerHTML=assigns.map(a=>{let p=patients.find(x=>x.id===a.patient_id);let s=staff.find(x=>x.id===a.staff_id);return `<div class="it"><div>${p?.full_name||'?'} → ${s?.full_name||'?'} </div><button class="bt" style="background:#fee4e4;color:#c00;width:auto;padding:4px 8px" onclick="unassign('${a.id}')">X</button></div>`}).join('')||'No assignments'}function doAssign(){if(!ap.value||!as.value)return alert('Select both');assigns.unshift({id:Date.now().toString(),patient_id:ap.value,staff_id:as.value});save();listA();}function unassign(id){assigns=assigns.filter(x=>x.id!==id);save();listA()}
function listC(){let pid=cp_sel.value;if(!pid)return;tlist.innerHTML=tasks.filter(t=>t.patient_id===pid).map(t=>`<div class="it"><div>${t.name} - ${t.time}</div><button class="bt" style="background:#fee4e4;color:#c00;width:auto;padding:4px 8px" onclick="delT('${t.id}')">Del</button></div>`).join('')||'No tasks';mlist.innerHTML=meds.filter(m=>m.patient_id===pid).map(m=>`<div class="it"><div>${m.name} - ${m.dosage}</div><button class="bt" style="background:#fee4e4;color:#c00;width:auto;padding:4px 8px" onclick="delM('${m.id}')">Del</button></div>`).join('')||'No meds'}function addT(){if(!cp_sel.value||!tn.value)return alert('Select patient + task');tasks.unshift({id:Date.now().toString(),patient_id:cp_sel.value,name:tn.value,time:tt.value});save();tn.value='';tt.value='';listC()}function addM(){if(!cp_sel.value||!mn.value)return alert('Select patient + med');meds.unshift({id:Date.now().toString(),patient_id:cp_sel.value,name:mn.value,dosage:md.value,time:mf.value});save();mn.value='';md.value='';mf.value='';listC()}function delT(id){tasks=tasks.filter(x=>x.id!==id);save();listC()}function delM(id){meds=meds.filter(x=>x.id!==id);save();listC()}
function listR(){let html=reports.slice().reverse().map(r=>{let p=patients.find(x=>x.id===r.patient_id);let s=staff.find(x=>x.id===r.staff_id);let badge=r.type==='Vitals'?'<span class="badge" style="background:#e3f0ff;color:#1a4a8a">VITALS</span>':r.type==='Note'?'<span class="badge" style="background:#fff3db;color:#8a5a00">SOAP</span>':r.type==='Med'?'<span class="badge" style="background:#e8e0ff;color:#4a2a8a">MED</span>':'<span class="badge" style="background:#e0f2e9;color:#2a7a3b">TASK</span>';let details='';if(r.type==='Vitals'&&r.vitals){details=`BP: ${r.vitals.bp||'-'} | Temp: ${r.vitals.temp||'-'} | Pulse: ${r.vitals.pulse||'-'} | SpO2: ${r.vitals.spo2||'-'}%`;}else if(r.type==='Note'&&r.soap){details=`S:${r.soap.s||''} O:${r.soap.o||''} A:${r.soap.a||''} P:${r.soap.p||''}`;}else details=r.note||'';return `<div class="cd"><div style="display:flex;justify-content:space-between"><b>${p?.full_name||'Patient'}</b>${badge}</div><small>${s?.full_name||''} • ${new Date(r.time).toLocaleString()} • ${r.status||''}</small><p style="margin:8px 0">${details}</p><button class="bt" style="background:#fee4e4;color:#c00;width:auto;padding:4px 10px" onclick="delR('${r.id}')">Delete</button></div>`}).join('')||'No reports yet';rlist.innerHTML=html;dash()}function delR(id){reports=reports.filter(x=>x.id!==id);save();listR()}init();
</script></body></html>
