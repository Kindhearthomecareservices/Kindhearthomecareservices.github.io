<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindHeart Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#c8d5c0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.card{background:#fff;width:100%;max-width:380px;border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.15)}.logo{width:70px}h1{margin:8px 0 0;font-size:28px;color:#163f4f}h1 span{color:#5ca94a}.sub{letter-spacing:3px;font-size:11px;color:#7a8a7a;font-weight:800}.tag{color:#5ca94a;font-weight:800;font-size:14px;margin:6px 0}.inp{width:100%;padding:14px;border-radius:12px;border:1.5px solid #d6e6d0;margin:12px 0;font-size:16px;text-align:center;letter-spacing:2px}.btn{width:100%;padding:14px;border-radius:100px;border:none;font-weight:800;cursor:pointer;margin:6px 0}.btn-admin{background:#163f4f;color:#fff}.btn-nurse{background:#5ca94a;color:#fff}.btn-family{background:#fff;color:#163f4f;border:2px solid #163f4f}.btn-login{background:#163f4f;color:#fff}</style></head><body><div class="card"><div style="width:60px;height:60px;background:linear-gradient(135deg,#163f4f,#1e5a75);border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px">♥</div><h1>Kind<span>Heart</span></h1><div class="sub">HOMECARE SERVICES</div><div class="tag">💚 Right care at home 💚</div><input id="code" class="inp" placeholder="Enter Access PIN / Code" type="password"><button class="btn btn-login" onclick="doLogin()">Login →</button><div style="font-size:11px;color:#666;margin:8px 0">Admin • Staff • Family — One Link</div><div style="border-top:1px dashed #ddd;margin-top:12px;padding-top:12px"><button class="btn btn-admin" onclick="code.placeholder='Admin PIN'">Admin Portal</button><button class="btn btn-nurse" onclick="code.placeholder='Staff PIN e.g 1234'">Nurse / Caregiver Portal</button><button class="btn btn-family" onclick="code.type='text';code.placeholder='Family Code e.g KHA5577'">Family Portal</button></div><div style="margin-top:14px;font-size:11px"><a href="https://kindhearthomecareservices.co.ke" style="background:#e8f5e8;padding:6px 12px;border-radius:20px;text-decoration:none;color:#5ca94a;font-weight:700">www.kindhearthomecareservices.co.ke</a></div><p id="err" style="color:red;font-size:12px;display:none"></p></div><script>const SUPA_URL="https://enlvelqeqbmhamyqtxzj.supabase.co";const SUPA_KEY="sb_publishable_PIHnwkRKsXvvJjnVQRLx5g_l5SAXbQw";const supa=supabase.createClient(SUPA_URL,SUPA_KEY);const ADMIN_PIN="KindHeart@2024";async function doLogin(){let c=code.value.trim();if(!c){err.style.display='block';err.innerText='Enter PIN';return;}if(c===ADMIN_PIN){sessionStorage.setItem('role','admin');location.href='admin-view.html';return;}let {data:staff}=await supa.from('nurses').select('*').eq('pin',c).eq('is_active',true).maybeSingle();if(staff){sessionStorage.setItem('staff',JSON.stringify(staff));location.href='staff-portal.html';return;}let {data:pat}=await supa.from('patients').select('*').or(`family_code.eq.${c.toUpperCase()},family_pin.eq.${c.toUpperCase()}`).maybeSingle();if(pat){sessionStorage.setItem('fam',JSON.stringify(pat));location.href='family-portal.html';return;}err.style.display='block';err.innerText='Wrong PIN/Code - Ask Admin. Admin creates all PINs.';}</script></body></html>
