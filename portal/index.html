<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KindHeart Homecare Services</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js?v=3"></script>
<style>body{margin:0;min-height:100vh;background:#c7d6c0;display:grid;place-items:center;padding:18px;font-family:system-ui}
.card{background:#fff;width:100%;max-width:380px;border-radius:26px;padding:28px 20px 20px;box-shadow:0 18px 45px rgba(0,0,0,.18);text-align:center}
.logo{width:110px;height:110px;margin:0 auto}.logo img{width:100%;height:100%;object-fit:contain}
.btn{width:100%;padding:15px;border-radius:999px;font-weight:800;font-size:16px;border:2px solid transparent;cursor:pointer;margin-bottom:12px;display:block}
.btn-admin{background:#153a4d;color:#fff}.btn-nurse{background:#7ab55e;color:#fff}.btn-family{background:#fff;color:#153a4d;border-color:#153a4d}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:999}.modal.show{display:grid}
.box{background:#fff;border-radius:20px;padding:22px;width:90%;max-width:320px;text-align:center}
.box input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccc;letter-spacing:5px;text-align:center;font-size:18px;box-sizing:border-box}
.err{color:#c00;display:none;margin-top:8px;font-size:13px}
.web{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:999px;background:#d6e8cf;border:1.6px solid #7ab55e;color:#2e5a2e;font-weight:800;font-size:13px;text-decoration:none}
.phone{display:block;margin-top:12px;color:#153a4d;font-weight:800;text-decoration:none}
</style></head><body>
<div class="card">
<div class="logo"><img src="./logo.png"></div>
<h1 style="margin:8px 0 0;font-size:36px"><span style="color:#153a4d">Kind</span><span style="color:#6aa84f">Heart</span></h1>
<div style="font-size:11px;letter-spacing:3px;color:#8aa18a;font-weight:800">HOMECARE SERVICES</div>
<div style="color:#6aa84f;font-weight:800;margin:10px 0 2px">💚 Right care at home 💚</div>
<div style="font-size:11px;color:#6b7d6b;margin-bottom:18px">Compassionate Care. Professional Excellence.</div>
<button class="btn btn-admin" onclick="openLogin('admin')">Admin Portal</button>
<button class="btn btn-nurse" onclick="openLogin('staff')">Nurse / Caregiver Portal</button>
<button class="btn btn-family" onclick="openLogin('family')">Family Portal</button>
<div style="font-size:11px;color:#9aad9a;margin-top:8px">Secure • Premium • Eldoret & Beyond</div>
<a id="webLink" class="web" href="https://kindhearthomecareservices.co.ke">www.kindhearthomecareservices.co.ke</a>
<a id="phoneLink" class="phone" href="tel:0707546365">📞 0707546365</a>
</div>
<div id="modal" class="modal" onclick="if(event.target==this)closeM()"><div class="box">
<h4 id="mTitle">Enter PIN</h4><input id="mPin" type="password" placeholder="••••"><br>
<button class="btn btn-admin" style="margin-top:12px" onclick="go()">Enter</button>
<button class="btn btn-family" onclick="closeM()">Cancel</button>
<div id="mErr" class="err">Incorrect</div>
</div></div>
<script>
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cur='admin';
function openLogin(r){cur=r;document.getElementById('mTitle').innerText=r=='family'?'Enter Code':'Enter PIN';document.getElementById('mPin').value='';document.getElementById('mPin').type=r=='family'?'text':'password';document.getElementById('modal').classList.add('show');}
function closeM(){document.getElementById('modal').classList.remove('show');}
function showErr(){const e=document.getElementById('mErr');e.style.display='block';setTimeout(()=>e.style.display='none',2000);}
async function go(){const v=document.getElementById('mPin').value.trim();if(!v)return showErr();
if(cur=='admin'){if(v==ADMIN_PIN){localStorage.setItem('kh_role','admin');location.href='./admin.html';}else showErr();}
if(cur=='staff'){const {data,error}=await supa.from('nurses').select('*').eq('pin',v).eq('is_active',true).single();if(error||!data)return showErr();localStorage.setItem('kh_role','staff');localStorage.setItem('kh_nurse_id',data.id);localStorage.setItem('kh_nurse_name',data.full_name);location.href='./staff.html';}
if(cur=='family'){const c=v.toUpperCase();const {data,error}=await supa.from('patients').select('*').or(`family_code.eq.${c},family_pin.eq.${c}`).eq('status','Active').single();if(error||!data)return showErr();localStorage.setItem('kh_role','family');localStorage.setItem('kh_patient_id',data.id);location.href='./family.html';}
}
try{document.getElementById('phoneLink').href='tel:'+ORG_PHONE;document.getElementById('phoneLink').innerText='📞 '+ORG_PHONE;document.getElementById('webLink').href='https://'+ORG_WEBSITE;document.getElementById('webLink').innerText=ORG_WEBSITE;}catch(e){}
</script></body></html>
